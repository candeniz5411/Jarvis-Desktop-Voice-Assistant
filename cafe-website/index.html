<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kafe Web Sitesi</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brown-dark': '#3E2723',
            'cream-light': '#FFFDD0',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-cream-light text-brown-dark font-sans m-0 p-0 overflow-x-hidden">

  <!-- Navigation Bar -->
  <nav class="bg-brown-dark text-white p-4 flex items-center fixed w-full z-20 shadow-md">
    <!-- Hamburger Button -->
    <button id="hamburgerBtn" class="mr-4 focus:outline-none focus:ring-2 focus:ring-white rounded">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
    <h1 class="text-xl font-semibold tracking-wider">Kafe Logosu</h1>
  </nav>

  <!-- Sidebar Overlay -->
  <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden"></div>

  <!-- Sliding Sidebar -->
  <div id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-white shadow-xl z-40 transform -translate-x-full transition-transform duration-300 ease-in-out">
    <div class="p-6 bg-brown-dark text-white flex justify-between items-center">
      <h2 class="text-2xl font-bold">Menü</h2>
      <button id="closeSidebarBtn" class="focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
    <ul class="flex flex-col mt-4">
      <li><a href="#ana-sayfa" class="block px-6 py-3 hover:bg-gray-100 border-b border-gray-200">Ana Sayfa</a></li>
      <li><a href="#hakkinda" class="block px-6 py-3 hover:bg-gray-100 border-b border-gray-200">Hakkında</a></li>
      <li><a href="#destek" class="block px-6 py-3 hover:bg-gray-100 border-b border-gray-200">Destek</a></li>
      <li><a href="#iletisim" class="block px-6 py-3 hover:bg-gray-100 border-b border-gray-200">İletişim</a></li>
      <li><a href="#sube-konumlari" class="block px-6 py-3 hover:bg-gray-100 border-b border-gray-200">Şube Konumları</a></li>
      <li><a href="#menu-icerikleri" class="block px-6 py-3 hover:bg-gray-100 border-b border-gray-200">Menü İçerikleri</a></li>
      <li><a href="#fiyatlar" class="block px-6 py-3 hover:bg-gray-100">Fiyatlar</a></li>
    </ul>
  </div>

  <!-- Main Content Container -->
  <div class="pt-20 p-4 min-h-screen">
    <div id="app" class="max-w-4xl mx-auto">
      <!-- Content injected via app.js -->
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
