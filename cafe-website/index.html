<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cafe-brown': '#3E2723',
                        'cafe-cream': '#FFFDD0',
                    },
                    fontFamily: {
                        'heading': ['"Playfair Display"', 'serif'],
                        'body': ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Pre-declare arbitrary values used in app.js for Tailwind JIT -->
    <div class="hidden text-[#3E2723] bg-[#FFFDD0] border-[#3E2723]"></div>
</head>
<body class="bg-cafe-cream text-cafe-brown font-body m-0 p-0 flex flex-col min-h-screen relative overflow-x-hidden">

    <!-- Header -->
    <header class="bg-cafe-brown text-cafe-cream p-4 flex items-center shadow-md relative z-20">
        <!-- Hamburger Menu Button -->
        <button id="menu-btn" class="text-3xl focus:outline-none hover:opacity-80 transition-opacity z-30 relative mr-4" aria-label="Toggle Menu">
            <i class="fas fa-bars"></i>
        </button>

        <!-- Logo / Brand -->
        <div class="flex-grow text-center lg:text-left flex items-center justify-center lg:justify-start">
            <i class="fas fa-coffee text-2xl mr-2"></i>
            <h1 class="font-heading text-2xl font-bold tracking-wider uppercase">Kahve Dükkanı</h1>
        </div>
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden transition-opacity duration-300"></div>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-cafe-brown text-cafe-cream shadow-2xl transform -translate-x-full transition-transform duration-300 ease-in-out z-40 flex flex-col pt-20">
        <!-- Close Button -->
        <button id="close-btn" class="absolute top-4 right-4 text-3xl focus:outline-none hover:opacity-80 transition-opacity" aria-label="Close Menu">
            <i class="fas fa-times"></i>
        </button>

        <nav class="flex-grow px-4 py-6 space-y-4 text-lg">
            <a href="#home" class="block hover:text-gray-300 transition-colors py-2 border-b border-gray-600/30">Ana Sayfa</a>
            <a href="#hakkinda" class="block hover:text-gray-300 transition-colors py-2 border-b border-gray-600/30">Hakkında</a>
            <a href="#destek" class="block hover:text-gray-300 transition-colors py-2 border-b border-gray-600/30">Destek</a>
            <a href="#iletisim" class="block hover:text-gray-300 transition-colors py-2 border-b border-gray-600/30">İletişim</a>
            <a href="#subeler" class="block hover:text-gray-300 transition-colors py-2 border-b border-gray-600/30">Şube Konumları</a>
            <a href="#menu" class="block hover:text-gray-300 transition-colors py-2 border-b border-gray-600/30">Menü İçerikleri</a>
            <a href="#fiyatlar" class="block hover:text-gray-300 transition-colors py-2 border-b border-gray-600/30">Fiyatlar</a>
        </nav>
        <div class="p-4 text-sm text-center border-t border-gray-600/30 opacity-70">
            &copy; 2024 Kahve Dükkanı
        </div>
    </aside>

    <!-- Main Content Area (Routing Container) -->
    <main id="app" class="flex-grow p-4 md:p-8 w-full max-w-6xl mx-auto">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-cafe-brown text-cafe-cream text-center p-4 mt-auto">
        <p class="font-body text-sm">Hayat kahveyle güzel. Bizi ziyaret ettiğiniz için teşekkürler!</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
