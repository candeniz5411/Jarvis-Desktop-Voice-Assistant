<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            brown: '#3E2723',
                            cream: '#FFFDD0',
                            white: '#FFFFFF',
                            tan: '#D7CCC8'
                        }
                    },
                    fontFamily: {
                        heading: ['"Playfair Display"', 'serif'],
                        body: ['Lato', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <style type="text/tailwindcss">
        @layer utilities {
            .nav-link {
                @apply block px-4 py-3 text-brand-brown hover:bg-brand-tan hover:text-brand-brown transition-colors rounded-md text-lg font-heading;
            }
        }
    </style>
</head>
<body class="bg-brand-cream text-brand-brown font-body min-h-screen flex flex-col">
    <!-- Navbar -->
    <header class="bg-brand-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Hamburger Menu Button -->
                <div class="flex items-center">
                    <button id="menu-btn" class="p-2 rounded-md text-brand-brown hover:bg-brand-tan focus:outline-none focus:ring-2 focus:ring-inset focus:ring-brand-brown transition-colors">
                        <span class="sr-only">Menüyü aç</span>
                        <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
                <!-- Logo / Brand Name -->
                <div class="flex-shrink-0 flex items-center justify-center flex-1 lg:flex-none">
                    <a href="#/" class="font-heading font-bold text-2xl text-brand-brown flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-brand-brown" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v8l9-11h-7z" />
                        </svg>
                        Kahve Dükkanı
                    </a>
                </div>
                <div class="w-10"></div> <!-- Placeholder for balancing flex -->
            </div>
        </div>
    </header>

    <!-- Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>

    <!-- Sidebar -->
    <div id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-brand-white shadow-xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-brand-cream">
            <span class="font-heading font-bold text-xl text-brand-brown">Menü</span>
            <button id="close-menu-btn" class="p-2 rounded-md text-brand-brown hover:bg-brand-tan focus:outline-none">
                <span class="sr-only">Menüyü kapat</span>
                <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <nav class="flex-1 px-2 py-4 space-y-2 overflow-y-auto">
            <a href="#/hakkinda" class="nav-link">Hakkında</a>
            <a href="#/destek" class="nav-link">Destek</a>
            <a href="#/iletisim" class="nav-link">İletişim</a>
            <a href="#/subeler" class="nav-link">Şube Konumları</a>
            <a href="#/menu" class="nav-link">Menü İçerikleri</a>
            <a href="#/fiyatlar" class="nav-link">Fiyatlar</a>
        </nav>
    </div>

    <!-- Main Content Area -->
    <main id="app" class="flex-1 flex flex-col relative w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Content will be injected here via app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-brand-brown text-brand-cream py-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p>&copy; 2024 Kahve Dükkanı. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <!-- Force tailwind classes to be generated if they are only used in JS -->
    <div class="hidden text-[#3E2723] bg-[#FFFDD0]"></div>

    <!-- App Script -->
    <script src="app.js"></script>
</body>
</html>
