<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Web Sitesi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cafe-brown': '#3E2723',
                        'cafe-cream': '#FFFDD0',
                    },
                    fontFamily: {
                        'playfair': ['"Playfair Display"', 'serif'],
                        'lato': ['"Lato"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Lato', sans-serif;
            background-color: #ffffff; /* Default background, can be overridden */
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="bg-white text-gray-800">

    <!-- Header -->
    <header class="bg-cafe-brown text-cafe-cream p-4 flex items-center shadow-md relative z-20">
        <button id="menu-btn" class="p-2 focus:outline-none focus:ring-2 focus:ring-cafe-cream rounded z-30" aria-label="Menüyü aç">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <div class="ml-4 text-2xl font-playfair font-bold">Kafe Keyfi</div>
    </header>

    <!-- Sidebar & Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity duration-300"></div>

    <nav id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-cafe-cream text-cafe-brown z-50 transform -translate-x-full transition-transform duration-300 shadow-lg">
        <div class="p-4 flex justify-between items-center bg-cafe-brown text-cafe-cream">
            <span class="text-xl font-playfair font-bold">Menü</span>
            <button id="close-btn" class="p-2 focus:outline-none focus:ring-2 focus:ring-cafe-cream rounded" aria-label="Menüyü kapat">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <ul class="py-4 font-playfair text-lg">
            <li><a href="#/" class="block px-6 py-3 hover:bg-yellow-100 transition-colors">Ana Sayfa</a></li>
            <li><a href="#/hakkinda" class="block px-6 py-3 hover:bg-yellow-100 transition-colors">Hakkında</a></li>
            <li><a href="#/destek" class="block px-6 py-3 hover:bg-yellow-100 transition-colors">Destek</a></li>
            <li><a href="#/iletisim" class="block px-6 py-3 hover:bg-yellow-100 transition-colors">İletişim</a></li>
            <li><a href="#/subeler" class="block px-6 py-3 hover:bg-yellow-100 transition-colors">Şube Konumları</a></li>
            <li><a href="#/icerikler" class="block px-6 py-3 hover:bg-yellow-100 transition-colors">Menü İçerikleri</a></li>
            <li><a href="#/fiyatlar" class="block px-6 py-3 hover:bg-yellow-100 transition-colors">Fiyatlar</a></li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main id="app-content" class="p-4 md:p-8 max-w-4xl mx-auto">
        <!-- Content will be injected here by app.js -->
    </main>

    <script src="app.js"></script>
</body>
</html>
