<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cafe-brown': '#3E2723',
                        'cafe-cream': '#FFFDD0',
                    },
                    fontFamily: {
                        'heading': ['Playfair Display', 'serif'],
                        'body': ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .nav-link {
                @apply block py-3 px-4 text-cafe-cream hover:bg-white/10 rounded transition-colors duration-200 text-lg;
            }
        }
        body {
            font-family: 'Lato', sans-serif;
            background-color: #f9fafb; /* Light gray background */
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="bg-gray-50 text-cafe-brown overflow-x-hidden">

    <!-- Header / Navbar -->
    <header class="bg-cafe-brown text-cafe-cream p-4 fixed w-full top-0 z-40 flex items-center shadow-md">
        <!-- Hamburger Menu Button -->
        <button id="menu-btn" class="p-2 mr-4 focus:outline-none hover:bg-white/10 rounded">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <h1 class="text-2xl font-bold font-heading">Kafe</h1>
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity"></div>

    <!-- Sliding Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-cafe-brown text-cafe-cream z-50 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-xl overflow-y-auto pt-16">
        <!-- Close button (optional but good for accessibility) -->
        <button id="close-btn" class="absolute top-4 right-4 p-2 focus:outline-none hover:bg-white/10 rounded">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>

        <div class="px-4 py-6 flex flex-col space-y-2">
            <a href="#/" class="nav-link font-heading text-xl border-b border-white/20 pb-2 mb-2">Ana Sayfa</a>
            <a href="#/hakkinda" class="nav-link">Hakkında</a>
            <a href="#/destek" class="nav-link">Destek</a>
            <a href="#/iletisim" class="nav-link">İletişim</a>
            <a href="#/subeler" class="nav-link">Şube Konumları</a>
            <a href="#/menu" class="nav-link">Menü İçerikleri</a>
            <a href="#/fiyatlar" class="nav-link">Fiyatlar</a>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app-content" class="pt-20 px-4 md:px-8 pb-12 max-w-5xl mx-auto min-h-screen">
        <!-- Content injected by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-cafe-brown text-cafe-cream text-center p-4 mt-auto">
        <p>&copy; 2024 Kafe. Tüm hakları saklıdır.</p>
    </footer>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
