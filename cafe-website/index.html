<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            900: '#3E2723',
                            800: '#4E342E',
                            700: '#5D4037',
                            600: '#6D4C41',
                            500: '#795548',
                            400: '#8D6E63',
                            300: '#A1887F',
                            200: '#BCAAA4',
                            100: '#D7CCC8',
                            50: '#EFEBE9',
                        },
                        cream: '#FFFDD0'
                    },
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .nav-link {
                @apply block py-3 px-6 text-lg text-brown-900 hover:bg-brown-100 transition-colors duration-200 border-b border-brown-200;
            }
        }

        body {
            background-color: theme('colors.cream');
            color: theme('colors.brown.900');
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

    <!-- Navbar -->
    <header class="bg-white shadow-md py-4 px-6 fixed w-full top-0 z-40 flex items-center h-16">
        <!-- Hamburger Button -->
        <button id="menu-btn" class="text-brown-900 focus:outline-none p-2 mr-4" aria-label="Menüyü aç">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>

        <!-- Logo -->
        <div class="flex-1 flex justify-center md:justify-start">
            <a href="#/" class="font-serif font-bold text-2xl text-brown-900 tracking-wider flex items-center gap-2">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18.3 5H5.7C4.8 5 4 5.8 4 6.7V12c0 2.8 2.2 5 5 5h6c2.8 0 5-2.2 5-5V6.7c0-.9-.8-1.7-1.7-1.7zM18 12c0 1.7-1.3 3-3 3h-6c-1.7 0-3-1.3-3-3V7h12v5z"/>
                    <path d="M21 7h-1v5c0 1.7-1.3 3-3 3H7c-1.7 0-3-1.3-3-3V7H3v5c0 2.8 2.2 5 5 5h6c2.8 0 5-2.2 5-5V7h1z"/>
                    <path d="M4 19h16v2H4z"/>
                </svg>
                Kahve Dükkanı
            </a>
        </div>
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-white shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col pt-20 overflow-y-auto">
        <div class="px-6 mb-6">
            <h2 class="font-serif font-bold text-xl text-brown-900 mb-2 border-b-2 border-brown-900 pb-2">Menü</h2>
        </div>
        <div class="flex flex-col">
            <a href="#/hakkinda" class="nav-link" data-link>Hakkında</a>
            <a href="#/destek" class="nav-link" data-link>Destek</a>
            <a href="#/iletisim" class="nav-link" data-link>İletişim</a>
            <a href="#/subeler" class="nav-link" data-link>Şube Konumları</a>
            <a href="#/menu" class="nav-link" data-link>Menü İçerikleri</a>
            <a href="#/fiyatlar" class="nav-link" data-link>Fiyatlar</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow pt-16" id="app">
        <!-- Content will be injected here via app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-brown-900 text-white text-center py-6 mt-8">
        <p class="font-sans">&copy; 2024 Kahve Dükkanı. Tüm hakları saklıdır.</p>
    </footer>

    <!-- App JS -->
    <script src="app.js"></script>

    <!-- Dynamic Tailwind CSS Classes pre-declaration for JIT compiler -->
    <div class="hidden text-[#3E2723] bg-brown-100"></div>
</body>
</html>
