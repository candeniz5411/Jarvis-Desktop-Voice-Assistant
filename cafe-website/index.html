<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Web Sitesi</title>
    <!-- Google Fonts: Playfair Display (Headings) & Lato (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'coffee-dark': '#3E2723',
                        'coffee-medium': '#5D4037',
                        'coffee-light': '#8D6E63',
                        'cream': '#FFFDD0',
                        'white': '#FFFFFF'
                    },
                    fontFamily: {
                        heading: ['"Playfair Display"', 'serif'],
                        body: ['"Lato"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cream font-body text-coffee-dark antialiased">

    <!-- Top Navigation Bar -->
    <header class="fixed top-0 left-0 w-full bg-white shadow-md z-40 h-16 flex items-center px-4 justify-between">
        <button id="menu-btn" class="p-2 text-coffee-dark focus:outline-none hover:text-coffee-medium" aria-label="Menüyü Aç">
            <!-- Hamburger Icon (SVG) -->
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <div class="text-xl font-heading font-bold text-coffee-dark mr-2 md:mr-4">
            <a href="#home">Cafe Espresso</a>
        </div>
        <div class="w-8"></div> <!-- Spacer to balance hamburger -->
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>

    <!-- Sliding Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-white shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out">
        <div class="p-6 h-full flex flex-col">
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-2xl font-heading font-bold text-coffee-dark">Menü</h2>
                <button id="close-btn" class="text-coffee-dark hover:text-coffee-light focus:outline-none" aria-label="Menüyü Kapat">
                    <!-- Close Icon (SVG) -->
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <ul class="flex-1 space-y-4">
                <li><a href="#home" class="block text-lg font-medium hover:text-coffee-light transition-colors p-2 rounded hover:bg-cream">Ana Sayfa</a></li>
                <li><a href="#about" class="block text-lg font-medium hover:text-coffee-light transition-colors p-2 rounded hover:bg-cream">Hakkında</a></li>
                <li><a href="#support" class="block text-lg font-medium hover:text-coffee-light transition-colors p-2 rounded hover:bg-cream">Destek</a></li>
                <li><a href="#contact" class="block text-lg font-medium hover:text-coffee-light transition-colors p-2 rounded hover:bg-cream">İletişim</a></li>
                <li><a href="#branches" class="block text-lg font-medium hover:text-coffee-light transition-colors p-2 rounded hover:bg-cream">Şube Konumları</a></li>
                <li><a href="#menu-contents" class="block text-lg font-medium hover:text-coffee-light transition-colors p-2 rounded hover:bg-cream">Menü İçerikleri</a></li>
                <li><a href="#prices" class="block text-lg font-medium hover:text-coffee-light transition-colors p-2 rounded hover:bg-cream">Fiyatlar</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app" class="pt-16 min-h-screen px-4 md:px-8 py-8">
        <!-- Content will be injected here by app.js -->
    </main>

    <script src="app.js"></script>
</body>
</html>
