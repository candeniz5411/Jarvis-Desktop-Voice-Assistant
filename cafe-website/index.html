<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Portalı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            50: '#efebe9',
                            100: '#d7ccc8',
                            200: '#bcaaa4',
                            300: '#a1887f',
                            400: '#8d6e63',
                            500: '#795548',
                            600: '#6d4c41',
                            700: '#5d4037',
                            800: '#4e342e',
                            900: '#3E2723', // Primary dark brown
                        },
                        cream: '#FFFDD0'
                    },
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Lato', sans-serif;
        }
        h1, h2, h3, h4, h5, h6, .font-serif {
            font-family: 'Playfair Display', serif;
        }

        /* Smooth transitions for routing content */
        .fade-enter {
            opacity: 0;
            transform: translateY(10px);
        }
        .fade-enter-active {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 300ms ease-out, transform 300ms ease-out;
        }
    </style>
</head>
<body class="bg-cream text-brown-900 min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- Header / Navbar -->
    <header class="w-full p-4 flex items-center justify-between bg-cream border-b border-brown-200 z-20 relative">
        <button id="menu-btn" class="p-2 text-brown-900 hover:text-brown-600 focus:outline-none focus:ring-2 focus:ring-brown-500 rounded" aria-label="Menüyü Aç">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <a href="#/" class="text-2xl font-serif font-bold tracking-wider text-brown-900">KAHVE KÖŞESİ</a>
        <div class="w-12"></div> <!-- Placeholder for centering logo -->
    </header>

    <!-- Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden transition-opacity duration-300"></div>

    <!-- Sliding Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-brown-900 text-cream z-40 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-2xl flex flex-col">
        <div class="p-4 flex items-center justify-between border-b border-brown-700">
            <span class="text-xl font-serif font-bold">Menü</span>
            <button id="close-btn" class="p-2 text-cream hover:text-brown-200 focus:outline-none focus:ring-2 focus:ring-brown-400 rounded" aria-label="Menüyü Kapat">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <ul class="flex flex-col flex-grow py-4">
            <li><a href="#/" class="sidebar-link block px-6 py-3 hover:bg-brown-800 transition-colors">Ana Sayfa</a></li>
            <li><a href="#/hakkinda" class="sidebar-link block px-6 py-3 hover:bg-brown-800 transition-colors">Hakkında</a></li>
            <li><a href="#/destek" class="sidebar-link block px-6 py-3 hover:bg-brown-800 transition-colors">Destek</a></li>
            <li><a href="#/iletisim" class="sidebar-link block px-6 py-3 hover:bg-brown-800 transition-colors">İletişim</a></li>
            <li><a href="#/subeler" class="sidebar-link block px-6 py-3 hover:bg-brown-800 transition-colors">Şube Konumları</a></li>
            <li><a href="#/menu-icerikleri" class="sidebar-link block px-6 py-3 hover:bg-brown-800 transition-colors">Menü İçerikleri</a></li>
            <li><a href="#/fiyatlar" class="sidebar-link block px-6 py-3 hover:bg-brown-800 transition-colors">Fiyatlar</a></li>
        </ul>
        <div class="p-6 text-sm text-brown-400 text-center border-t border-brown-700">
            © 2023 Kahve Köşesi
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app-content" class="flex-grow flex flex-col items-center p-4 sm:p-8 w-full max-w-5xl mx-auto">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Hidden div to ensure Tailwind generates dynamic classes -->
    <div class="hidden grid-cols-1 md:grid-cols-2 gap-8 lg:grid-cols-3 max-w-3xl w-full text-center bg-white shadow-md rounded-lg p-8 mx-auto mt-8 mb-8 object-cover object-center w-full h-64 sm:h-96 md:h-[500px] border-b border-gray-200 py-3 flex justify-between font-bold text-xl space-y-4 space-y-6 list-disc pl-6 list-inside my-4 prose prose-brown"></div>

    <script src="app.js"></script>
</body>
</html>
