<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Web Sitesi</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'coffee-brown': '#3E2723',
                        'coffee-cream': '#FFFDD0',
                        'coffee-light': '#8D6E63',
                        'coffee-dark': '#1B100E'
                    },
                    fontFamily: {
                        'playfair': ['"Playfair Display"', 'serif'],
                        'lato': ['Lato', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FFFDD0;
            color: #3E2723;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
        }
        p, a, span, div, li {
            font-family: 'Lato', sans-serif;
        }

        /* Smooth transitions for routing content */
        .content-section {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }
        .content-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="font-lato bg-coffee-cream text-coffee-brown overflow-x-hidden min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="fixed top-0 left-0 w-full bg-coffee-brown text-coffee-cream shadow-md z-40 py-4 px-6 flex items-center justify-between">
        <div class="flex items-center">
            <!-- Hamburger Menu Button -->
            <button id="menu-toggle" class="focus:outline-none hover:text-gray-300 transition-colors" aria-label="Menüyü Aç">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <div class="ml-4 flex items-center hidden md:flex">
                <img src="./Images/logo.png" alt="Logo" class="h-10 w-10 mr-2 filter invert brightness-0 saturate-100" style="filter: brightness(0) invert(1) sepia(1) saturate(5) hue-rotate(30deg);">
                <span class="font-playfair text-xl font-bold">Kafe Keyfi</span>
            </div>
        </div>

        <div class="font-playfair text-xl md:hidden font-bold">
            Kafe Keyfi
        </div>

        <div>
            <!-- Optional Right Side items -->
        </div>
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>

    <!-- Sliding Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-coffee-brown text-coffee-cream z-50 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-2xl flex flex-col">
        <div class="p-6 border-b border-gray-600 flex justify-between items-center">
            <span class="font-playfair text-2xl font-bold">Menü</span>
            <button id="menu-close" class="focus:outline-none hover:text-gray-300 transition-colors" aria-label="Menüyü Kapat">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto" id="sidebar-nav">
            <!-- Links injected by app.js or written here -->
            <a href="#/" class="block py-3 px-4 rounded-lg hover:bg-coffee-light transition-colors sidebar-link">Ana Sayfa</a>
            <a href="#/hakkinda" class="block py-3 px-4 rounded-lg hover:bg-coffee-light transition-colors sidebar-link">Hakkında</a>
            <a href="#/destek" class="block py-3 px-4 rounded-lg hover:bg-coffee-light transition-colors sidebar-link">Destek</a>
            <a href="#/iletisim" class="block py-3 px-4 rounded-lg hover:bg-coffee-light transition-colors sidebar-link">İletişim</a>
            <a href="#/subeler" class="block py-3 px-4 rounded-lg hover:bg-coffee-light transition-colors sidebar-link">Şube Konumları</a>
            <a href="#/icerikler" class="block py-3 px-4 rounded-lg hover:bg-coffee-light transition-colors sidebar-link">Menü İçerikleri</a>
            <a href="#/fiyatlar" class="block py-3 px-4 rounded-lg hover:bg-coffee-light transition-colors sidebar-link">Fiyatlar</a>
        </nav>

        <div class="p-4 border-t border-gray-600 text-sm text-center text-gray-400">
            &copy; 2024 Kafe Keyfi
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 pt-20" id="main-content">
        <!-- Content will be dynamically injected here by app.js -->
    </main>

    <!-- App Script -->
    <script src="app.js"></script>
</body>
</html>
