<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Keyfi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            light: '#D7CCC8',
                            DEFAULT: '#795548',
                            dark: '#3E2723',
                        },
                        cream: '#FFFDD0',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .hidden {
                display: none;
            }
        }
    </style>
</head>
<body class="bg-cream text-coffee-dark font-sans h-screen flex flex-col m-0 p-0 overflow-x-hidden">

    <!-- This hidden div forces Tailwind to generate dynamic classes used in JS routing -->
    <div class="hidden bg-white shadow-lg p-6 rounded-lg text-center font-bold text-2xl mb-4 grid grid-cols-1 md:grid-cols-2 gap-4 border-b border-coffee-light py-3 flex justify-between items-center text-lg space-y-4 flex-grow w-full max-w-4xl mx-auto md:p-8 rounded-xl object-cover h-64 md:h-96 w-full object-center rounded-lg mt-4 mb-4 text-gray-700 text-3xl font-extrabold text-coffee-dark mb-6 text-center shadow"></div>

    <!-- Header -->
    <header class="bg-coffee text-white p-4 flex items-center justify-between shadow-md relative z-20">
        <button id="menu-btn" class="focus:outline-none p-2 hover:bg-coffee-dark rounded transition-colors" aria-label="Menüyü aç">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <div class="flex-grow text-center font-bold text-2xl tracking-widest uppercase cursor-pointer" onclick="window.location.hash=''">
            Kafe Keyfi
        </div>
        <div class="w-12"></div> <!-- Spacer for centering -->
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden transition-opacity"></div>

    <!-- Sidebar Menu -->
    <aside id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-white shadow-2xl z-40 transform -translate-x-full transition-transform duration-300 ease-in-out">
        <div class="p-6 bg-coffee text-white flex justify-between items-center">
            <h2 class="text-xl font-bold">Menü</h2>
            <button id="close-btn" class="focus:outline-none hover:text-coffee-light">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <nav class="p-4">
            <ul class="space-y-2">
                <li><a href="#hakkinda" class="menu-link block p-3 text-lg font-medium rounded hover:bg-coffee-light hover:text-coffee-dark transition-colors">Hakkında</a></li>
                <li><a href="#destek" class="menu-link block p-3 text-lg font-medium rounded hover:bg-coffee-light hover:text-coffee-dark transition-colors">Destek</a></li>
                <li><a href="#iletisim" class="menu-link block p-3 text-lg font-medium rounded hover:bg-coffee-light hover:text-coffee-dark transition-colors">İletişim</a></li>
                <li><a href="#sube-konumlari" class="menu-link block p-3 text-lg font-medium rounded hover:bg-coffee-light hover:text-coffee-dark transition-colors">Şube Konumları</a></li>
                <li><a href="#menu-icerikleri" class="menu-link block p-3 text-lg font-medium rounded hover:bg-coffee-light hover:text-coffee-dark transition-colors">Menü İçerikleri</a></li>
                <li><a href="#fiyatlar" class="menu-link block p-3 text-lg font-medium rounded hover:bg-coffee-light hover:text-coffee-dark transition-colors">Fiyatlar</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content Container -->
    <main id="app" class="flex-grow w-full max-w-4xl mx-auto p-4 md:p-8">
        <!-- Dynamic content will be injected here -->
    </main>

    <script>
        const menuBtn = document.getElementById('menu-btn');
        const closeBtn = document.getElementById('close-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuLinks = document.querySelectorAll('.menu-link');

        function toggleMenu() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        menuBtn.addEventListener('click', toggleMenu);
        closeBtn.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);

        // Close sidebar when a link is clicked
        menuLinks.forEach(link => {
            link.addEventListener('click', toggleMenu);
        });

        // Routing System
        const routes = {
            '': `
                <div class="text-center">
                    <h1 class="text-3xl font-extrabold text-coffee-dark mb-6">Kafe Keyfi'ne Hoş Geldiniz!</h1>
                    <p class="text-lg text-gray-700 mb-6">En taze çekirdekler, en sıcak ortam.</p>
                    <img src="./Images/coffee.jpg" alt="Kafe Keyfi" class="w-full h-64 md:h-96 object-cover object-center rounded-xl shadow-lg mt-4 mb-4">
                </div>
            `,
            '#hakkinda': `
                <div class="bg-white p-6 rounded-lg shadow">
                    <h1 class="text-3xl font-extrabold text-coffee-dark mb-6 border-b border-coffee-light pb-2">Hakkında</h1>
                    <p class="text-gray-700 text-lg">Kafe Keyfi, 2023 yılından beri misafirlerine en kaliteli kahve çekirdekleriyle unutulmaz lezzetler sunmayı amaçlamaktadır. Modern ve minimalist tasarımımızla kendinizi evinizde hissedeceksiniz.</p>
                </div>
            `,
            '#destek': `
                <div class="bg-white p-6 rounded-lg shadow">
                    <h1 class="text-3xl font-extrabold text-coffee-dark mb-6 border-b border-coffee-light pb-2">Destek</h1>
                    <p class="text-gray-700 text-lg">Her türlü soru, görüş ve öneriniz için buradayız. Müşteri hizmetlerimiz 7/24 hizmetinizdedir.</p>
                </div>
            `,
            '#iletisim': `
                <div class="bg-white p-6 rounded-lg shadow">
                    <h1 class="text-3xl font-extrabold text-coffee-dark mb-6 border-b border-coffee-light pb-2">İletişim</h1>
                    <ul class="text-gray-700 text-lg space-y-4">
                        <li><strong>Telefon:</strong> 0555 123 45 67</li>
                        <li><strong>E-posta:</strong> iletisim@kafekeyfi.com</li>
                        <li><strong>Adres:</strong> Kahve Sokak No:12, Merkez/Türkiye</li>
                    </ul>
                </div>
            `,
            '#sube-konumlari': `
                <div class="bg-white p-6 rounded-lg shadow">
                    <h1 class="text-3xl font-extrabold text-coffee-dark mb-6 border-b border-coffee-light pb-2">Şube Konumları</h1>
                    <ul class="text-gray-700 text-lg space-y-4">
                        <li>📍 <strong>Merkez Şube:</strong> Kahve Sokak No:12</li>
                        <li>📍 <strong>Sahil Şube:</strong> Deniz Yolu Cd. No:45</li>
                        <li>📍 <strong>Kampüs Şube:</strong> Üniversite Karşısı 1. Cadde</li>
                    </ul>
                </div>
            `,
            '#menu-icerikleri': `
                <div class="bg-white p-6 rounded-lg shadow">
                    <h1 class="text-3xl font-extrabold text-coffee-dark mb-6 border-b border-coffee-light pb-2">Menü İçerikleri</h1>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-lg text-gray-700">
                        <div class="flex justify-between border-b border-gray-200 py-3"><span>Espresso</span> <span class="font-bold text-coffee-dark">45₺</span></div>
                        <div class="flex justify-between border-b border-gray-200 py-3"><span>Cappuccino</span> <span class="font-bold text-coffee-dark">55₺</span></div>
                        <div class="flex justify-between border-b border-gray-200 py-3"><span>Latte</span> <span class="font-bold text-coffee-dark">60₺</span></div>
                        <div class="flex justify-between border-b border-gray-200 py-3"><span>Türk Kahvesi</span> <span class="font-bold text-coffee-dark">40₺</span></div>
                        <div class="flex justify-between border-b border-gray-200 py-3"><span>Çay</span> <span class="font-bold text-coffee-dark">25₺</span></div>
                        <div class="flex justify-between border-b border-gray-200 py-3"><span>Cheesecake</span> <span class="font-bold text-coffee-dark">70₺</span></div>
                        <div class="flex justify-between border-b border-gray-200 py-3"><span>Kruvasan</span> <span class="font-bold text-coffee-dark">50₺</span></div>
                        <div class="flex justify-between border-b border-gray-200 py-3"><span>Sandviç</span> <span class="font-bold text-coffee-dark">80₺</span></div>
                        <div class="flex justify-between border-b border-gray-200 py-3"><span>Soğuk Kahve</span> <span class="font-bold text-coffee-dark">65₺</span></div>
                        <div class="flex justify-between border-b border-gray-200 py-3"><span>Limonata</span> <span class="font-bold text-coffee-dark">35₺</span></div>
                    </div>
                </div>
            `,
            '#fiyatlar': `
                <div class="bg-white p-6 rounded-lg shadow">
                    <h1 class="text-3xl font-extrabold text-coffee-dark mb-6 border-b border-coffee-light pb-2">Fiyatlar</h1>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-lg text-gray-700">
                        <div class="flex justify-between border-b border-gray-200 py-3"><span>Espresso</span> <span class="font-bold text-coffee-dark">45₺</span></div>
                        <div class="flex justify-between border-b border-gray-200 py-3"><span>Cappuccino</span> <span class="font-bold text-coffee-dark">55₺</span></div>
                        <div class="flex justify-between border-b border-gray-200 py-3"><span>Latte</span> <span class="font-bold text-coffee-dark">60₺</span></div>
                        <div class="flex justify-between border-b border-gray-200 py-3"><span>Türk Kahvesi</span> <span class="font-bold text-coffee-dark">40₺</span></div>
                        <div class="flex justify-between border-b border-gray-200 py-3"><span>Çay</span> <span class="font-bold text-coffee-dark">25₺</span></div>
                        <div class="flex justify-between border-b border-gray-200 py-3"><span>Cheesecake</span> <span class="font-bold text-coffee-dark">70₺</span></div>
                        <div class="flex justify-between border-b border-gray-200 py-3"><span>Kruvasan</span> <span class="font-bold text-coffee-dark">50₺</span></div>
                        <div class="flex justify-between border-b border-gray-200 py-3"><span>Sandviç</span> <span class="font-bold text-coffee-dark">80₺</span></div>
                        <div class="flex justify-between border-b border-gray-200 py-3"><span>Soğuk Kahve</span> <span class="font-bold text-coffee-dark">65₺</span></div>
                        <div class="flex justify-between border-b border-gray-200 py-3"><span>Limonata</span> <span class="font-bold text-coffee-dark">35₺</span></div>
                    </div>
                </div>
            `
        };

        const app = document.getElementById('app');

        function renderRoute() {
            const hash = window.location.hash;
            app.innerHTML = routes[hash] || routes[''];
        }

        window.addEventListener('hashchange', renderRoute);
        window.addEventListener('load', renderRoute);
    </script>
</body>
</html>
