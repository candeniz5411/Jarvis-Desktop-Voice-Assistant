<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Web Sitesi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cafe: {
                            dark: '#3E2723',
                            light: '#FFFDD0',
                            accent: '#D7CCC8',
                            hover: '#5D4037'
                        }
                    },
                    fontFamily: {
                        heading: ['"Playfair Display"', 'serif'],
                        body: ['Lato', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Lato', sans-serif;
            background-color: #FFFDD0;
            color: #3E2723;
        }
        h1, h2, h3, h4, h5, h6, .font-heading {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="bg-cafe-light text-cafe-dark antialiased">

    <!-- Hidden div to pre-declare dynamic classes for Tailwind JIT -->
    <div class="hidden text-cafe-dark bg-cafe-light border-cafe-accent bg-white shadow-md rounded-lg p-6 mb-8 text-3xl font-bold font-heading space-y-4 list-disc pl-5"></div>

    <!-- Navigation Bar -->
    <header class="bg-cafe-dark text-cafe-light fixed w-full top-0 z-40 shadow-md">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center">
                <!-- Hamburger Menu Button -->
                <button id="menu-btn" class="focus:outline-none focus:ring-2 focus:ring-cafe-light rounded mr-4" aria-label="Menüyü aç">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <a href="#home" class="text-2xl font-heading font-bold tracking-wider">Kafe Lale</a>
            </div>
        </div>
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>

    <!-- Sliding Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-white shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-6 bg-cafe-dark text-cafe-light flex justify-between items-center">
            <span class="text-xl font-heading font-bold">Menü</span>
            <button id="close-btn" class="focus:outline-none focus:ring-2 focus:ring-cafe-light rounded" aria-label="Menüyü kapat">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto py-4">
            <ul class="space-y-2">
                <li><a href="#hakkinda" class="block px-6 py-3 hover:bg-cafe-accent text-cafe-dark hover:text-cafe-dark transition-colors font-semibold border-b border-gray-100">Hakkında</a></li>
                <li><a href="#destek" class="block px-6 py-3 hover:bg-cafe-accent text-cafe-dark hover:text-cafe-dark transition-colors font-semibold border-b border-gray-100">Destek</a></li>
                <li><a href="#iletisim" class="block px-6 py-3 hover:bg-cafe-accent text-cafe-dark hover:text-cafe-dark transition-colors font-semibold border-b border-gray-100">İletişim</a></li>
                <li><a href="#subeler" class="block px-6 py-3 hover:bg-cafe-accent text-cafe-dark hover:text-cafe-dark transition-colors font-semibold border-b border-gray-100">Şube Konumları</a></li>
                <li><a href="#menu-icerikleri" class="block px-6 py-3 hover:bg-cafe-accent text-cafe-dark hover:text-cafe-dark transition-colors font-semibold border-b border-gray-100">Menü İçerikleri</a></li>
                <li><a href="#fiyatlar" class="block px-6 py-3 hover:bg-cafe-accent text-cafe-dark hover:text-cafe-dark transition-colors font-semibold border-b border-gray-100">Fiyatlar</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main id="app" class="pt-20 pb-10 min-h-screen px-4 container mx-auto">
        <!-- Content will be injected here by app.js -->
    </main>

    <footer class="bg-cafe-dark text-cafe-light py-6 text-center">
        <p>&copy; 2024 Kafe Lale. Tüm hakları saklıdır.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
