<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Web Sitesi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cafe: {
                            dark: '#3E2723',
                            light: '#FFFDD0',
                        }
                    },
                    fontFamily: {
                        heading: ['Playfair Display', 'serif'],
                        body: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .nav-link {
                @apply block py-3 px-4 text-cafe-dark hover:bg-cafe-dark hover:text-cafe-light transition-colors duration-200 text-lg font-heading;
            }
        }
        body {
            @apply font-body bg-cafe-light text-cafe-dark overflow-x-hidden;
        }
        h1, h2, h3, h4, h5, h6 {
            @apply font-heading font-bold;
        }
    </style>
</head>
<body class="bg-cafe-light text-cafe-dark antialiased">
    <!-- Navbar -->
    <nav class="fixed top-0 left-0 w-full bg-cafe-light border-b border-cafe-dark/20 z-40 h-16 flex items-center px-4 justify-between shadow-sm">
        <div class="flex items-center">
            <!-- Hamburger Menu Button -->
            <button id="menu-btn" class="text-cafe-dark hover:text-cafe-dark/70 focus:outline-none p-2 mr-4" aria-label="Toggle Menu">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <a href="#/" class="text-2xl font-heading font-bold text-cafe-dark">Kafe <span class="opacity-80">Keyfi</span></a>
        </div>
    </nav>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-cafe-light shadow-xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out border-r border-cafe-dark/10">
        <div class="p-6 border-b border-cafe-dark/10 flex justify-between items-center">
            <h2 class="text-2xl text-cafe-dark">Menü</h2>
            <button id="close-btn" class="text-cafe-dark hover:text-cafe-dark/70 p-1" aria-label="Close Menu">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <nav class="mt-4 flex flex-col">
            <a href="#/hakkinda" class="nav-link">Hakkında</a>
            <a href="#/destek" class="nav-link">Destek</a>
            <a href="#/iletisim" class="nav-link">İletişim</a>
            <a href="#/subeler" class="nav-link">Şube Konumları</a>
            <a href="#/menu-icerikleri" class="nav-link">Menü İçerikleri</a>
            <a href="#/fiyatlar" class="nav-link">Fiyatlar</a>
        </nav>
    </aside>

    <!-- Main Content Container -->
    <main class="pt-16 min-h-screen">
        <div id="content" class="w-full max-w-4xl mx-auto p-6 md:p-8">
            <!-- Dynamic Content -->
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
