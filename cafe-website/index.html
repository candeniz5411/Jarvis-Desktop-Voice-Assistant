<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Keyfi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for sidebar if needed */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-[#FFFDD0] font-sans text-[#3E2723] h-screen overflow-hidden flex flex-col">

    <!-- Header -->
    <header class="bg-[#3E2723] text-[#FFFDD0] p-4 flex items-center shadow-md z-20 relative">
        <button id="menu-btn" class="text-2xl mr-4 focus:outline-none">
            <!-- Hamburger Icon SVG -->
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <h1 class="text-2xl font-bold tracking-wider">KAFE KEYFİ</h1>
    </header>

    <div class="flex flex-1 relative overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="absolute top-0 left-0 h-full w-64 bg-[#8B4513] text-[#FFFDD0] transform -translate-x-full transition-transform duration-300 ease-in-out z-10 shadow-lg overflow-y-auto">
            <nav class="p-4">
                <ul class="space-y-2">
                    <li><a href="#hakkinda" class="block p-3 hover:bg-[#A0522D] rounded transition">Hakkında</a></li>
                    <li><a href="#destek" class="block p-3 hover:bg-[#A0522D] rounded transition">Destek</a></li>
                    <li><a href="#iletisim" class="block p-3 hover:bg-[#A0522D] rounded transition">İletişim</a></li>
                    <li><a href="#sube-konumlari" class="block p-3 hover:bg-[#A0522D] rounded transition">Şube Konumları</a></li>
                    <li><a href="#menu-icerikleri" class="block p-3 hover:bg-[#A0522D] rounded transition">Menü İçerikleri</a></li>
                    <li><a href="#fiyatlar" class="block p-3 hover:bg-[#A0522D] rounded transition">Fiyatlar</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Overlay for mobile sidebar close -->
        <div id="overlay" class="absolute inset-0 bg-black opacity-0 pointer-events-none transition-opacity duration-300 z-0"></div>

        <!-- Main Content -->
        <main id="app" class="flex-1 p-6 overflow-y-auto w-full">
            <!-- Content will be injected here by app.js -->
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
