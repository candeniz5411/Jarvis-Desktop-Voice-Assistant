<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            brown: '#3E2723',
                            cream: '#FFFDD0',
                            light: '#F5F5F5',
                            accent: '#8D6E63'
                        }
                    },
                    fontFamily: {
                        heading: ['"Playfair Display"', 'serif'],
                        body: ['"Lato"', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <style type="text/tailwindcss">
        @layer utilities {
            .nav-link {
                @apply block py-3 px-6 text-brand-cream hover:bg-brand-accent transition-colors duration-200 text-lg font-heading;
            }
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: #FFFDD0;
            color: #3E2723;
        }

        h1, h2, h3, h4, h5, h6, .font-heading {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="bg-brand-cream text-brand-brown min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- Header -->
    <header class="bg-brand-brown text-brand-cream p-4 flex items-center shadow-md relative z-20">
        <!-- Hamburger Menu Button -->
        <button id="menu-btn" class="p-2 mr-4 focus:outline-none focus:ring-2 focus:ring-brand-cream rounded" aria-label="Toggle menu">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>

        <!-- Logo/Title -->
        <h1 class="text-2xl font-heading font-bold flex-1 text-center pr-12 cursor-pointer" onclick="window.location.hash=''">
            <span class="mr-2">☕</span>Kahve Dükkanı
        </h1>
    </header>

    <!-- Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-brand-brown z-40 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-2xl overflow-y-auto">
        <div class="p-6 border-b border-brand-accent">
            <h2 class="text-2xl font-heading font-bold text-brand-cream flex items-center">
                <span class="mr-2">☕</span>Menü
            </h2>
            <button id="close-menu-btn" class="absolute top-4 right-4 text-brand-cream hover:text-brand-light focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <div class="py-4">
            <a href="#hakkinda" class="nav-link">1. Hakkında</a>
            <a href="#destek" class="nav-link">2. Destek</a>
            <a href="#iletisim" class="nav-link">3. İletişim</a>
            <a href="#subeler" class="nav-link">4. Şube Konumları</a>
            <a href="#menu" class="nav-link">5. Menü İçerikleri</a>
            <a href="#fiyatlar" class="nav-link">6. Fiyatlar</a>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="content" class="flex-grow p-6 w-full max-w-6xl mx-auto">
        <!-- Content will be injected here via JavaScript -->
    </main>

    <!-- Footer -->
    <footer class="bg-brand-brown text-brand-cream p-6 text-center mt-auto">
        <p class="font-body text-sm">&copy; 2023 Kahve Dükkanı. Tüm hakları saklıdır.</p>
    </footer>

    <!-- Hidden div for Tailwind JIT to pick up dynamic classes -->
    <div class="hidden">
        <div class="text-[#3E2723] bg-[#FFFDD0] border-[#3E2723]"></div>
        <div class="grid-cols-1 md:grid-cols-2 lg:grid-cols-3"></div>
        <div class="mb-4 mt-8 p-6 bg-white shadow-lg rounded-lg"></div>
        <div class="text-3xl font-heading mb-6 text-center border-b-2 border-brand-brown pb-2"></div>
        <div class="flex justify-between items-center border-b border-gray-200 py-3"></div>
        <div class="text-xl font-bold font-heading"></div>
        <div class="text-lg font-bold text-brand-accent"></div>
        <div class="text-brand-brown font-body"></div>
    </div>

    <!-- Application Logic -->
    <script src="app.js"></script>
</body>
</html>
