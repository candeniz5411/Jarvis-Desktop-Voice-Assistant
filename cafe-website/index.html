<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Web Sitesi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#3E2723',
                            light: '#FFFDD0',
                            accent: '#8D6E63',
                        }
                    },
                    fontFamily: {
                        heading: ['Playfair Display', 'serif'],
                        body: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .nav-link {
                @apply block py-3 px-4 text-brand-light hover:bg-brand-accent transition-colors duration-200 font-heading text-xl border-b border-brand-accent/30;
            }
        }
    </style>
</head>
<body class="bg-brand-light text-brand-dark font-body antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-brand-dark text-brand-light p-4 shadow-md sticky top-0 z-40">
        <div class="container mx-auto flex items-center justify-between">
            <div class="flex items-center">
                <button id="menu-btn" class="p-2 mr-4 hover:bg-brand-accent rounded transition-colors focus:outline-none" aria-label="Toggle Menu">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <a href="#home" class="text-2xl font-heading font-bold tracking-wider">Kafe Mocha</a>
            </div>
        </div>
    </header>

    <!-- Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-brand-dark shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-6 border-b border-brand-accent/50 flex justify-between items-center">
            <h2 class="text-2xl font-heading font-bold text-brand-light">Menü</h2>
            <button id="close-btn" class="text-brand-light hover:text-brand-accent focus:outline-none">
                 <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <div class="flex-grow overflow-y-auto py-4">
            <a href="#home" class="nav-link">Ana Sayfa</a>
            <a href="#hakkinda" class="nav-link">Hakkında</a>
            <a href="#destek" class="nav-link">Destek</a>
            <a href="#iletisim" class="nav-link">İletişim</a>
            <a href="#subeler" class="nav-link">Şube Konumları</a>
            <a href="#menu" class="nav-link">Menü İçerikleri</a>
            <a href="#fiyatlar" class="nav-link border-b-0">Fiyatlar</a>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app-content" class="flex-grow container mx-auto px-4 py-8">
        <!-- Content will be injected here by app.js -->
    </main>

    <footer class="bg-brand-dark text-brand-light text-center py-4 mt-auto">
        <p class="font-body text-sm">&copy; 2024 Kafe Mocha. Tüm hakları saklıdır.</p>
    </footer>

    <script src="app.js"></script>

    <!-- Hidden div for Tailwind JIT classes injected via JS -->
    <div class="hidden">
        <div class="text-center mb-12"></div>
        <div class="text-4xl font-heading font-bold mb-4 text-brand-dark"></div>
        <div class="text-lg text-brand-accent mb-8 max-w-2xl mx-auto"></div>
        <div class="rounded-xl overflow-hidden shadow-2xl max-w-4xl mx-auto border-4 border-brand-dark/10"></div>
        <div class="w-full h-auto object-cover hover:scale-105 transition-transform duration-500"></div>

        <div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-md border border-brand-accent/20"></div>
        <div class="text-3xl font-heading font-bold mb-6 text-brand-dark border-b pb-4"></div>
        <div class="text-lg text-brand-dark/80 leading-relaxed mb-6"></div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-brand-accent"></div>
        <div class="text-xl font-heading font-bold mb-2"></div>
        <div class="text-brand-dark/70"></div>

        <div class="space-y-6"></div>
        <div class="flex items-start"></div>
        <div class="mt-1"></div>
        <div class="ml-4"></div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        <div class="bg-white rounded-lg shadow-md overflow-hidden group hover:shadow-xl transition-shadow duration-300"></div>
        <div class="h-48 bg-brand-accent/20 flex items-center justify-center"></div>
        <div class="text-brand-dark/50"></div>
        <div class="p-5"></div>
        <div class="text-xl font-heading font-bold text-brand-dark mb-2"></div>
        <div class="text-sm text-brand-dark/70 mb-4"></div>
        <div class="flex justify-between items-center font-bold text-brand-dark"></div>
        <div class="text-lg"></div>

        <div class="max-w-4xl mx-auto"></div>
        <div class="bg-white shadow-md rounded-lg overflow-hidden"></div>
        <div class="divide-y divide-gray-200"></div>
        <div class="flex justify-between items-center p-4 hover:bg-brand-light/50 transition-colors"></div>
        <div class="flex items-center space-x-4"></div>
        <div class="w-2 h-2 bg-brand-accent rounded-full"></div>
        <div class="font-body font-semibold text-brand-dark"></div>
        <div class="font-heading font-bold text-xl text-brand-dark bg-brand-light px-3 py-1 rounded-full border border-brand-accent/30"></div>
        <div class="h-64 bg-gray-200 rounded-lg flex items-center justify-center mb-4"></div>
    </div>
</body>
</html>
