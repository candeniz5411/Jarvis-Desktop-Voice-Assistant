<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            900: '#3E2723',
                            800: '#4E342E',
                            100: '#D7CCC8',
                        },
                        cream: '#FFFDD0',
                    },
                    fontFamily: {
                        'sans': ['Lato', 'sans-serif'],
                        'serif': ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        @layer utilities {
            .hidden-utility {
                @apply hidden;
            }
        }

        body {
            @apply bg-cream text-brown-900 font-sans;
        }

        h1, h2, h3, h4, h5, h6 {
            @apply font-serif;
        }
    </style>
</head>
<body class="antialiased min-h-screen relative">
    <!-- Navbar -->
    <header class="bg-brown-900 text-white p-4 shadow-md sticky top-0 z-20 flex items-center justify-between">
        <button id="menu-btn" class="p-2 hover:bg-brown-800 rounded focus:outline-none" aria-label="Menü">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <div class="text-xl font-serif font-bold tracking-wider">Kafe</div>
        <div class="w-10"></div> <!-- Placeholder to center the title -->
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="fixed inset-y-0 left-0 transform -translate-x-full w-64 bg-white shadow-xl z-40 transition-transform duration-300 ease-in-out">
        <div class="p-6 border-b border-gray-200 flex justify-between items-center bg-brown-900 text-white">
            <h2 class="text-2xl font-serif font-bold">Menü</h2>
            <button id="close-btn" class="text-white hover:text-gray-300 focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <ul class="py-4 font-serif text-lg">
            <li><a href="#hakkinda" class="block py-3 px-6 hover:bg-brown-100 hover:text-brown-900 transition-colors">Hakkında</a></li>
            <li><a href="#destek" class="block py-3 px-6 hover:bg-brown-100 hover:text-brown-900 transition-colors">Destek</a></li>
            <li><a href="#iletisim" class="block py-3 px-6 hover:bg-brown-100 hover:text-brown-900 transition-colors">İletişim</a></li>
            <li><a href="#subeler" class="block py-3 px-6 hover:bg-brown-100 hover:text-brown-900 transition-colors">Şube Konumları</a></li>
            <li><a href="#menu" class="block py-3 px-6 hover:bg-brown-100 hover:text-brown-900 transition-colors">Menü İçerikleri</a></li>
            <li><a href="#fiyatlar" class="block py-3 px-6 hover:bg-brown-100 hover:text-brown-900 transition-colors">Fiyatlar</a></li>
        </ul>
    </nav>

    <!-- Main Content Area for SPA routing -->
    <main id="app" class="p-6 max-w-4xl mx-auto pb-20">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- To make sure JIT compiler gets the dynamic classes generated by app.js -->
    <div class="hidden text-[#3E2723] bg-brown-900 text-white p-6 rounded-lg shadow-md mt-6 grid grid-cols-1 md:grid-cols-2 gap-4 flex justify-between items-center border-b border-gray-200 pb-2 mb-2 text-lg font-bold text-gray-700"></div>

    <script src="app.js"></script>
</body>
</html>
