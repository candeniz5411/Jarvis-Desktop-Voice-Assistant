<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cafe: {
                            dark: '#3E2723',
                            light: '#FFFDD0'
                        }
                    },
                    fontFamily: {
                        playfair: ['"Playfair Display"', 'serif'],
                        lato: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply font-lato bg-cafe-light text-cafe-dark;
            }
            h1, h2, h3, h4, h5, h6 {
                @apply font-playfair;
            }
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-cafe-dark text-cafe-light p-4 shadow-md sticky top-0 z-40 flex items-center justify-between">
        <button id="menu-btn" class="p-2 focus:outline-none focus:ring-2 focus:ring-cafe-light rounded" aria-label="Menüyü aç">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
        <h1 class="text-xl md:text-2xl font-playfair font-bold text-center flex-grow cursor-pointer" onclick="window.location.hash='#'">Kafe Keyfi</h1>
        <div class="w-10"></div> <!-- Spacer for centering -->
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-cafe-light shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col overflow-y-auto">
        <div class="p-4 bg-cafe-dark text-cafe-light flex justify-between items-center">
            <span class="text-lg font-playfair font-bold">Menü</span>
            <button id="close-btn" class="p-2 focus:outline-none focus:ring-2 focus:ring-cafe-light rounded" aria-label="Menüyü kapat">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <ul class="flex-grow py-4" id="nav-links">
            <li><a href="#about" class="block px-6 py-3 hover:bg-gray-200 transition-colors">Hakkında</a></li>
            <li><a href="#support" class="block px-6 py-3 hover:bg-gray-200 transition-colors">Destek</a></li>
            <li><a href="#contact" class="block px-6 py-3 hover:bg-gray-200 transition-colors">İletişim</a></li>
            <li><a href="#locations" class="block px-6 py-3 hover:bg-gray-200 transition-colors">Şube Konumları</a></li>
            <li><a href="#menu-items" class="block px-6 py-3 hover:bg-gray-200 transition-colors">Menü İçerikleri</a></li>
            <li><a href="#prices" class="block px-6 py-3 hover:bg-gray-200 transition-colors">Fiyatlar</a></li>
        </ul>
        <div class="p-4 border-t border-gray-300 text-sm text-center">
            &copy; 2024 Kafe Keyfi
        </div>
    </nav>

    <!-- Main Content -->
    <main id="app" class="flex-grow p-6 md:p-12 w-full max-w-4xl mx-auto">
        <!-- Content will be injected here by app.js -->
    </main>

    <div class="hidden">
       <span class="text-[#3E2723]"></span>
       <span class="text-[#FFFDD0]"></span>
       <span class="bg-[#3E2723]"></span>
       <span class="bg-[#FFFDD0]"></span>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
