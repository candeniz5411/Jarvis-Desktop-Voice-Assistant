<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kafe Web Sitesi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brown: {
              900: '#3E2723',
            },
            cream: '#FFFDD0'
          },
          fontFamily: {
            sans: ['Lato', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-cream text-brown-900 font-sans antialiased overflow-x-hidden">

  <!-- Hidden div to force Tailwind to compile dynamic classes -->
  <div class="hidden text-[#3E2723] bg-[#FFFDD0] bg-brown-900 text-cream"></div>

  <!-- Header & Navigation -->
  <header class="bg-brown-900 text-cream shadow-md fixed w-full z-20">
    <div class="container mx-auto px-4 py-4 flex items-center justify-between">
      <button id="menu-btn" class="focus:outline-none flex items-center justify-center p-2">
        <!-- Hamburger Icon -->
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
      <h1 class="text-2xl font-serif font-bold tracking-wide"><a href="#/">Kafe Logo</a></h1>
      <div class="w-8"></div> <!-- Spacer for centering -->
    </div>
  </header>

  <!-- Sidebar Menu -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden transition-opacity"></div>
  <aside id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-cream text-brown-900 shadow-2xl z-40 transform -translate-x-full transition-transform duration-300 ease-in-out">
    <div class="p-6 flex justify-between items-center border-b border-brown-900/20">
      <h2 class="font-serif text-xl font-bold">Menü</h2>
      <button id="close-btn" class="focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
    <nav class="p-4">
      <ul class="space-y-4 font-sans text-lg">
        <li><a href="#/hakkinda" class="block hover:text-brown-900/70 transition-colors sidebar-link">Hakkında</a></li>
        <li><a href="#/destek" class="block hover:text-brown-900/70 transition-colors sidebar-link">Destek</a></li>
        <li><a href="#/iletisim" class="block hover:text-brown-900/70 transition-colors sidebar-link">İletişim</a></li>
        <li><a href="#/subeler" class="block hover:text-brown-900/70 transition-colors sidebar-link">Şube Konumları</a></li>
        <li><a href="#/menu" class="block hover:text-brown-900/70 transition-colors sidebar-link">Menü İçerikleri</a></li>
        <li><a href="#/fiyatlar" class="block hover:text-brown-900/70 transition-colors sidebar-link">Fiyatlar</a></li>
      </ul>
    </nav>
  </aside>

  <!-- Main Content Area -->
  <main class="pt-24 min-h-screen container mx-auto px-4 pb-12" id="app">
    <!-- Dynamic Content Loaded Here -->
  </main>

  <footer class="bg-brown-900 text-cream py-6 text-center mt-auto">
    <p class="font-sans text-sm">&copy; 2026 Kafe Logo. Tüm Hakları Saklıdır.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
