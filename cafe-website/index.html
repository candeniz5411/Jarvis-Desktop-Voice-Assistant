<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            light: '#D7CCC8',
                            DEFAULT: '#795548',
                            dark: '#3E2723',
                        },
                        cream: '#FFFDD0',
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-cream text-coffee-dark font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-coffee-dark text-cream p-4 flex justify-between items-center shadow-md sticky top-0 z-50">
        <button id="menu-btn" class="text-2xl hover:text-coffee-light transition-colors focus:outline-none">
            <i class="fas fa-bars"></i>
        </button>
        <h1 class="text-2xl font-serif font-bold tracking-wider">
            <i class="fas fa-coffee mr-2"></i>Kahve Dükkanı
        </h1>
        <div class="w-8"></div> <!-- Spacer for centering -->
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity duration-300 opacity-0"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-coffee-dark text-cream transform -translate-x-full transition-transform duration-300 ease-in-out z-50 shadow-2xl pt-16">
        <button id="close-btn" class="absolute top-4 right-4 text-2xl hover:text-coffee-light focus:outline-none">
            <i class="fas fa-times"></i>
        </button>
        <nav class="mt-8 px-6 space-y-4">
            <a href="#home" class="block py-2 px-4 hover:bg-coffee hover:text-white rounded transition-colors text-lg font-serif" onclick="closeSidebar()">Ana Sayfa</a>
            <a href="#about" class="block py-2 px-4 hover:bg-coffee hover:text-white rounded transition-colors text-lg font-serif" onclick="closeSidebar()">Hakkında</a>
            <a href="#support" class="block py-2 px-4 hover:bg-coffee hover:text-white rounded transition-colors text-lg font-serif" onclick="closeSidebar()">Destek</a>
            <a href="#contact" class="block py-2 px-4 hover:bg-coffee hover:text-white rounded transition-colors text-lg font-serif" onclick="closeSidebar()">İletişim</a>
            <a href="#locations" class="block py-2 px-4 hover:bg-coffee hover:text-white rounded transition-colors text-lg font-serif" onclick="closeSidebar()">Şube Konumları</a>
            <a href="#menu" class="block py-2 px-4 hover:bg-coffee hover:text-white rounded transition-colors text-lg font-serif" onclick="closeSidebar()">Menü İçerikleri</a>
            <a href="#prices" class="block py-2 px-4 hover:bg-coffee hover:text-white rounded transition-colors text-lg font-serif" onclick="closeSidebar()">Fiyatlar</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main id="app" class="flex-grow container mx-auto p-6 max-w-4xl fade-in">
        <!-- Content injected by JS -->
    </main>

    <!-- Footer -->
    <footer class="bg-coffee-dark text-cream text-center p-4 mt-auto">
        <p>&copy; 2023 Kahve Dükkanı. Tüm hakları saklıdır.</p>
    </footer>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
