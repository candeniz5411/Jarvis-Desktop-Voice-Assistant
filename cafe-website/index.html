<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Web Sitesi</title>

    <!-- Google Fonts: Playfair Display for headings, Lato for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            50: '#efebe9',
                            100: '#d7ccc8',
                            200: '#bcaaa4',
                            300: '#a1887f',
                            400: '#8d6e63',
                            500: '#795548',
                            600: '#6d4c41',
                            700: '#5d4037',
                            800: '#4e342e',
                            900: '#3e2723', // Main dark brown
                        },
                        cream: '#fffdd0',
                    },
                    fontFamily: {
                        heading: ['Playfair Display', 'serif'],
                        body: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Pre-declare dynamic utility classes for Tailwind JIT -->
    <style type="text/tailwindcss">
        @layer utilities {
            .font-heading { font-family: 'Playfair Display', serif; }
            .font-body { font-family: 'Lato', sans-serif; }
        }
    </style>
</head>
<body class="font-body bg-cream text-brown-900 m-0 p-0 overflow-x-hidden">

    <!-- Header area -->
    <header class="bg-brown-900 text-cream p-4 sticky top-0 z-40 flex items-center shadow-md">
        <!-- Hamburger Menu Button -->
        <button id="menu-btn" class="p-2 mr-4 focus:outline-none hover:bg-brown-800 rounded transition-colors" aria-label="Toggle Menu">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <h1 class="font-heading text-2xl font-bold tracking-wide"><a href="#home">Kafe Logos</a></h1>
    </header>

    <!-- Overlay (hidden by default) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sliding Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-white shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-6 bg-brown-900 text-cream flex justify-between items-center">
            <h2 class="font-heading text-xl font-bold">Menü</h2>
            <button id="close-btn" class="p-1 hover:bg-brown-800 rounded focus:outline-none transition-colors" aria-label="Close Menu">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <ul class="flex flex-col py-4 overflow-y-auto font-body text-lg">
            <li><a href="#home" class="block py-3 px-6 hover:bg-brown-50 hover:text-brown-700 border-b border-brown-100 transition-colors">Ana Sayfa</a></li>
            <li><a href="#hakkinda" class="block py-3 px-6 hover:bg-brown-50 hover:text-brown-700 border-b border-brown-100 transition-colors">Hakkında</a></li>
            <li><a href="#destek" class="block py-3 px-6 hover:bg-brown-50 hover:text-brown-700 border-b border-brown-100 transition-colors">Destek</a></li>
            <li><a href="#iletisim" class="block py-3 px-6 hover:bg-brown-50 hover:text-brown-700 border-b border-brown-100 transition-colors">İletişim</a></li>
            <li><a href="#subeler" class="block py-3 px-6 hover:bg-brown-50 hover:text-brown-700 border-b border-brown-100 transition-colors">Şube Konumları</a></li>
            <li><a href="#icerikler" class="block py-3 px-6 hover:bg-brown-50 hover:text-brown-700 border-b border-brown-100 transition-colors">Menü İçerikleri</a></li>
            <li><a href="#fiyatlar" class="block py-3 px-6 hover:bg-brown-50 hover:text-brown-700 transition-colors">Fiyatlar</a></li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main id="app" class="container mx-auto p-4 md:p-8 min-h-[80vh]">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-brown-900 text-cream p-6 text-center mt-auto font-body text-sm">
        <p>&copy; 2024 Kafe Logos. Tüm hakları saklıdır.</p>
    </footer>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
