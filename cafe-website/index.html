<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: '#3E2723',
                        cream: '#FFFDD0',
                    },
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cream text-coffee font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-coffee text-cream p-4 flex items-center justify-between sticky top-0 z-50 shadow-md">
        <button id="menu-btn" class="text-3xl focus:outline-none p-2" aria-label="Menüyü Aç">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
        <h1 class="text-2xl font-serif font-bold tracking-wider absolute left-1/2 transform -translate-x-1/2">
            <a href="#home">Kahve Dükkanı</a>
        </h1>
        <div class="w-8"></div> <!-- Spacer -->
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity duration-300 backdrop-blur-sm"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-72 bg-coffee text-cream transform -translate-x-full transition-transform duration-300 ease-in-out z-50 shadow-2xl pt-20 border-r border-cream/20">
        <button id="close-btn" class="absolute top-4 right-4 text-2xl focus:outline-none p-2 text-cream hover:text-white" aria-label="Menüyü Kapat">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
        <nav class="flex flex-col space-y-2 p-6 text-lg font-medium">
            <a href="#about" class="block py-3 px-4 rounded hover:bg-cream hover:text-coffee transition-colors">Hakkında</a>
            <a href="#support" class="block py-3 px-4 rounded hover:bg-cream hover:text-coffee transition-colors">Destek</a>
            <a href="#contact" class="block py-3 px-4 rounded hover:bg-cream hover:text-coffee transition-colors">İletişim</a>
            <a href="#locations" class="block py-3 px-4 rounded hover:bg-cream hover:text-coffee transition-colors">Şube Konumları</a>
            <a href="#menu" class="block py-3 px-4 rounded hover:bg-cream hover:text-coffee transition-colors">Menü İçerikleri</a>
            <a href="#prices" class="block py-3 px-4 rounded hover:bg-cream hover:text-coffee transition-colors">Fiyatlar</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main id="main-content" class="flex-grow container mx-auto p-6 transition-opacity duration-300 fade-in">
        <!-- Content will be injected here by app.js -->
        <div class="text-center mt-10">
            <h2 class="text-4xl font-serif font-bold mb-6 animate-pulse">Yükleniyor...</h2>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-coffee text-cream text-center p-6 mt-auto border-t border-cream/20">
        <p class="font-serif">&copy; 2023 Kahve Dükkanı. Keyifli anlar için.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
