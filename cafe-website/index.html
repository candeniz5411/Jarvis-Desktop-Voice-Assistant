<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            500: '#795548',
                            800: '#3E2723',
                            900: '#21110c'
                        },
                        cream: '#FFFDD0'
                    },
                    fontFamily: {
                        heading: ['"Playfair Display"', 'serif'],
                        body: ['Lato', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .active-link {
                @apply bg-brown-800 text-cream;
            }
        }
    </style>
</head>
<body class="bg-cream text-brown-800 font-body overflow-x-hidden min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-md p-4 sticky top-0 z-40 flex items-center justify-between">
        <button id="menu-btn" class="p-2 focus:outline-none" aria-label="Menüyü aç">
            <svg class="w-8 h-8 text-brown-800" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <div class="flex-grow text-center">
            <h1 class="text-2xl font-heading font-bold text-brown-800">
                <a href="#/" class="flex items-center justify-center gap-2">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M18.5 3H6a1 1 0 0 0-1 1v10a5 5 0 0 0 5 5h4a5 5 0 0 0 5-5V4a1 1 0 0 0-1-1zm-1 10a3 3 0 0 1-3 3h-4a3 3 0 0 1-3-3V5h10v8zm2-6h1a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-1V7zM4 20h14v2H4z"/></svg>
                    Kahve Dükkanı
                </a>
            </h1>
        </div>
        <div class="w-8"></div> <!-- Spacer for flex balance -->
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-white shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-4 bg-brown-800 text-cream flex justify-between items-center">
            <h2 class="text-xl font-heading font-bold">Menü</h2>
            <button id="close-btn" class="focus:outline-none" aria-label="Menüyü kapat">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <ul class="flex-grow p-4 space-y-2 overflow-y-auto">
            <li><a href="#/hakkinda" class="block p-3 rounded hover:bg-brown-50 hover:text-brown-800 transition-colors font-semibold">Hakkında</a></li>
            <li><a href="#/destek" class="block p-3 rounded hover:bg-brown-50 hover:text-brown-800 transition-colors font-semibold">Destek</a></li>
            <li><a href="#/iletisim" class="block p-3 rounded hover:bg-brown-50 hover:text-brown-800 transition-colors font-semibold">İletişim</a></li>
            <li><a href="#/subeler" class="block p-3 rounded hover:bg-brown-50 hover:text-brown-800 transition-colors font-semibold">Şube Konumları</a></li>
            <li><a href="#/menu" class="block p-3 rounded hover:bg-brown-50 hover:text-brown-800 transition-colors font-semibold">Menü İçerikleri</a></li>
            <li><a href="#/fiyatlar" class="block p-3 rounded hover:bg-brown-50 hover:text-brown-800 transition-colors font-semibold">Fiyatlar</a></li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main id="app-content" class="flex-grow container mx-auto p-4 sm:p-8">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-brown-900 text-cream text-center p-4 mt-auto">
        <p>&copy; 2024 Kahve Dükkanı. Tüm hakları saklıdır.</p>
    </footer>

    <!-- Force tailwind classes to be generated for dynamic content -->
    <div class="hidden">
        <div class="text-center"></div>
        <div class="max-w-3xl"></div>
        <div class="mx-auto"></div>
        <div class="text-4xl"></div>
        <div class="font-heading"></div>
        <div class="font-bold"></div>
        <div class="mb-4"></div>
        <div class="text-lg"></div>
        <div class="text-brown-500"></div>
        <div class="mb-8"></div>
        <div class="rounded-lg"></div>
        <div class="shadow-lg"></div>
        <div class="w-full"></div>
        <div class="h-64"></div>
        <div class="object-cover"></div>
        <div class="bg-white"></div>
        <div class="p-6"></div>
        <div class="space-y-4"></div>
        <div class="text-3xl"></div>
        <div class="border-b"></div>
        <div class="border-brown-500"></div>
        <div class="pb-2"></div>
        <div class="grid"></div>
        <div class="grid-cols-1"></div>
        <div class="md:grid-cols-2"></div>
        <div class="gap-4"></div>
        <div class="flex"></div>
        <div class="justify-between"></div>
        <div class="items-center"></div>
        <div class="font-semibold"></div>
        <div class="w-full max-w-md mx-auto bg-white p-6 rounded-lg shadow-md mt-4"></div>
        <div class="block text-sm font-medium mb-1"></div>
        <div class="w-full border rounded p-2 mb-4"></div>
        <div class="w-full bg-brown-800 text-cream py-2 rounded hover:bg-brown-900 transition"></div>
        <div class="mt-4 p-4 bg-green-100 text-green-800 rounded hidden" id="form-success"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
