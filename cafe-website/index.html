<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            900: '#3E2723',
                            800: '#4E342E',
                            700: '#5D4037'
                        },
                        cream: '#FFFDD0',
                    },
                    fontFamily: {
                        heading: ['"Playfair Display"', 'serif'],
                        body: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-body bg-white text-brown-900 antialiased overflow-x-hidden relative flex flex-col min-h-screen">

    <!-- Pre-declare classes for Tailwind JIT -->
    <div class="hidden text-[#3E2723] bg-[#FFFDD0] bg-white text-brown-900"></div>

    <!-- Header -->
    <header class="bg-brown-900 text-cream fixed w-full z-40 top-0 left-0 shadow-md h-16 flex items-center px-4">
        <!-- Hamburger Menu Button -->
        <button id="menu-btn" class="p-2 focus:outline-none flex flex-col justify-center items-center mr-4" aria-label="Toggle Menu">
            <span class="block w-6 h-0.5 bg-cream mb-1"></span>
            <span class="block w-6 h-0.5 bg-cream mb-1"></span>
            <span class="block w-6 h-0.5 bg-cream"></span>
        </button>

        <!-- Logo / Title -->
        <a href="#/" class="font-heading text-2xl font-bold flex items-center">
            <svg class="w-6 h-6 mr-2 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M18,3H6C4.9,3 4,3.9 4,5V13C4,14.65 5.35,16 7,16H15C16.65,16 18,14.65 18,13V12H20C21.1,12 22,11.1 22,10V5C22,3.9 21.1,3 20,3H18M18,5H20V10H18V5M16,5V13C16,13.55 15.55,14 15,14H7C6.45,14 6,13.55 6,13V5H16M12,19C8.13,19 5,16.87 5,13H3C3,17.42 6.58,21 11,21H13C17.42,21 21,17.42 21,13H19C19,16.87 15.87,19 12,19Z" />
            </svg>
            Kahve Dükkanı
        </a>
    </header>

    <!-- Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-cream text-brown-900 shadow-xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out pt-16 flex flex-col">
        <!-- Close Button for Mobile -->
        <button id="close-btn" class="absolute top-4 right-4 p-2 focus:outline-none" aria-label="Close Menu">
            <svg class="w-6 h-6 stroke-current" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>

        <nav class="flex-grow mt-8">
            <ul class="flex flex-col space-y-2 px-4 font-heading text-lg">
                <li><a href="#/hakkinda" class="block py-2 px-4 hover:bg-brown-900 hover:text-cream rounded transition-colors duration-200" data-nav-link>Hakkında</a></li>
                <li><a href="#/destek" class="block py-2 px-4 hover:bg-brown-900 hover:text-cream rounded transition-colors duration-200" data-nav-link>Destek</a></li>
                <li><a href="#/iletisim" class="block py-2 px-4 hover:bg-brown-900 hover:text-cream rounded transition-colors duration-200" data-nav-link>İletişim</a></li>
                <li><a href="#/subeler" class="block py-2 px-4 hover:bg-brown-900 hover:text-cream rounded transition-colors duration-200" data-nav-link>Şube Konumları</a></li>
                <li><a href="#/menu" class="block py-2 px-4 hover:bg-brown-900 hover:text-cream rounded transition-colors duration-200" data-nav-link>Menü İçerikleri</a></li>
                <li><a href="#/fiyatlar" class="block py-2 px-4 hover:bg-brown-900 hover:text-cream rounded transition-colors duration-200" data-nav-link>Fiyatlar</a></li>
            </ul>
        </nav>

        <div class="p-4 border-t border-brown-800 text-sm text-center font-body opacity-80">
            &copy; 2024 Kahve Dükkanı
        </div>
    </aside>

    <!-- Main Content Area -->
    <main id="app" class="flex-grow mt-16 p-4 max-w-4xl mx-auto w-full">
        <!-- Content will be injected here by app.js -->
    </main>

    <script src="app.js"></script>
</body>
</html>
