<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            900: '#3E2723',
                            800: '#4e342e',
                            700: '#5d4037',
                        },
                        cream: {
                            DEFAULT: '#FFFDD0',
                            100: '#fefcbf'
                        }
                    },
                    fontFamily: {
                        heading: ['"Playfair Display"', 'serif'],
                        body: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cream text-brown-900 font-body m-0 p-0 overflow-x-hidden min-h-screen flex flex-col">

    <!-- Header -->
    <header class="w-full bg-brown-900 text-cream p-4 flex items-center justify-between shadow-md relative z-20">
        <button id="menu-btn" class="p-2 focus:outline-none focus:ring-2 focus:ring-cream rounded z-30 relative" aria-label="Menüyü aç">
            <svg class="w-8 h-8 fill-current text-cream" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z" />
            </svg>
        </button>
        <h1 class="text-2xl font-heading font-bold text-center flex-grow pr-12">Kafe</h1>
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-10 hidden transition-opacity"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-brown-900 text-cream p-6 pt-20 shadow-lg transform -translate-x-full transition-transform duration-300 ease-in-out z-20">
        <ul class="space-y-4">
            <li><a href="#hakkinda" class="block text-lg hover:text-cream-100 transition-colors">Hakkında</a></li>
            <li><a href="#destek" class="block text-lg hover:text-cream-100 transition-colors">Destek</a></li>
            <li><a href="#iletisim" class="block text-lg hover:text-cream-100 transition-colors">İletişim</a></li>
            <li><a href="#sube-konumlari" class="block text-lg hover:text-cream-100 transition-colors">Şube Konumları</a></li>
            <li><a href="#menu-icerikleri" class="block text-lg hover:text-cream-100 transition-colors">Menü İçerikleri</a></li>
            <li><a href="#fiyatlar" class="block text-lg hover:text-cream-100 transition-colors">Fiyatlar</a></li>
        </ul>
    </nav>

    <!-- Main Content Container -->
    <main id="app" class="flex-grow p-6 flex flex-col items-center max-w-4xl mx-auto w-full">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Hidden div for arbitrary classes if needed for JS injection -->
    <div class="hidden text-[#3E2723] bg-[#FFFDD0]"></div>

    <script src="app.js"></script>
</body>
</html>
