<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            dark: '#3E2723',
                            medium: '#5D4037',
                            light: '#8D6E63',
                        },
                        cream: '#FFFDD0',
                    },
                    fontFamily: {
                        heading: ['Playfair Display', 'serif'],
                        body: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-cream text-coffee-dark font-body antialiased min-h-screen flex flex-col">
    <!-- Navbar -->
    <header class="bg-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Hamburger Menu Button -->
                <div class="flex-shrink-0 flex items-center">
                    <button id="menu-btn" class="p-2 rounded-md text-coffee-dark hover:text-coffee-medium hover:bg-cream focus:outline-none transition duration-150 ease-in-out">
                        <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                    <!-- Logo -->
                    <a href="#home" class="ml-4 font-heading text-2xl font-bold tracking-wider text-coffee-dark">Kahve Dükkanı</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-coffee-dark text-cream z-50 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-2xl overflow-y-auto">
        <div class="p-6">
            <div class="flex justify-between items-center mb-8">
                <h2 class="font-heading text-2xl font-bold">Menü</h2>
                <button id="close-btn" class="text-cream hover:text-white focus:outline-none">
                    <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <nav class="space-y-4">
                <a href="#hakkinda" class="block py-2 text-lg hover:text-white transition-colors duration-200">1. Hakkında</a>
                <a href="#destek" class="block py-2 text-lg hover:text-white transition-colors duration-200">2. Destek</a>
                <a href="#iletisim" class="block py-2 text-lg hover:text-white transition-colors duration-200">3. İletişim</a>
                <a href="#subeler" class="block py-2 text-lg hover:text-white transition-colors duration-200">4. Şube Konumları</a>
                <a href="#menu" class="block py-2 text-lg hover:text-white transition-colors duration-200">5. Menü İçerikleri</a>
                <a href="#fiyatlar" class="block py-2 text-lg hover:text-white transition-colors duration-200">6. Fiyatlar</a>
            </nav>
        </div>
    </aside>

    <!-- Main Content -->
    <main id="app" class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-coffee-dark text-cream mt-auto py-6">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p>&copy; 2024 Kahve Dükkanı. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <!-- App Logic -->
    <script src="app.js"></script>

    <!-- Hidden div to pre-declare dynamic Tailwind classes for JIT if any -->
    <div class="hidden text-[#3E2723] bg-[#FFFDD0] border-coffee-light"></div>
</body>
</html>
