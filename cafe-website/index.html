<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            900: '#3E2723',
                            800: '#4E342E',
                            700: '#5D4037',
                            600: '#6D4C41',
                        },
                        cream: '#FFFDD0',
                    },
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .heading {
                @apply font-serif text-brown-900;
            }
            .body-text {
                @apply font-sans text-gray-800;
            }
        }
    </style>
</head>
<body class="bg-white body-text flex flex-col min-h-screen">

    <!-- Navbar -->
    <header class="bg-cream text-brown-900 shadow-md flex items-center px-4 py-4 fixed w-full top-0 z-20">
        <button id="hamburgerBtn" class="focus:outline-none p-2 mr-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <div class="flex items-center cursor-pointer" onclick="window.location.hash='#'">
            <!-- Icon for Logo -->
            <svg class="w-8 h-8 mr-2 text-brown-900" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 10v-4c0-1.103-.897-2-2-2h-8c-1.103 0-2 .897-2 2v4c0 3.309 2.691 6 6 6h1v-10h2v10h1c3.309 0 6-2.691 6-6zm-6 4c-2.206 0-4-1.794-4-4v-4h8v4c0 2.206-1.794 4-4 4zm7.5-6.5h-1v2h1c.827 0 1.5.673 1.5 1.5s-.673 1.5-1.5 1.5h-1v2h1c1.93 0 3.5-1.57 3.5-3.5s-1.57-3.5-3.5-3.5z"/>
                <path d="M4 20h16v2h-16z"/>
            </svg>
            <h1 class="text-2xl font-bold font-serif uppercase tracking-wider">Kahve Dükkanı</h1>
        </div>
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-brown-900 text-cream z-40 transform -translate-x-full transition-transform duration-300 shadow-2xl overflow-y-auto">
        <div class="p-6 flex justify-between items-center border-b border-brown-700">
            <h2 class="text-xl font-bold font-serif">Menü</h2>
            <button id="closeSidebarBtn" class="text-cream focus:outline-none hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <nav class="flex flex-col p-4 space-y-2">
            <a href="#" class="nav-link py-3 px-4 rounded hover:bg-brown-700 transition duration-200">Ana Sayfa</a>
            <a href="#hakkinda" class="nav-link py-3 px-4 rounded hover:bg-brown-700 transition duration-200">Hakkında</a>
            <a href="#destek" class="nav-link py-3 px-4 rounded hover:bg-brown-700 transition duration-200">Destek</a>
            <a href="#iletisim" class="nav-link py-3 px-4 rounded hover:bg-brown-700 transition duration-200">İletişim</a>
            <a href="#sube-konumlari" class="nav-link py-3 px-4 rounded hover:bg-brown-700 transition duration-200">Şube Konumları</a>
            <a href="#menu-icerikleri" class="nav-link py-3 px-4 rounded hover:bg-brown-700 transition duration-200">Menü İçerikleri</a>
            <a href="#fiyatlar" class="nav-link py-3 px-4 rounded hover:bg-brown-700 transition duration-200">Fiyatlar</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main id="app" class="flex-grow pt-24 px-4 pb-8 container mx-auto max-w-4xl">
        <!-- Views will be injected here by app.js -->
    </main>

    <footer class="bg-brown-900 text-cream text-center py-6 mt-auto">
        <p class="font-sans">&copy; 2024 Kahve Dükkanı. Tüm hakları saklıdır.</p>
    </footer>

    <!-- Hidden div for dynamic Tailwind classes -->
    <div class="hidden text-brown-900 text-brown-800 text-brown-700 bg-cream text-center p-6 border rounded-lg shadow-md mb-8 grid grid-cols-1 md:grid-cols-2 gap-6 bg-white object-cover w-full h-64 h-auto aspect-video mb-6"></div>

    <!-- App Script -->
    <script src="app.js"></script>
</body>
</html>
