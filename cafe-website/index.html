<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cafe: {
                            dark: '#3E2723',
                            light: '#5D4037',
                            cream: '#FFFDD0',
                            white: '#FFFFFF',
                            accent: '#D7CCC8'
                        }
                    },
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Tailwind Custom Styles -->
    <style type="text/tailwindcss">
        @layer utilities {
            .h1-title {
                @apply font-serif text-4xl md:text-5xl lg:text-6xl font-bold text-cafe-dark mb-6;
            }
            .h2-title {
                @apply font-serif text-3xl md:text-4xl font-semibold text-cafe-dark mb-4;
            }
            .body-text {
                @apply font-sans text-base md:text-lg text-gray-800 leading-relaxed;
            }
        }
    </style>
</head>
<body class="bg-cafe-cream text-gray-800 font-sans min-h-screen flex flex-col antialiased">

    <!-- Pre-declare dynamic tailwind classes for JIT -->
    <div class="hidden">
        <span class="text-[#3E2723]"></span>
        <span class="bg-[#3E2723]"></span>
        <span class="text-[#FFFDD0]"></span>
        <span class="bg-[#FFFDD0]"></span>
        <span class="text-cafe-dark bg-cafe-dark text-cafe-cream bg-cafe-cream text-cafe-light text-cafe-accent"></span>
        <span class="grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></span>
    </div>

    <!-- Header -->
    <header class="bg-cafe-dark text-cafe-cream shadow-md sticky top-0 z-40 w-full h-16">
        <div class="container mx-auto px-4 h-full flex items-center justify-between">
            <!-- Hamburger Menu Button -->
            <button id="menu-btn" class="p-2 focus:outline-none focus:ring-2 focus:ring-cafe-cream rounded-md" aria-label="Toggle Menu">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>

            <!-- Logo / Brand -->
            <a href="#/" class="flex items-center space-x-2 group">
                <svg class="w-8 h-8 text-cafe-cream group-hover:text-cafe-accent transition-colors duration-300" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18.5 3H6c-1.1 0-2 .9-2 2v5.71c0 3.83 2.95 7.18 6.78 7.29 3.96.12 7.22-3.06 7.22-7v-1h.5c1.93 0 3.5-1.57 3.5-3.5S20.43 3 18.5 3zM16 5v3H6V5h10zm2.5 3H18V5h.5c.83 0 1.5.67 1.5 1.5S19.33 8 18.5 8zM4 19h16v2H4z" />
                </svg>
                <span class="font-serif text-xl md:text-2xl font-bold tracking-wider group-hover:text-cafe-accent transition-colors duration-300">Kahve Dükkanı</span>
            </a>

            <!-- Empty div for flexbox spacing to keep logo centered if needed, or right-aligned items -->
            <div class="w-8"></div>
        </div>
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sidebar Navigation -->
    <nav id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-cafe-white shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-6 bg-cafe-dark text-cafe-cream flex justify-between items-center h-16">
            <span class="font-serif text-xl font-bold">Menü</span>
            <button id="close-btn" class="p-1 focus:outline-none focus:ring-2 focus:ring-cafe-cream rounded-md" aria-label="Close Menu">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <ul class="flex-grow py-4 overflow-y-auto">
            <li><a href="#/" class="block px-6 py-3 text-cafe-dark hover:bg-cafe-accent hover:text-cafe-dark transition-colors duration-200 font-medium">Ana Sayfa</a></li>
            <li><a href="#/hakkinda" class="block px-6 py-3 text-cafe-dark hover:bg-cafe-accent hover:text-cafe-dark transition-colors duration-200 font-medium">Hakkında</a></li>
            <li><a href="#/destek" class="block px-6 py-3 text-cafe-dark hover:bg-cafe-accent hover:text-cafe-dark transition-colors duration-200 font-medium">Destek</a></li>
            <li><a href="#/iletisim" class="block px-6 py-3 text-cafe-dark hover:bg-cafe-accent hover:text-cafe-dark transition-colors duration-200 font-medium">İletişim</a></li>
            <li><a href="#/sube-konumlari" class="block px-6 py-3 text-cafe-dark hover:bg-cafe-accent hover:text-cafe-dark transition-colors duration-200 font-medium">Şube Konumları</a></li>
            <li><a href="#/menu-icerikleri" class="block px-6 py-3 text-cafe-dark hover:bg-cafe-accent hover:text-cafe-dark transition-colors duration-200 font-medium">Menü İçerikleri</a></li>
            <li><a href="#/fiyatlar" class="block px-6 py-3 text-cafe-dark hover:bg-cafe-accent hover:text-cafe-dark transition-colors duration-200 font-medium">Fiyatlar</a></li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main id="app-content" class="flex-grow container mx-auto px-4 py-8">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-cafe-dark text-cafe-cream py-6 mt-auto">
        <div class="container mx-auto px-4 text-center">
            <p class="font-sans text-sm md:text-base">&copy; 2024 Kahve Dükkanı. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
