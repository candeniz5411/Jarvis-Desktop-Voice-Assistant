<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Web Sitesi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'coffee': '#3E2723',
                        'cream': '#FFFDD0',
                    },
                    fontFamily: {
                        heading: ['"Playfair Display"', 'serif'],
                        body: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .font-heading {
                font-family: "Playfair Display", serif;
            }
            .font-body {
                font-family: "Lato", sans-serif;
            }
        }
        body {
            @apply font-body bg-cream text-coffee;
        }
    </style>
</head>
<body class="bg-cream text-coffee m-0 p-0 flex flex-col min-h-screen">

    <!-- Header with Hamburger Menu -->
    <header class="bg-coffee text-cream p-4 flex justify-between items-center shadow-md relative z-20">
        <button id="menu-btn" class="text-cream focus:outline-none">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <h1 class="text-2xl font-heading font-bold text-center flex-grow">Kafe Logo</h1>
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden transition-opacity"></div>

    <!-- Sliding Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-coffee text-cream z-40 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-lg flex flex-col">
        <div class="p-6 border-b border-cream/20 flex justify-between items-center">
            <h2 class="text-xl font-heading font-bold">Menü</h2>
            <button id="close-btn" class="text-cream focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <ul class="flex-grow p-4 space-y-4 text-lg">
            <li><a href="#hakkinda" class="block hover:text-gray-300 transition-colors">Hakkında</a></li>
            <li><a href="#destek" class="block hover:text-gray-300 transition-colors">Destek</a></li>
            <li><a href="#iletisim" class="block hover:text-gray-300 transition-colors">İletişim</a></li>
            <li><a href="#subeler" class="block hover:text-gray-300 transition-colors">Şube Konumları</a></li>
            <li><a href="#menu" class="block hover:text-gray-300 transition-colors">Menü İçerikleri</a></li>
            <li><a href="#fiyatlar" class="block hover:text-gray-300 transition-colors">Fiyatlar</a></li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main id="app" class="flex-grow p-6 sm:p-12 w-full max-w-4xl mx-auto">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-coffee text-cream text-center p-4 text-sm mt-auto">
        &copy; 2026 Kafe Logo. Tüm hakları saklıdır.
    </footer>

    <!-- Hidden div to ensure Tailwind generates dynamic classes if needed -->
    <div class="hidden text-coffee bg-cream font-heading font-body bg-white shadow-md rounded-lg p-6 max-w-sm mx-auto text-center object-cover w-full h-64 mt-4 grid grid-cols-1 sm:grid-cols-2 gap-4"></div>

    <script src="app.js"></script>
</body>
</html>
