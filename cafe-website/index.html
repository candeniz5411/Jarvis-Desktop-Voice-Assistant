<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Web Sitesi</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            50: '#fdf8f6',
                            100: '#f2e8e5',
                            200: '#eaddd7',
                            300: '#e0cec7',
                            400: '#d2bab0',
                            500: '#a1887f',
                            600: '#8d6e63',
                            700: '#795548',
                            800: '#5d4037',
                            900: '#3E2723', // Dark brown
                        },
                        cream: '#FFFDD0',
                    },
                    fontFamily: {
                        heading: ['Playfair Display', 'serif'],
                        body: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        body {
            @apply font-body bg-cream text-brown-900;
        }
        h1, h2, h3, h4, h5, h6 {
            @apply font-heading;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-brown-900 text-cream fixed w-full top-0 z-40 shadow-md">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between">
            <button id="menu-btn" class="focus:outline-none p-2 hover:bg-brown-800 rounded transition-colors" aria-label="Menüyü aç">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <div class="text-2xl font-heading font-bold mx-auto absolute left-1/2 transform -translate-x-1/2">
                Kafe Logo
            </div>
            <!-- Placeholder for symmetry -->
            <div class="w-12"></div>
        </div>
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-brown-50 text-brown-900 z-50 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-xl overflow-y-auto">
        <div class="p-6 border-b border-brown-200 flex justify-between items-center">
            <h2 class="text-2xl font-bold font-heading">Menü</h2>
            <button id="close-btn" class="focus:outline-none p-2 hover:bg-brown-200 rounded transition-colors text-brown-900" aria-label="Menüyü kapat">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <nav class="p-4">
            <ul class="space-y-2">
                <li><a href="#home" class="block py-2 px-4 hover:bg-brown-100 rounded transition-colors font-semibold">Ana Sayfa</a></li>
                <li><a href="#hakkinda" class="block py-2 px-4 hover:bg-brown-100 rounded transition-colors font-semibold">Hakkında</a></li>
                <li><a href="#destek" class="block py-2 px-4 hover:bg-brown-100 rounded transition-colors font-semibold">Destek</a></li>
                <li><a href="#iletisim" class="block py-2 px-4 hover:bg-brown-100 rounded transition-colors font-semibold">İletişim</a></li>
                <li><a href="#subeler" class="block py-2 px-4 hover:bg-brown-100 rounded transition-colors font-semibold">Şube Konumları</a></li>
                <li><a href="#menu" class="block py-2 px-4 hover:bg-brown-100 rounded transition-colors font-semibold">Menü İçerikleri</a></li>
                <li><a href="#fiyatlar" class="block py-2 px-4 hover:bg-brown-100 rounded transition-colors font-semibold">Fiyatlar</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-grow pt-20 px-4 pb-12 mt-4" id="content">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Hidden div to pre-declare dynamic Tailwind classes if any -->
    <div class="hidden text-[#3E2723] bg-[#FFFDD0] hover:bg-brown-100 bg-brown-50 p-6 border border-brown-200 rounded-lg shadow-sm text-center mb-6 max-w-4xl mx-auto flex flex-col md:flex-row gap-8 items-center bg-white justify-between pb-4 font-bold font-heading text-lg text-brown-600 space-y-4"></div>

    <script src="app.js"></script>
</body>
</html>
