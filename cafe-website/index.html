<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Web Sitesi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            100: '#D7CCC8',
                            300: '#A1887F',
                            500: '#795548',
                            700: '#5D4037',
                            900: '#3E2723',
                        },
                        cream: '#FFFDD0'
                    },
                    fontFamily: {
                        heading: ['"Playfair Display"', 'serif'],
                        body: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        body {
            @apply font-body bg-cream text-brown-900;
        }
        h1, h2, h3, h4, h5, h6 {
            @apply font-heading;
        }
    </style>
</head>
<body class="bg-cream text-brown-900 m-0 p-0 flex flex-col min-h-screen">

    <!-- Navbar -->
    <header class="bg-brown-900 text-cream p-4 flex items-center justify-between shadow-md relative z-20">
        <button id="menu-btn" class="text-cream focus:outline-none focus:ring-2 focus:ring-cream rounded-sm p-1">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <div class="flex-1 text-center pr-8"> <!-- Added padding right to offset the menu button width and keep logo centered -->
             <a href="#home" class="text-2xl font-bold font-heading hover:text-brown-100 transition-colors">Kafe <span class="text-brown-300">Merkezi</span></a>
        </div>
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden transition-opacity"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-brown-900 text-cream z-40 transform -translate-x-full transition-transform duration-300 shadow-xl overflow-y-auto">
        <div class="p-4 flex justify-between items-center border-b border-brown-700">
            <span class="text-xl font-heading font-bold">Menü</span>
            <button id="close-btn" class="text-cream focus:outline-none focus:ring-2 focus:ring-cream rounded-sm p-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <nav class="p-4">
            <ul class="space-y-4 text-lg">
                <li><a href="#hakkinda" class="block hover:text-brown-300 transition-colors py-2 border-b border-brown-700/50">Hakkında</a></li>
                <li><a href="#destek" class="block hover:text-brown-300 transition-colors py-2 border-b border-brown-700/50">Destek</a></li>
                <li><a href="#iletisim" class="block hover:text-brown-300 transition-colors py-2 border-b border-brown-700/50">İletişim</a></li>
                <li><a href="#subeler" class="block hover:text-brown-300 transition-colors py-2 border-b border-brown-700/50">Şube Konumları</a></li>
                <li><a href="#menu" class="block hover:text-brown-300 transition-colors py-2 border-b border-brown-700/50">Menü İçerikleri</a></li>
                <li><a href="#fiyatlar" class="block hover:text-brown-300 transition-colors py-2">Fiyatlar</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main id="app" class="flex-1 flex flex-col">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-brown-900 text-cream text-center p-4 mt-auto">
        <p class="text-sm">&copy; 2024 Kafe Merkezi. Tüm hakları saklıdır.</p>
    </footer>

    <!-- Hidden Div for Dynamic Tailwind Classes -->
    <div class="hidden text-[#3E2723] bg-[#FFFDD0] bg-brown-900 text-cream font-heading font-body hover:text-brown-300 border-brown-700/50 grid grid-cols-1 md:grid-cols-2 gap-8 text-center px-4 max-w-4xl mx-auto py-12 rounded-lg shadow-md mb-8 flex-col justify-center items-center h-full min-h-[60vh] list-disc list-inside space-y-2 mt-4 max-w-md w-full bg-white bg-opacity-90"></div>

    <script src="app.js"></script>
</body>
</html>
