<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Web Sitesi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            100: '#D7CCC8',
                            500: '#795548',
                            900: '#3E2723',
                        },
                        cream: '#FFFDD0',
                    },
                    fontFamily: {
                        heading: ['Playfair Display', 'serif'],
                        body: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        @layer utilities {
            .transition-transform {
                transition-property: transform;
                transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
                transition-duration: 300ms;
            }
        }
        body {
            @apply font-body bg-cream text-brown-900;
        }
        h1, h2, h3, h4, h5, h6 {
            @apply font-heading;
        }
    </style>
</head>
<body class="bg-cream text-brown-900 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-brown-900 text-cream p-4 flex justify-between items-center shadow-md relative z-20">
        <button id="menu-btn" class="p-2 focus:outline-none" aria-label="Toggle menu">
            <svg class="w-8 h-8 fill-current" viewBox="0 0 24 24">
                <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <h1 class="text-2xl font-heading font-bold text-center flex-grow">Kafe Keyfi</h1>
        <div class="w-12"></div> <!-- Placeholder to balance header -->
    </header>

    <!-- Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-brown-900 text-cream p-6 z-40 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-lg overflow-y-auto">
        <div class="flex justify-between items-center mb-8 border-b border-brown-500 pb-4">
            <h2 class="text-xl font-heading font-bold">Menü</h2>
            <button id="close-btn" class="text-cream focus:outline-none" aria-label="Close menu">
                <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                    <path d="M6 18L18 6M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
        <ul class="space-y-4">
            <li><a href="#about" class="block py-2 px-4 hover:bg-brown-500 rounded transition-colors text-lg">Hakkında</a></li>
            <li><a href="#support" class="block py-2 px-4 hover:bg-brown-500 rounded transition-colors text-lg">Destek</a></li>
            <li><a href="#contact" class="block py-2 px-4 hover:bg-brown-500 rounded transition-colors text-lg">İletişim</a></li>
            <li><a href="#locations" class="block py-2 px-4 hover:bg-brown-500 rounded transition-colors text-lg">Şube Konumları</a></li>
            <li><a href="#menu-items" class="block py-2 px-4 hover:bg-brown-500 rounded transition-colors text-lg">Menü İçerikleri</a></li>
            <li><a href="#prices" class="block py-2 px-4 hover:bg-brown-500 rounded transition-colors text-lg">Fiyatlar</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main id="main-content" class="flex-grow p-6 w-full max-w-4xl mx-auto">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-brown-900 text-cream text-center p-4 mt-auto">
        <p>&copy; 2024 Kafe Keyfi. Tüm Hakları Saklıdır.</p>
    </footer>

    <!-- Force tailwind to include some classes used in JS -->
    <div class="hidden grid grid-cols-1 md:grid-cols-2 gap-6 text-xl font-bold bg-white p-6 rounded-lg shadow-md hover:shadow-lg flex justify-between border-b border-brown-100 last:border-0 py-3 mb-6 mb-4"></div>

    <script src="app.js"></script>
</body>
</html>
