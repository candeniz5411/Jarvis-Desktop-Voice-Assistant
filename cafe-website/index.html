<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: '#3E2723',
                        cream: '#FFFDD0',
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-cream text-brown">
    <!-- Tailwind Preflight for Dynamic Classes -->
    <div id="tailwind-preflight" class="hidden text-[#3E2723] bg-[#FFFDD0] border-[#3E2723] bg-brown text-cream text-white bg-white hover:bg-brown hover:text-white transition-transform duration-300 ease-in-out -translate-x-full fixed inset-0 z-40 z-50"></div>

    <!-- Header / Navbar -->
    <header class="fixed top-0 left-0 right-0 h-16 bg-brown text-cream shadow-md z-40 flex items-center px-4">
        <button id="menu-btn" class="text-cream hover:text-white focus:outline-none focus:ring-2 focus:ring-cream rounded p-1 mr-4">
            <i class="fas fa-bars fa-lg"></i>
        </button>
        <a href="#home" class="flex items-center space-x-2 text-xl font-bold font-serif hover:text-white transition-colors">
            <i class="fas fa-mug-hot"></i>
            <span>Kahve Dükkanı</span>
        </a>
    </header>

    <!-- Sidebar Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40 cursor-pointer"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-cream text-brown shadow-xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out pt-16 flex flex-col">
        <div class="px-6 py-4 flex-grow">
            <ul class="space-y-2">
                <li><a href="#home" class="block py-2 px-4 rounded hover:bg-brown hover:text-cream transition-colors font-semibold">Ana Sayfa</a></li>
                <li><a href="#hakkinda" class="block py-2 px-4 rounded hover:bg-brown hover:text-cream transition-colors font-semibold">Hakkında</a></li>
                <li><a href="#destek" class="block py-2 px-4 rounded hover:bg-brown hover:text-cream transition-colors font-semibold">Destek</a></li>
                <li><a href="#iletisim" class="block py-2 px-4 rounded hover:bg-brown hover:text-cream transition-colors font-semibold">İletişim</a></li>
                <li><a href="#subeler" class="block py-2 px-4 rounded hover:bg-brown hover:text-cream transition-colors font-semibold">Şube Konumları</a></li>
                <li><a href="#menu" class="block py-2 px-4 rounded hover:bg-brown hover:text-cream transition-colors font-semibold">Menü İçerikleri</a></li>
                <li><a href="#fiyatlar" class="block py-2 px-4 rounded hover:bg-brown hover:text-cream transition-colors font-semibold">Fiyatlar</a></li>
            </ul>
        </div>
        <div class="px-6 py-4 border-t border-brown/20 text-center text-sm">
            &copy; 2024 Kahve Dükkanı
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app" class="pt-16 min-h-screen px-4 py-8 max-w-4xl mx-auto">
        <!-- Content will be injected here by app.js -->
    </main>

    <script src="app.js"></script>
</body>
</html>
