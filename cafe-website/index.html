<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            100: '#795548',
                            900: '#3E2723',
                        },
                        cream: '#FFFDD0',
                    },
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cream text-brown-900 font-sans min-h-screen m-0 p-0 flex flex-col">

    <!-- Overlay -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sliding Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-brown-900 text-cream z-50 transform -translate-x-full transition-transform duration-300 ease-in-out overflow-y-auto">
        <div class="p-6 flex justify-between items-center border-b border-brown-100 border-opacity-30">
            <span class="text-xl font-serif font-bold">Menü</span>
            <button id="closeSidebarBtn" class="text-cream hover:text-white focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <nav class="p-4 flex flex-col space-y-2">
            <a href="#/" class="sidebar-link block py-2 px-4 rounded hover:bg-brown-100 transition duration-200">Ana Sayfa</a>
            <a href="#/hakkinda" class="sidebar-link block py-2 px-4 rounded hover:bg-brown-100 transition duration-200">Hakkında</a>
            <a href="#/destek" class="sidebar-link block py-2 px-4 rounded hover:bg-brown-100 transition duration-200">Destek</a>
            <a href="#/iletisim" class="sidebar-link block py-2 px-4 rounded hover:bg-brown-100 transition duration-200">İletişim</a>
            <a href="#/subeler" class="sidebar-link block py-2 px-4 rounded hover:bg-brown-100 transition duration-200">Şube Konumları</a>
            <a href="#/menu" class="sidebar-link block py-2 px-4 rounded hover:bg-brown-100 transition duration-200">Menü İçerikleri</a>
            <a href="#/fiyatlar" class="sidebar-link block py-2 px-4 rounded hover:bg-brown-100 transition duration-200">Fiyatlar</a>
        </nav>
    </aside>

    <!-- Header -->
    <header class="bg-brown-900 text-cream p-4 flex items-center shadow-md sticky top-0 z-30">
        <button id="openSidebarBtn" class="mr-4 focus:outline-none hover:text-white transition duration-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
        <div class="flex items-center gap-3">
            <img src="./Images/logo.png" alt="Cafe Logo" class="h-8 w-8 brightness-0 invert">
            <h1 class="text-2xl font-serif font-bold tracking-wider">Cafe Serenity</h1>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app-content" class="flex-grow p-6 sm:p-10 max-w-5xl mx-auto w-full">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-brown-900 text-cream text-center p-4 mt-auto">
        <p>&copy; 2024 Cafe Serenity. Tüm hakları saklıdır.</p>
    </footer>

    <!-- Hidden div for dynamically injected classes -->
    <div class="hidden text-[#3E2723] text-4xl mb-4 font-serif text-center mb-8 mb-6 mt-4 w-full h-auto rounded-lg shadow-lg max-w-2xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6 bg-white p-4 justify-between border-b border-gray-200 font-bold text-xl text-lg text-gray-600 bg-gray-50 flex flex-col items-center"></div>

    <script src="app.js"></script>
</body>
</html>
