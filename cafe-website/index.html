<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kahve: '#3E2723',
                        krem: '#FFFDD0'
                    },
                    fontFamily: {
                        baslik: ['"Playfair Display"', 'serif'],
                        metin: ['Lato', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .hidden-classes {
                @apply text-[#3E2723] bg-[#FFFDD0];
            }
        }
        body {
            @apply font-metin bg-krem text-kahve;
        }
        h1, h2, h3, h4, h5, h6 {
            @apply font-baslik;
        }
    </style>
</head>
<body class="bg-krem text-kahve min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-kahve text-krem p-4 flex items-center shadow-md relative z-20">
        <button id="menu-btn" class="focus:outline-none z-30 mr-4">
            <svg class="w-8 h-8 text-krem" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <h1 class="text-2xl font-bold font-baslik text-center flex-1 pr-12">Kahve Dükkanı</h1>
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-10 hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-kahve text-krem z-20 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-lg pt-20">
        <ul class="flex flex-col space-y-2 p-4">
            <li><a href="#hakkinda" class="block py-2 px-4 hover:bg-krem hover:text-kahve rounded transition duration-200">Hakkında</a></li>
            <li><a href="#destek" class="block py-2 px-4 hover:bg-krem hover:text-kahve rounded transition duration-200">Destek</a></li>
            <li><a href="#iletisim" class="block py-2 px-4 hover:bg-krem hover:text-kahve rounded transition duration-200">İletişim</a></li>
            <li><a href="#sube-konumlari" class="block py-2 px-4 hover:bg-krem hover:text-kahve rounded transition duration-200">Şube Konumları</a></li>
            <li><a href="#menu-icerikleri" class="block py-2 px-4 hover:bg-krem hover:text-kahve rounded transition duration-200">Menü İçerikleri</a></li>
            <li><a href="#fiyatlar" class="block py-2 px-4 hover:bg-krem hover:text-kahve rounded transition duration-200">Fiyatlar</a></li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main id="app" class="flex-grow p-6 sm:p-10 max-w-4xl mx-auto w-full">
        <!-- Content will be loaded here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-kahve text-krem text-center p-4 mt-auto">
        <p>&copy; 2026 Kahve Dükkanı. Tüm hakları saklıdır.</p>
    </footer>

    <!-- To force tailwind to compile dynamic classes we might use -->
    <div class="hidden text-[#3E2723] bg-[#FFFDD0] border-kahve"></div>

    <script src="app.js"></script>
</body>
</html>
