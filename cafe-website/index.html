<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            dark: '#3E2723',
                            light: '#5D4037',
                            cream: '#FFFDD0',
                            accent: '#D7CCC8'
                        }
                    },
                    fontFamily: {
                        heading: ['"Playfair Display"', 'serif'],
                        body: ['"Lato"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            .nav-link {
                @apply block py-3 px-6 text-lg font-heading text-coffee-dark hover:bg-coffee-accent hover:text-coffee-dark transition-colors duration-200 border-b border-coffee-accent/30 last:border-0;
            }
        }
    </style>
</head>
<body class="bg-coffee-cream font-body text-coffee-dark min-h-screen flex flex-col m-0 p-0 overflow-x-hidden">

    <!-- Header -->
    <header class="bg-coffee-dark text-coffee-cream shadow-md fixed w-full top-0 z-40 h-16 flex items-center px-4">
        <button id="menu-btn" class="p-2 focus:outline-none focus:ring-2 focus:ring-coffee-cream rounded-md" aria-label="Menüyü aç">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <div class="flex-1 text-center pr-10">
            <h1 class="text-2xl font-heading font-bold flex items-center justify-center gap-2">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2,21V19H20V21H2M20,8V5H18V8H20M20,3A2,2 0 0,1 22,5V8A2,2 0 0,1 20,10H18V13A4,4 0 0,1 14,17H8A4,4 0 0,1 4,13V3H20M16,5H6V13A2,2 0 0,0 8,15H14A2,2 0 0,0 16,13V5Z"/>
                </svg>
                Kahve Dükkanı
            </h1>
        </div>
    </header>

    <!-- Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-coffee-cream shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="h-16 bg-coffee-dark flex items-center justify-between px-4 text-coffee-cream">
            <span class="text-xl font-heading font-bold">Menü</span>
            <button id="close-btn" class="p-2 focus:outline-none rounded-md" aria-label="Menüyü kapat">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <nav class="flex-1 overflow-y-auto py-4">
            <ul class="flex flex-col">
                <li><a href="#/" class="nav-link" id="nav-home">Ana Sayfa</a></li>
                <li><a href="#/hakkinda" class="nav-link" id="nav-about">Hakkında</a></li>
                <li><a href="#/destek" class="nav-link" id="nav-support">Destek</a></li>
                <li><a href="#/iletisim" class="nav-link" id="nav-contact">İletişim</a></li>
                <li><a href="#/subeler" class="nav-link" id="nav-locations">Şube Konumları</a></li>
                <li><a href="#/menu" class="nav-link" id="nav-menu">Menü İçerikleri</a></li>
                <li><a href="#/fiyatlar" class="nav-link" id="nav-prices">Fiyatlar</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main id="app" class="flex-1 pt-20 px-4 pb-8 w-full max-w-4xl mx-auto min-h-[calc(100vh-4rem)]">
        <!-- Content injected by app.js -->
    </main>

    <!-- Hidden div for dynamically added Tailwind classes -->
    <div class="hidden text-[#3E2723] bg-[#FFFDD0] bg-coffee-cream text-coffee-dark bg-coffee-dark text-coffee-cream grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 p-6 rounded-lg shadow-md mb-6 object-cover w-full h-64 rounded-xl border border-coffee-accent/50 flex justify-between items-center text-xl font-bold border-b pb-2 mb-4"></div>

    <script src="app.js"></script>
</body>
</html>
