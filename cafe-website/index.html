<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Web Sitesi</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            900: '#3E2723',
                            800: '#4e342e',
                            700: '#5d4037',
                            600: '#6d4c41'
                        },
                        cream: '#FFFDD0'
                    },
                    fontFamily: {
                        heading: ['"Playfair Display"', 'serif'],
                        body: ['Lato', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-heading {
                @apply font-heading text-brown-900;
            }
            .bg-main {
                @apply bg-cream text-brown-900 font-body;
            }
        }
    </style>
</head>
<body class="bg-main h-screen flex flex-col overflow-hidden">

    <!-- Header / Navbar -->
    <header class="bg-brown-900 text-cream p-4 flex items-center justify-between shadow-md relative z-20">
        <button id="menu-btn" class="text-cream focus:outline-none focus:ring-2 focus:ring-cream p-1 rounded" aria-label="Menüyü aç">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <h1 class="text-2xl font-heading font-bold mx-auto absolute left-1/2 transform -translate-x-1/2">Kafe Logo</h1>
        <div class="w-8"></div> <!-- Spacer for centering -->
    </header>

    <!-- Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-cream shadow-xl z-40 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-4 bg-brown-900 text-cream flex justify-between items-center">
            <h2 class="text-xl font-heading font-semibold">Menü</h2>
            <button id="close-btn" class="text-cream focus:outline-none focus:ring-2 focus:ring-cream p-1 rounded" aria-label="Menüyü kapat">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <nav class="flex-grow p-4 overflow-y-auto">
            <ul class="space-y-2">
                <li><a href="#/" class="block py-2 px-4 text-brown-900 hover:bg-brown-800 hover:text-cream rounded transition-colors duration-200">Ana Sayfa</a></li>
                <li><a href="#/hakkinda" class="block py-2 px-4 text-brown-900 hover:bg-brown-800 hover:text-cream rounded transition-colors duration-200">Hakkında</a></li>
                <li><a href="#/destek" class="block py-2 px-4 text-brown-900 hover:bg-brown-800 hover:text-cream rounded transition-colors duration-200">Destek</a></li>
                <li><a href="#/iletisim" class="block py-2 px-4 text-brown-900 hover:bg-brown-800 hover:text-cream rounded transition-colors duration-200">İletişim</a></li>
                <li><a href="#/subeler" class="block py-2 px-4 text-brown-900 hover:bg-brown-800 hover:text-cream rounded transition-colors duration-200">Şube Konumları</a></li>
                <li><a href="#/menu-icerikleri" class="block py-2 px-4 text-brown-900 hover:bg-brown-800 hover:text-cream rounded transition-colors duration-200">Menü İçerikleri</a></li>
                <li><a href="#/fiyatlar" class="block py-2 px-4 text-brown-900 hover:bg-brown-800 hover:text-cream rounded transition-colors duration-200">Fiyatlar</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content Area (SPA Router Container) -->
    <main id="app-container" class="flex-grow overflow-y-auto p-4 md:p-8 relative z-10 w-full max-w-4xl mx-auto">
        <!-- JS will inject content here -->
    </main>

    <!-- Safelist for dynamic classes injected by JS -->
    <div class="hidden text-center max-w-2xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-4 bg-white p-6 rounded-lg shadow-md border-b border-brown-900/10 flex justify-between font-bold mt-4 space-y-4 mb-4 font-heading text-3xl mb-6 text-brown-900 list-disc list-inside space-y-2 rounded-xl mb-8 object-cover h-64 w-full"></div>

    <script src="app.js"></script>
</body>
</html>
