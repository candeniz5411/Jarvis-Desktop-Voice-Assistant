<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cafeBrown: '#3E2723',
                        cafeCream: '#FFFDD0',
                    },
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-cafeCream text-cafeBrown font-sans antialiased overflow-x-hidden min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-cafeBrown text-cafeCream shadow-md fixed w-full top-0 z-40 h-16 flex items-center justify-between px-4">
        <button id="menu-btn" class="p-2 focus:outline-none focus:ring-2 focus:ring-cafeCream rounded-md" aria-label="Menüyü Aç">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <div class="text-2xl font-serif font-bold tracking-wider absolute left-1/2 transform -translate-x-1/2">
            Kahve Dükkanı
        </div>
        <div class="w-8"></div> <!-- Spacer for balancing the title -->
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-white shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="bg-cafeBrown text-cafeCream h-16 flex items-center px-4 justify-between shrink-0">
            <span class="text-xl font-serif font-bold">Menü</span>
            <button id="close-btn" class="p-2 focus:outline-none focus:ring-2 focus:ring-cafeCream rounded-md" aria-label="Menüyü Kapat">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <nav class="flex-1 overflow-y-auto py-4">
            <ul class="space-y-2">
                <li><a href="#/ana-sayfa" class="nav-link block px-6 py-3 hover:bg-cafeCream hover:text-cafeBrown transition-colors font-medium">Ana Sayfa</a></li>
                <li><a href="#/hakkinda" class="nav-link block px-6 py-3 hover:bg-cafeCream hover:text-cafeBrown transition-colors font-medium">Hakkında</a></li>
                <li><a href="#/destek" class="nav-link block px-6 py-3 hover:bg-cafeCream hover:text-cafeBrown transition-colors font-medium">Destek</a></li>
                <li><a href="#/iletisim" class="nav-link block px-6 py-3 hover:bg-cafeCream hover:text-cafeBrown transition-colors font-medium">İletişim</a></li>
                <li><a href="#/sube-konumlari" class="nav-link block px-6 py-3 hover:bg-cafeCream hover:text-cafeBrown transition-colors font-medium">Şube Konumları</a></li>
                <li><a href="#/menu-icerikleri" class="nav-link block px-6 py-3 hover:bg-cafeCream hover:text-cafeBrown transition-colors font-medium">Menü İçerikleri</a></li>
                <li><a href="#/fiyatlar" class="nav-link block px-6 py-3 hover:bg-cafeCream hover:text-cafeBrown transition-colors font-medium">Fiyatlar</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main id="app-content" class="flex-grow pt-20 px-4 md:px-8 pb-8 max-w-5xl mx-auto w-full">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Tailwind Dynamic Classes Safelist -->
    <div id="tailwind-safelist" class="hidden text-cafeBrown text-cafeCream bg-cafeBrown bg-cafeCream hover:bg-cafeCream font-sans font-serif text-3xl mb-6 text-center shadow-lg rounded-xl overflow-hidden md:flex gap-8 items-center grid md:grid-cols-2 md:grid-cols-3 md:grid-cols-4 p-6 p-8 border border-cafeBrown/20 justify-between items-start space-y-4 space-y-6 w-full max-w-md mx-auto focus:ring-cafeBrown focus:border-cafeBrown aspect-video object-cover text-gray-600 font-bold mb-2 list-disc pl-5 mt-4 text-4xl mb-4 mb-8 h-64 h-80 h-96"></div>

    <script src="app.js"></script>
</body>
</html>
