<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Web Sitesi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            900: '#3E2723',
                            800: '#4E342E',
                            700: '#5D4037',
                        },
                        cream: '#FFFDD0'
                    },
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .nav-link {
                @apply block py-3 px-6 text-lg text-cream hover:bg-brown-800 transition duration-200;
            }
        }
        body {
            @apply bg-cream text-brown-900 font-sans;
        }
        h1, h2, h3, h4, h5, h6 {
            @apply font-serif;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Pre-declare dynamic classes for Tailwind JIT -->
    <div class="hidden grid-cols-1 md:grid-cols-2 gap-6 p-6 text-center text-4xl mb-4 font-bold max-w-4xl mx-auto shadow-lg bg-white rounded-lg flex justify-between items-center border-b pb-2 mb-2 text-2xl font-bold mt-8" id="tailwind-preflight"></div>

    <!-- Header -->
    <header class="bg-brown-900 text-cream p-4 shadow-md flex items-center relative z-20">
        <!-- Hamburger Menu Button -->
        <button id="menu-btn" class="p-2 mr-4 hover:bg-brown-800 rounded focus:outline-none focus:ring-2 focus:ring-cream z-50">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>

        <!-- Logo/Title -->
        <a href="#" class="text-3xl font-serif font-bold tracking-wide">Kafe Kahve</a>
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden transition-opacity duration-300"></div>

    <!-- Sliding Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-brown-900 text-cream transform -translate-x-full transition-transform duration-300 ease-in-out z-40 overflow-y-auto shadow-2xl pt-20">
        <ul class="flex flex-col mt-4">
            <li><a href="#" class="nav-link">Ana Sayfa</a></li>
            <li><a href="#hakkinda" class="nav-link">Hakkında</a></li>
            <li><a href="#destek" class="nav-link">Destek</a></li>
            <li><a href="#iletisim" class="nav-link">İletişim</a></li>
            <li><a href="#subeler" class="nav-link">Şube Konumları</a></li>
            <li><a href="#menu" class="nav-link">Menü İçerikleri</a></li>
            <li><a href="#fiyatlar" class="nav-link">Fiyatlar</a></li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main id="app" class="flex-grow flex flex-col items-center justify-start p-6">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-brown-900 text-cream text-center p-4 mt-auto">
        <p>&copy; 2026 Kafe Kahve. Tüm hakları saklıdır.</p>
    </footer>

    <!-- Application Script -->
    <script src="app.js"></script>
</body>
</html>
