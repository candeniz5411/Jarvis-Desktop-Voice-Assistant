<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#3E2723', // Dark brown
                            light: '#FFFDD0', // Cream
                            bg: '#FFFFFF', // White
                            hover: '#5D4037', // Slightly lighter brown for hover
                            text: '#2C1B18' // Very dark brown for better readability
                        }
                    },
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .heading {
                @apply font-serif text-brand-dark font-bold;
            }
            .body-text {
                @apply font-sans text-brand-text;
            }
        }
    </style>
</head>
<body class="bg-brand-light body-text m-0 p-0 overflow-x-hidden min-h-screen flex flex-col">
    <!-- Dummy div for dynamic Tailwind classes used in JS -->
    <div class="hidden bg-brand-light text-brand-dark text-xl font-bold font-serif mb-4 shadow-md rounded-lg p-6 max-w-2xl mx-auto w-full text-center grid grid-cols-1 md:grid-cols-2 gap-4 flex justify-between items-center border-b border-brand-dark pb-2 list-none object-cover h-64 w-full"></div>

    <!-- Header -->
    <header class="bg-brand-dark text-brand-light py-4 px-6 flex items-center shadow-md fixed w-full top-0 z-40">
        <!-- Hamburger Menu -->
        <button id="hamburger-btn" class="focus:outline-none hover:text-white transition-colors p-2 -ml-2">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <!-- Logo / Brand Name -->
        <div class="flex-grow text-center mr-6">
            <a href="#home" class="font-serif text-2xl font-bold tracking-wider uppercase flex items-center justify-center gap-2 inline-flex">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2,21V19H20V21H2C2,21 2,21 2,21M20,8V5H18V8H20M20,3A2,2 0 0,1 22,5V8A2,2 0 0,1 20,10H18V13A4,4 0 0,1 14,17H8A4,4 0 0,1 4,13V3H20M16,5H6V13A2,2 0 0,0 8,15H14A2,2 0 0,0 16,13V5Z" />
                </svg>
                Kahve Dükkanı
            </a>
        </div>
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-brand-bg text-brand-dark shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-6 bg-brand-dark text-brand-light flex items-center justify-between">
            <span class="font-serif text-xl font-bold">Menü</span>
            <button id="close-btn" class="focus:outline-none hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <ul class="flex-grow py-4 overflow-y-auto">
            <li><a href="#hakkinda" class="block px-6 py-3 hover:bg-brand-light transition-colors font-semibold border-b border-brand-light border-opacity-50">Hakkında</a></li>
            <li><a href="#destek" class="block px-6 py-3 hover:bg-brand-light transition-colors font-semibold border-b border-brand-light border-opacity-50">Destek</a></li>
            <li><a href="#iletisim" class="block px-6 py-3 hover:bg-brand-light transition-colors font-semibold border-b border-brand-light border-opacity-50">İletişim</a></li>
            <li><a href="#sube-konumlari" class="block px-6 py-3 hover:bg-brand-light transition-colors font-semibold border-b border-brand-light border-opacity-50">Şube Konumları</a></li>
            <li><a href="#menu-icerikleri" class="block px-6 py-3 hover:bg-brand-light transition-colors font-semibold border-b border-brand-light border-opacity-50">Menü İçerikleri</a></li>
            <li><a href="#fiyatlar" class="block px-6 py-3 hover:bg-brand-light transition-colors font-semibold">Fiyatlar</a></li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main id="content" class="flex-grow mt-16 p-6 container mx-auto max-w-4xl">
        <!-- SPA content injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-brand-dark text-brand-light py-6 text-center mt-auto">
        <p class="font-sans text-sm">&copy; <span id="year"></span> Kahve Dükkanı. Tüm Hakları Saklıdır.</p>
    </footer>

    <!-- App JS -->
    <script src="app.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
