<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kafe Portalı</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cafeDark: '#3E2723',
            cafeCream: '#FFFDD0',
          },
          fontFamily: {
            heading: ['Playfair Display', 'serif'],
            body: ['Lato', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-cafeCream text-cafeDark font-body min-h-screen relative overflow-x-hidden">

  <!-- Header / Navbar -->
  <header class="w-full py-4 px-6 flex justify-between items-center bg-white shadow-md relative z-20">
    <button id="menu-btn" class="p-2 focus:outline-none focus:ring-2 focus:ring-cafeDark rounded group flex flex-col justify-between w-8 h-6">
      <span class="block w-full h-[3px] bg-cafeDark transition duration-300"></span>
      <span class="block w-full h-[3px] bg-cafeDark transition duration-300"></span>
      <span class="block w-full h-[3px] bg-cafeDark transition duration-300"></span>
    </button>
    <h1 class="text-2xl font-heading font-bold mx-auto pr-8">Kafe Portalı</h1>
  </header>

  <!-- Sidebar Overlay -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden transition-opacity duration-300"></div>

  <!-- Sidebar -->
  <nav id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-white shadow-2xl z-40 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
    <div class="p-6 border-b border-gray-200 flex justify-between items-center bg-cafeCream">
      <h2 class="text-xl font-heading font-bold text-cafeDark">Menü</h2>
      <button id="close-btn" class="text-2xl focus:outline-none">&times;</button>
    </div>
    <ul class="flex flex-col py-4 flex-grow overflow-y-auto">
      <li><a href="#home" class="block py-3 px-6 hover:bg-cafeCream transition font-semibold">Ana Sayfa</a></li>
      <li><a href="#about" class="block py-3 px-6 hover:bg-cafeCream transition font-semibold">Hakkında</a></li>
      <li><a href="#support" class="block py-3 px-6 hover:bg-cafeCream transition font-semibold">Destek</a></li>
      <li><a href="#contact" class="block py-3 px-6 hover:bg-cafeCream transition font-semibold">İletişim</a></li>
      <li><a href="#locations" class="block py-3 px-6 hover:bg-cafeCream transition font-semibold">Şube Konumları</a></li>
      <li><a href="#menu-contents" class="block py-3 px-6 hover:bg-cafeCream transition font-semibold">Menü İçerikleri</a></li>
      <li><a href="#prices" class="block py-3 px-6 hover:bg-cafeCream transition font-semibold">Fiyatlar</a></li>
    </ul>
  </nav>

  <!-- Main Content Area -->
  <main id="app" class="p-6 md:p-12 w-full max-w-4xl mx-auto flex-grow transition-all duration-300">
    <!-- Content gets injected here by app.js -->
  </main>

  <!-- Footer -->
  <footer class="w-full text-center py-6 border-t border-gray-300 mt-auto bg-white opacity-80 text-sm">
    <p>&copy; 2023 Kafe Portalı. Tüm hakları saklıdır.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
