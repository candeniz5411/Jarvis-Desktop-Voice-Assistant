<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            900: '#3E2723',
                            800: '#4E342E',
                            700: '#5D4037',
                            100: '#D7CCC8'
                        },
                        cream: '#FFFDD0'
                    },
                    fontFamily: {
                        heading: ['"Playfair Display"', 'serif'],
                        body: ['Lato', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cream text-brown-900 font-body m-0 p-0 overflow-x-hidden">

    <!-- Header -->
    <header class="fixed top-0 left-0 w-full bg-white shadow-md z-40 flex items-center p-4">
        <!-- Hamburger Menu Button -->
        <button id="menu-btn" class="p-2 mr-4 focus:outline-none" aria-label="Menüyü aç">
            <svg class="w-8 h-8 text-brown-900" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>

        <!-- Logo -->
        <h1 class="font-heading text-2xl font-bold text-brown-900 m-0"><a href="#anasayfa">Kafe</a></h1>
    </header>

    <!-- Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-white shadow-lg z-50 transform -translate-x-full transition-transform duration-300 ease-in-out">
        <div class="p-4 flex justify-between items-center border-b border-brown-100">
            <span class="font-heading text-xl font-bold text-brown-900">Menü</span>
            <button id="close-btn" class="text-brown-900 p-2 focus:outline-none" aria-label="Menüyü kapat">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <ul class="flex flex-col p-4 space-y-4">
            <li><a href="#hakkinda" class="block text-lg hover:text-brown-700 transition-colors">Hakkında</a></li>
            <li><a href="#destek" class="block text-lg hover:text-brown-700 transition-colors">Destek</a></li>
            <li><a href="#iletisim" class="block text-lg hover:text-brown-700 transition-colors">İletişim</a></li>
            <li><a href="#subeler" class="block text-lg hover:text-brown-700 transition-colors">Şube Konumları</a></li>
            <li><a href="#menu-icerikleri" class="block text-lg hover:text-brown-700 transition-colors">Menü İçerikleri</a></li>
            <li><a href="#fiyatlar" class="block text-lg hover:text-brown-700 transition-colors">Fiyatlar</a></li>
        </ul>
    </nav>

    <!-- Main Content Container -->
    <main id="content" class="pt-20 p-6 min-h-screen">
        <!-- Content will be dynamically loaded here by app.js -->
    </main>

    <script src="app.js"></script>
</body>
</html>
