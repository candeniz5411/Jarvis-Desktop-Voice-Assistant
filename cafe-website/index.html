<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Web Sitesi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            100: '#D7CCC8',
                            200: '#BCAAA4',
                            300: '#A1887F',
                            400: '#8D6E63',
                            500: '#795548',
                            600: '#6D4C41',
                            700: '#5D4037',
                            800: '#4E342E',
                            900: '#3E2723',
                        },
                        cream: '#F5F5DC',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .nav-link {
                @apply block py-3 px-6 text-brown-800 hover:bg-brown-100 hover:text-brown-900 transition-colors duration-200 border-b border-brown-200 font-medium;
            }
            .section-title {
                @apply text-3xl font-bold text-brown-900 mb-6 border-b-2 border-brown-300 pb-2 inline-block;
            }
        }

        body {
            @apply bg-cream text-brown-900;
        }

        /* Hide scrollbar for sidebar but allow scrolling */
        #sidebar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        #sidebar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-brown-800 text-cream p-4 shadow-md sticky top-0 z-40 flex items-center justify-between">
        <div class="flex items-center">
            <!-- Hamburger Menu Button -->
            <button id="menu-btn" class="p-2 mr-4 focus:outline-none hover:bg-brown-700 rounded transition-colors" aria-label="Menüyü aç">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <h1 class="text-2xl font-bold tracking-wider">KAFE <span class="text-brown-300">LOGO</span></h1>
        </div>
    </header>

    <!-- Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-cream shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out overflow-y-auto">
        <div class="p-6 bg-brown-800 text-cream flex justify-between items-center">
            <h2 class="text-xl font-bold">Menü</h2>
            <button id="close-btn" class="text-cream hover:text-brown-300 focus:outline-none" aria-label="Menüyü kapat">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <ul class="py-2">
            <li><a href="#anasayfa" class="nav-link">Ana Sayfa</a></li>
            <li><a href="#hakkinda" class="nav-link">Hakkında</a></li>
            <li><a href="#destek" class="nav-link">Destek</a></li>
            <li><a href="#iletisim" class="nav-link">İletişim</a></li>
            <li><a href="#subeler" class="nav-link">Şube Konumları</a></li>
            <li><a href="#menu" class="nav-link">Menü İçerikleri</a></li>
            <li><a href="#fiyatlar" class="nav-link border-b-0">Fiyatlar</a></li>
        </ul>
    </nav>

    <!-- Main Content Area (SPA Container) -->
    <main id="app" class="flex-grow p-4 md:p-8 w-full max-w-6xl mx-auto">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-brown-900 text-brown-200 py-6 text-center mt-auto">
        <p>&copy; 2024 Kafe Web Sitesi. Tüm hakları saklıdır.</p>
    </footer>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
