<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @layer components {
            .page-title {
                @apply text-4xl md:text-5xl text-coffee-dark mb-8 border-b-2 border-coffee-light pb-4 font-heading;
            }
            .card {
                @apply bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition-shadow duration-300;
            }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            dark: '#3E2723',
                            medium: '#4E342E',
                            light: '#5D4037',
                        },
                        cream: {
                            DEFAULT: '#FFFDD0',
                            light: '#FFFFF0',
                        }
                    },
                    fontFamily: {
                        heading: ['"Playfair Display"', 'serif'],
                        body: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">

    <!-- Application Logic -->
    <script src="app.js" defer></script>
</head>
<body class="bg-cream-light text-coffee-dark font-body antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-coffee-dark text-cream p-4 flex items-center shadow-md sticky top-0 z-40">
        <!-- Hamburger Menu Button -->
        <button id="hamburger-menu" class="p-2 focus:outline-none hover:bg-coffee-medium rounded transition" aria-label="Menüyü Aç">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>

        <!-- Logo / Title -->
        <div class="ml-4 flex-grow flex items-center justify-center sm:justify-start">
            <a href="#/" class="text-2xl font-heading font-bold text-cream hover:text-white transition">Kahve Dükkanı</a>
        </div>
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>

    <!-- Sliding Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-coffee-dark text-cream shadow-2xl transform -translate-x-full transition-transform duration-300 ease-in-out z-50 overflow-y-auto">
        <div class="p-6">
            <h2 class="text-2xl font-heading font-bold border-b border-coffee-light pb-4 mb-4">Menü</h2>
            <ul class="space-y-2">
                <li><a href="#/hakkinda" class="block py-2 px-4 rounded hover:bg-coffee-medium transition">Hakkında</a></li>
                <li><a href="#/destek" class="block py-2 px-4 rounded hover:bg-coffee-medium transition">Destek</a></li>
                <li><a href="#/iletisim" class="block py-2 px-4 rounded hover:bg-coffee-medium transition">İletişim</a></li>
                <li><a href="#/sube-konumlari" class="block py-2 px-4 rounded hover:bg-coffee-medium transition">Şube Konumları</a></li>
                <li><a href="#/menu-icerikleri" class="block py-2 px-4 rounded hover:bg-coffee-medium transition">Menü İçerikleri</a></li>
                <li><a href="#/fiyatlar" class="block py-2 px-4 rounded hover:bg-coffee-medium transition">Fiyatlar</a></li>
            </ul>
        </div>
        <!-- Close button inside sidebar for convenience -->
        <button id="close-sidebar" class="absolute top-4 right-4 p-2 text-cream hover:text-white focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </nav>

    <!-- Main Content Area -->
    <main id="main-content" class="flex-grow p-4 sm:p-8">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-coffee-dark text-cream text-center p-4 mt-auto">
        <p class="text-sm">&copy; 2024 Kahve Dükkanı. Tüm Hakları Saklıdır.</p>
    </footer>

    <!-- Hidden Div for Tailwind Safelist (Dynamic Classes) -->
    <div id="tailwind-safelist" class="hidden text-[#3E2723] bg-[#FFFDD0] bg-cream text-coffee-dark bg-coffee-dark text-cream grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 p-6 border rounded-lg shadow-lg font-heading font-body text-4xl mb-6 text-xl mb-2 text-gray-700 font-bold border-b pb-2 flex justify-between items-center bg-white shadow-sm hover:shadow-md transition object-cover h-64 w-full rounded-xl mt-8"></div>

</body>
</html>
