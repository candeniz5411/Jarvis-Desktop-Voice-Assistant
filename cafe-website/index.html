<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#3E2723',
                            cream: '#FFFDD0',
                            light: '#F5F5DC',
                            accent: '#D7CCC8'
                        }
                    },
                    fontFamily: {
                        heading: ['"Playfair Display"', 'serif'],
                        body: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .heading {
                @apply font-heading text-brand-dark;
            }
            .body-text {
                @apply font-body text-gray-800;
            }
        }
    </style>
</head>
<body class="bg-brand-cream body-text flex flex-col min-h-screen">

    <!-- Hidden div to force Tailwind to generate dynamic classes used in app.js -->
    <div class="hidden text-[#3E2723] bg-brand-light bg-brand-cream border-brand-accent p-6 rounded-lg shadow-md mb-8 max-w-2xl mx-auto flex justify-between border-b grid grid-cols-1 md:grid-cols-2 gap-6 text-center text-xl font-bold font-heading mb-4 text-gray-600 space-y-4 hover:text-brand-accent transition-colors bg-white shadow rounded p-4 flex flex-col items-center"></div>

    <!-- Header -->
    <header class="bg-brand-dark text-white p-4 sticky top-0 z-40 shadow-md">
        <div class="container mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <!-- Hamburger Menu Button -->
                <button id="menu-btn" class="p-2 focus:outline-none hover:bg-brand-accent hover:text-brand-dark rounded transition-colors" aria-label="Menüyü Aç">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <div class="flex items-center gap-2">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2,21H20V19H2M15,3H16V6H15V3M17,3H18V6H17V3M19,3H20V6H19V3M15.5,18H8.5L8,7H16L15.5,18Z"/>
                    </svg>
                    <h1 class="font-heading text-2xl font-bold tracking-wider"><a href="#/">Kahve Dükkanı</a></h1>
                </div>
            </div>
        </div>
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-brand-dark text-brand-cream z-50 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-2xl flex flex-col">
        <div class="p-4 flex justify-between items-center border-b border-brand-accent/30">
            <span class="font-heading text-xl font-bold">Menü</span>
            <button id="close-btn" class="p-2 focus:outline-none hover:bg-brand-accent hover:text-brand-dark rounded transition-colors" aria-label="Menüyü Kapat">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <ul class="flex-grow py-4 flex flex-col space-y-2">
            <li><a href="#/" class="block px-6 py-3 hover:bg-brand-accent hover:text-brand-dark transition-colors font-semibold">Ana Sayfa</a></li>
            <li><a href="#/hakkinda" class="block px-6 py-3 hover:bg-brand-accent hover:text-brand-dark transition-colors font-semibold">Hakkında</a></li>
            <li><a href="#/destek" class="block px-6 py-3 hover:bg-brand-accent hover:text-brand-dark transition-colors font-semibold">Destek</a></li>
            <li><a href="#/iletisim" class="block px-6 py-3 hover:bg-brand-accent hover:text-brand-dark transition-colors font-semibold">İletişim</a></li>
            <li><a href="#/subeler" class="block px-6 py-3 hover:bg-brand-accent hover:text-brand-dark transition-colors font-semibold">Şube Konumları</a></li>
            <li><a href="#/menu" class="block px-6 py-3 hover:bg-brand-accent hover:text-brand-dark transition-colors font-semibold">Menü İçerikleri</a></li>
            <li><a href="#/fiyatlar" class="block px-6 py-3 hover:bg-brand-accent hover:text-brand-dark transition-colors font-semibold">Fiyatlar</a></li>
        </ul>
        <div class="p-4 border-t border-brand-accent/30 text-sm text-center text-brand-accent/70">
            &copy; 2024 Kahve Dükkanı
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto p-4 md:p-8 relative">
        <div id="app" class="animate-fade-in w-full max-w-4xl mx-auto">
            <!-- Content will be injected here by app.js -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-brand-dark text-brand-cream text-center p-4 mt-auto">
        <p class="font-body text-sm">&copy; 2024 Kahve Dükkanı. Tüm hakları saklıdır.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
