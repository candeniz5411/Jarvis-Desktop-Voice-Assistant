<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'coffee-dark': '#3E2723',
                        'coffee-light': '#D7CCC8',
                        'cream': '#FFFDD0',
                    },
                    fontFamily: {
                        'playfair': ['"Playfair Display"', 'serif'],
                        'lato': ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .heading-font {
                font-family: 'Playfair Display', serif;
            }
            .body-font {
                font-family: 'Lato', sans-serif;
            }
        }
    </style>
</head>
<body class="bg-white text-coffee-dark body-font flex flex-col min-h-screen">

    <!-- Pre-declare arbitrary classes used in dynamic content for Tailwind JIT -->
    <div class="hidden text-[#3E2723] bg-[#FFFDD0] border-[#3E2723]"></div>

    <!-- Header -->
    <header class="bg-cream shadow-md p-4 flex items-center justify-between sticky top-0 z-40">
        <div class="flex items-center">
            <!-- Hamburger Button -->
            <button id="menu-btn" class="text-coffee-dark focus:outline-none focus:ring-2 focus:ring-coffee-dark rounded p-1 mr-4 z-50">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <h1 class="text-2xl font-bold heading-font flex items-center gap-2">
                <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2,21V19H20V21H2M20,8V5H18V8H20M20,3A2,2 0 0,1 22,5V8A2,2 0 0,1 20,10H18V13A4,4 0 0,1 14,17H8A4,4 0 0,1 4,13V3H20M16,5H6V13A2,2 0 0,0 8,15H14A2,2 0 0,0 16,13V5Z" />
                </svg>
                <a href="#/" class="hover:text-coffee-light transition duration-300">Kahve Dükkanı</a>
            </h1>
        </div>
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-coffee-dark text-cream shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out">
        <div class="p-6 h-full flex flex-col">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-bold heading-font">Menü</h2>
                <button id="close-btn" class="text-cream focus:outline-none focus:ring-2 focus:ring-cream rounded p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <ul class="space-y-4 flex-grow text-lg">
                <li><a href="#/" class="block hover:bg-white hover:text-coffee-dark px-4 py-2 rounded transition duration-300">Ana Sayfa</a></li>
                <li><a href="#/hakkinda" class="block hover:bg-white hover:text-coffee-dark px-4 py-2 rounded transition duration-300">Hakkında</a></li>
                <li><a href="#/destek" class="block hover:bg-white hover:text-coffee-dark px-4 py-2 rounded transition duration-300">Destek</a></li>
                <li><a href="#/iletisim" class="block hover:bg-white hover:text-coffee-dark px-4 py-2 rounded transition duration-300">İletişim</a></li>
                <li><a href="#/subeler" class="block hover:bg-white hover:text-coffee-dark px-4 py-2 rounded transition duration-300">Şube Konumları</a></li>
                <li><a href="#/menu" class="block hover:bg-white hover:text-coffee-dark px-4 py-2 rounded transition duration-300">Menü İçerikleri</a></li>
                <li><a href="#/fiyatlar" class="block hover:bg-white hover:text-coffee-dark px-4 py-2 rounded transition duration-300">Fiyatlar</a></li>
            </ul>
            <div class="mt-auto pt-8 border-t border-cream border-opacity-30 text-sm text-center">
                &copy; 2024 Kahve Dükkanı
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app" class="flex-grow p-4 md:p-8 container mx-auto">
        <!-- Dynamic content will be injected here -->
    </main>

    <script src="app.js"></script>
</body>
</html>
