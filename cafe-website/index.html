<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Kafe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            900: '#3E2723', // Dark Brown
                            800: '#4E342E',
                            700: '#5D4037',
                            100: '#D7CCC8',
                        },
                        cream: '#FFFDD0',
                        offwhite: '#FAFAFA'
                    },
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-offwhite text-gray-800 font-sans antialiased overflow-x-hidden">

    <!-- Header -->
    <header class="fixed top-0 left-0 w-full z-20 bg-coffee-900 text-cream shadow-md">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <!-- Hamburger Menu Button -->
            <button id="menu-btn" class="focus:outline-none hover:text-white transition-colors">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>

            <!-- Logo / Brand Name -->
            <div class="text-2xl font-serif font-bold tracking-wider cursor-pointer" onclick="window.location.hash='home'">
                KAFE
            </div>

            <div class="w-8"></div> <!-- Spacer for centering -->
        </div>
    </header>

    <!-- Overlay (for clicking outside sidebar to close) -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden transition-opacity duration-300 opacity-0"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-coffee-800 text-cream z-40 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-2xl pt-20">
        <nav class="px-6 space-y-2">
            <a href="#about" class="block py-3 px-4 rounded hover:bg-coffee-700 transition-colors border-b border-coffee-700">Hakkında</a>
            <a href="#support" class="block py-3 px-4 rounded hover:bg-coffee-700 transition-colors border-b border-coffee-700">Destek</a>
            <a href="#contact" class="block py-3 px-4 rounded hover:bg-coffee-700 transition-colors border-b border-coffee-700">İletişim</a>
            <a href="#locations" class="block py-3 px-4 rounded hover:bg-coffee-700 transition-colors border-b border-coffee-700">Şube Konumları</a>
            <a href="#menu" class="block py-3 px-4 rounded hover:bg-coffee-700 transition-colors border-b border-coffee-700">Menü İçerikleri</a>
            <a href="#prices" class="block py-3 px-4 rounded hover:bg-coffee-700 transition-colors border-b border-coffee-700">Fiyatlar</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main id="main-content" class="pt-20 min-h-screen">
        <!-- Content will be injected here via JavaScript -->
    </main>

    <script src="app.js"></script>
</body>
</html>
