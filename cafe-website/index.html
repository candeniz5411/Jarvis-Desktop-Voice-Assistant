<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Web Sitesi</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            900: '#3E2723',
                            800: '#4e342e',
                            700: '#5d4037',
                            default: '#3E2723'
                        },
                        cream: {
                            default: '#FFFDD0',
                            100: '#ffffe0'
                        }
                    },
                    fontFamily: {
                        heading: ['"Playfair Display"', 'serif'],
                        body: ['"Lato"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Lato', sans-serif;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="bg-cream-default text-brown-900 m-0 p-0 overflow-x-hidden">

    <!-- Header -->
    <header class="fixed top-0 left-0 w-full bg-cream-default shadow z-40 h-16 flex items-center px-4">
        <!-- Hamburger Menu Button -->
        <button id="menu-btn" class="text-brown-900 focus:outline-none z-50">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>

        <!-- Logo Text -->
        <div class="ml-4 flex-grow">
            <a href="#home" class="text-2xl font-heading font-bold text-brown-900">Kafe</a>
        </div>
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-brown-900 text-cream-default z-50 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-lg">
        <div class="p-4 h-16 flex items-center border-b border-brown-700">
            <h2 class="text-2xl font-heading font-bold">Menü</h2>
            <button id="close-btn" class="ml-auto text-cream-default focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <ul class="py-4 flex flex-col space-y-2">
            <li><a href="#home" class="block px-6 py-2 hover:bg-brown-700 transition">Ana Sayfa</a></li>
            <li><a href="#hakkinda" class="block px-6 py-2 hover:bg-brown-700 transition">Hakkında</a></li>
            <li><a href="#destek" class="block px-6 py-2 hover:bg-brown-700 transition">Destek</a></li>
            <li><a href="#iletisim" class="block px-6 py-2 hover:bg-brown-700 transition">İletişim</a></li>
            <li><a href="#subeler" class="block px-6 py-2 hover:bg-brown-700 transition">Şube Konumları</a></li>
            <li><a href="#menu" class="block px-6 py-2 hover:bg-brown-700 transition">Menü İçerikleri</a></li>
            <li><a href="#fiyatlar" class="block px-6 py-2 hover:bg-brown-700 transition">Fiyatlar</a></li>
        </ul>
    </nav>

    <!-- Main Content Container for SPA -->
    <main id="app" class="pt-20 pb-10 px-4 min-h-screen">
        <!-- Content will be injected here via app.js -->
    </main>

    <script src="app.js"></script>
</body>
</html>
