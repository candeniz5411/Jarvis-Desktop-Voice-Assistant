<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Portalı</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            100: '#D7CCC8',
                            300: '#A1887F',
                            500: '#795548',
                            700: '#5D4037',
                            900: '#3E2723',
                        },
                        cream: '#FFFDD0',
                    },
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            .heading-font {
                @apply font-serif text-brown-900;
            }
            .body-font {
                @apply font-sans text-brown-700;
            }
        }

        body {
            @apply bg-cream body-font m-0 p-0 overflow-x-hidden;
        }

        /* Smooth transition for sidebar */
        #sidebar {
            transition: transform 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-cream min-h-screen flex flex-col relative">

    <!-- Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-brown-900 text-cream z-50 transform -translate-x-full shadow-2xl flex flex-col pt-20 px-6">
        <button id="close-sidebar-btn" class="absolute top-4 right-4 text-cream hover:text-white p-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>

        <div class="mb-8 text-2xl heading-font font-bold text-cream border-b border-brown-700 pb-4">Menü</div>

        <ul class="flex flex-col space-y-4">
            <li><a href="#hakkinda" class="block py-2 px-4 hover:bg-brown-700 rounded transition-colors duration-200">Hakkında</a></li>
            <li><a href="#destek" class="block py-2 px-4 hover:bg-brown-700 rounded transition-colors duration-200">Destek</a></li>
            <li><a href="#iletisim" class="block py-2 px-4 hover:bg-brown-700 rounded transition-colors duration-200">İletişim</a></li>
            <li><a href="#subeler" class="block py-2 px-4 hover:bg-brown-700 rounded transition-colors duration-200">Şube Konumları</a></li>
            <li><a href="#menu-icerikleri" class="block py-2 px-4 hover:bg-brown-700 rounded transition-colors duration-200">Menü İçerikleri</a></li>
            <li><a href="#fiyatlar" class="block py-2 px-4 hover:bg-brown-700 rounded transition-colors duration-200">Fiyatlar</a></li>
        </ul>
    </nav>

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-sm shadow-sm sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center">
                    <!-- Hamburger Menu Button -->
                    <button id="hamburger-btn" class="text-brown-900 hover:text-brown-700 focus:outline-none p-2 mr-4">
                        <svg class="h-8 w-8" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                    <!-- Logo -->
                    <a href="#" class="heading-font text-2xl font-bold flex items-center gap-2">
                        <svg class="w-8 h-8 text-brown-700" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2,21V19H20V21H2M20,8V5H18V8H20M20,3A2,2 0 0,1 22,5V8A2,2 0 0,1 20,10H18V13A4,4 0 0,1 14,17H8A4,4 0 0,1 4,13V3H20M16,5H6V13A2,2 0 0,0 8,15H14A2,2 0 0,0 16,13V5Z" />
                        </svg>
                        Kafe
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app" class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-brown-900 text-cream/70 py-6 text-center mt-auto">
        <p>&copy; 2026 Kafe Portalı. Tüm hakları saklıdır.</p>
    </footer>

    <!-- Scripts -->
    <script src="app.js"></script>

    <!-- Hidden div to pre-declare dynamic Tailwind classes if any are needed in JS -->
    <div class="hidden text-[#3E2723] bg-brown-100 bg-brown-300 bg-brown-500 bg-brown-700 bg-brown-900 text-brown-100 text-brown-300 text-brown-500 text-brown-700 text-brown-900 hover:bg-brown-700 hover:bg-brown-500 border-brown-300 border-brown-500 border-brown-700"></div>
</body>
</html>
