<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cafe: {
                            dark: '#3E2723',
                            light: '#5D4037',
                            cream: '#FFFDD0',
                            white: '#FFFFFF',
                            accent: '#D7CCC8'
                        }
                    },
                    fontFamily: {
                        heading: ['"Playfair Display"', 'serif'],
                        body: ['Lato', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .heading-font {
                font-family: 'Playfair Display', serif;
            }
            .body-font {
                font-family: 'Lato', sans-serif;
            }
        }
    </style>
</head>
<body class="bg-cafe-cream text-cafe-dark font-body antialiased flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-cafe-dark text-cafe-cream p-4 shadow-md sticky top-0 z-40 flex items-center">
        <!-- Hamburger Menu Button -->
        <button id="menu-btn" class="p-2 mr-4 hover:bg-cafe-light rounded-md focus:outline-none transition-colors" aria-label="Menüyü aç">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>

        <!-- Logo/Brand Name -->
        <a href="#/" class="flex items-center text-xl font-heading font-bold tracking-wide">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
            </svg>
            Kahve Dükkanı
        </a>
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>

    <!-- Sidebar Menu -->
    <nav id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-cafe-white shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out overflow-y-auto">
        <div class="p-6 bg-cafe-dark text-cafe-cream flex justify-between items-center">
            <span class="font-heading font-bold text-lg">Menü</span>
            <button id="close-btn" class="p-1 hover:bg-cafe-light rounded-md focus:outline-none transition-colors" aria-label="Menüyü kapat">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <ul class="flex flex-col py-4">
            <li><a href="#/" class="block px-6 py-3 text-cafe-dark hover:bg-cafe-accent hover:text-cafe-dark font-medium transition-colors border-b border-gray-100">Ana Sayfa</a></li>
            <li><a href="#/hakkinda" class="block px-6 py-3 text-cafe-dark hover:bg-cafe-accent hover:text-cafe-dark font-medium transition-colors border-b border-gray-100">Hakkında</a></li>
            <li><a href="#/destek" class="block px-6 py-3 text-cafe-dark hover:bg-cafe-accent hover:text-cafe-dark font-medium transition-colors border-b border-gray-100">Destek</a></li>
            <li><a href="#/iletisim" class="block px-6 py-3 text-cafe-dark hover:bg-cafe-accent hover:text-cafe-dark font-medium transition-colors border-b border-gray-100">İletişim</a></li>
            <li><a href="#/sube-konumlari" class="block px-6 py-3 text-cafe-dark hover:bg-cafe-accent hover:text-cafe-dark font-medium transition-colors border-b border-gray-100">Şube Konumları</a></li>
            <li><a href="#/menu-icerikleri" class="block px-6 py-3 text-cafe-dark hover:bg-cafe-accent hover:text-cafe-dark font-medium transition-colors border-b border-gray-100">Menü İçerikleri</a></li>
            <li><a href="#/fiyatlar" class="block px-6 py-3 text-cafe-dark hover:bg-cafe-accent hover:text-cafe-dark font-medium transition-colors">Fiyatlar</a></li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow p-4 md:p-8 flex flex-col items-center">
        <div id="app" class="w-full max-w-4xl bg-cafe-white rounded-lg shadow-lg p-6 md:p-10">
            <!-- Content will be injected here by app.js -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-cafe-dark text-cafe-cream text-center p-4 mt-auto">
        <p class="text-sm">&copy; 2024 Kahve Dükkanı. Tüm hakları saklıdır.</p>
    </footer>

    <!-- Hidden div for Tailwind JIT to pick up dynamically injected classes -->
    <div class="hidden text-cafe-dark text-cafe-light text-cafe-cream text-cafe-white text-cafe-accent bg-cafe-dark bg-cafe-light bg-cafe-cream bg-cafe-white bg-cafe-accent border-cafe-accent font-heading font-body text-center mb-6 text-3xl font-bold grid-cols-1 md:grid-cols-2 gap-6 justify-between border-b pb-2 text-xl font-semibold mb-2"></div>

    <!-- Application Logic -->
    <script src="app.js"></script>
</body>
</html>
