<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Web Sitesi</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            50: '#fdf8f6',
                            100: '#f2e8e5',
                            200: '#eaddd7',
                            300: '#e0cec7',
                            400: '#d2bab0',
                            500: '#a1887f',
                            600: '#8d6e63',
                            700: '#795548',
                            800: '#5d4037',
                            900: '#3e2723',
                            950: '#2b1b17',
                        },
                        cream: '#FFFDD0',
                    },
                    fontFamily: {
                        playfair: ['"Playfair Display"', 'serif'],
                        lato: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .heading {
                @apply font-playfair text-brown-900;
            }
            .body-text {
                @apply font-lato text-brown-800;
            }
        }
    </style>
</head>
<body class="bg-cream font-lato text-brown-800 antialiased overflow-x-hidden min-h-screen flex flex-col relative">

    <!-- Header / Navbar -->
    <header class="bg-white/80 backdrop-blur-md shadow-sm fixed w-full z-40 top-0 left-0 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <!-- Hamburger Button -->
                <div class="flex items-center">
                    <button id="menu-btn" aria-label="Menüyü aç" class="text-brown-900 hover:text-brown-600 focus:outline-none focus:ring-2 focus:ring-brown-500 rounded-md p-2 transition-colors">
                        <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                    <!-- Brand/Logo (Text) -->
                    <a href="#/" class="ml-4 text-2xl font-playfair font-bold text-brown-900 tracking-wide hover:opacity-80 transition-opacity">
                        Kahve Dünyası
                    </a>
                </div>

                <!-- Spacer for layout if needed -->
                <div></div>
            </div>
        </div>
    </header>

    <!-- Overlay (hidden by default) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-brown-950/40 backdrop-blur-sm z-40 hidden transition-opacity duration-300" aria-hidden="true"></div>

    <!-- Sliding Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-72 bg-cream shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col border-r border-brown-200">
        <div class="flex items-center justify-between p-6 border-b border-brown-200 bg-white/50">
            <h2 class="text-xl font-playfair font-bold text-brown-900">Menü</h2>
            <button id="close-btn" aria-label="Menüyü kapat" class="text-brown-500 hover:text-brown-800 focus:outline-none p-1 rounded-full hover:bg-brown-100 transition-colors">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <nav class="flex-1 overflow-y-auto py-4">
            <ul class="space-y-1">
                <li><a href="#/hakkinda" class="block px-6 py-3 text-lg font-medium text-brown-800 hover:bg-brown-100 hover:text-brown-900 hover:pl-8 transition-all duration-200 border-l-4 border-transparent hover:border-brown-600">Hakkında</a></li>
                <li><a href="#/destek" class="block px-6 py-3 text-lg font-medium text-brown-800 hover:bg-brown-100 hover:text-brown-900 hover:pl-8 transition-all duration-200 border-l-4 border-transparent hover:border-brown-600">Destek</a></li>
                <li><a href="#/iletisim" class="block px-6 py-3 text-lg font-medium text-brown-800 hover:bg-brown-100 hover:text-brown-900 hover:pl-8 transition-all duration-200 border-l-4 border-transparent hover:border-brown-600">İletişim</a></li>
                <li><a href="#/subeler" class="block px-6 py-3 text-lg font-medium text-brown-800 hover:bg-brown-100 hover:text-brown-900 hover:pl-8 transition-all duration-200 border-l-4 border-transparent hover:border-brown-600">Şube Konumları</a></li>
                <li><a href="#/menu-icerikleri" class="block px-6 py-3 text-lg font-medium text-brown-800 hover:bg-brown-100 hover:text-brown-900 hover:pl-8 transition-all duration-200 border-l-4 border-transparent hover:border-brown-600">Menü İçerikleri</a></li>
                <li><a href="#/fiyatlar" class="block px-6 py-3 text-lg font-medium text-brown-800 hover:bg-brown-100 hover:text-brown-900 hover:pl-8 transition-all duration-200 border-l-4 border-transparent hover:border-brown-600">Fiyatlar</a></li>
            </ul>
        </nav>
        <div class="p-6 border-t border-brown-200 bg-white/50 text-sm text-brown-500 text-center">
            &copy; <span id="year"></span> Kahve Dünyası
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 mt-20 pt-6 pb-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full">
        <div id="app" class="w-full animation-fade-in">
            <!-- Content will be injected here by app.js -->
        </div>
    </main>

    <!-- Helper for dynamic utility classes (Tailwind JIT fix) -->
    <div class="hidden text-[#3E2723] bg-[#3E2723] text-brown-900 bg-brown-900"></div>

    <script src="app.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
