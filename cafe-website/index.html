<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Durağı</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cafe: {
                            brown: '#3E2723',
                            cream: '#FFFDD0',
                            white: '#FFFFFF',
                            light: '#e0cfc8',
                        }
                    },
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cafe-cream text-cafe-brown font-sans flex flex-col min-h-screen">

    <!-- Header -->
    <header class="w-full bg-cafe-white shadow p-4 flex items-center fixed top-0 z-10 h-16">
        <!-- Hamburger Menu Button -->
        <button id="menu-btn" class="p-2 mr-4 focus:outline-none hover:bg-cafe-light rounded transition" aria-label="Menü">
            <svg class="w-6 h-6 text-cafe-brown" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <h1 class="text-2xl font-serif font-bold cursor-pointer" onclick="window.location.hash='#'">Kahve Durağı</h1>
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-20 hidden transition-opacity"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-cafe-white shadow-xl z-30 transform -translate-x-full transition-transform duration-300 ease-in-out overflow-y-auto">
        <div class="p-4 border-b border-cafe-light flex justify-between items-center h-16">
            <h2 class="text-xl font-serif font-bold text-cafe-brown">Menü</h2>
            <button id="close-btn" class="p-2 focus:outline-none hover:bg-cafe-light rounded transition" aria-label="Kapat">
                <svg class="w-6 h-6 text-cafe-brown" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <nav class="p-4">
            <ul class="space-y-2">
                <li><a href="#hakkinda" class="nav-link block p-2 rounded hover:bg-cafe-cream transition font-bold">Hakkında</a></li>
                <li><a href="#destek" class="nav-link block p-2 rounded hover:bg-cafe-cream transition font-bold">Destek</a></li>
                <li><a href="#iletisim" class="nav-link block p-2 rounded hover:bg-cafe-cream transition font-bold">İletişim</a></li>
                <li><a href="#subeler" class="nav-link block p-2 rounded hover:bg-cafe-cream transition font-bold">Şube Konumları</a></li>
                <li><a href="#icerikler" class="nav-link block p-2 rounded hover:bg-cafe-cream transition font-bold">Menü İçerikleri</a></li>
                <li><a href="#fiyatlar" class="nav-link block p-2 rounded hover:bg-cafe-cream transition font-bold">Fiyatlar</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main id="app" class="flex-grow pt-16 p-6">
        <!-- Injected via JS -->
    </main>

    <!-- Footer -->
    <footer class="bg-cafe-brown text-cafe-cream p-4 text-center mt-auto">
        <p>&copy; 2023 Kahve Durağı. Tüm hakları saklıdır.</p>
    </footer>

    <!-- Scripts -->
    <script src="app.js"></script>

    <!-- For Tailwind JIT: Hidden classes that might be used by JS dynamically -->
    <div class="hidden">
        <div class="text-center mb-8 max-w-4xl mx-auto rounded-xl shadow-lg overflow-hidden bg-white text-4xl font-serif text-cafe-brown mt-4 p-8"></div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        <div class="p-4 bg-white rounded-lg shadow flex justify-between items-center border border-cafe-light"></div>
        <img src="./Images/coffee.jpg" class="w-full h-80 object-cover" alt="Kahve">
        <span class="font-bold text-lg"></span>
        <div class="text-left space-y-4 text-lg"></div>
    </div>
</body>
</html>
