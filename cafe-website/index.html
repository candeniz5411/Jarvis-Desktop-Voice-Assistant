<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            dark: '#3E2723',
                            light: '#795548',
                            cream: '#FFFDD0',
                            white: '#FFFFFF',
                        }
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-coffee-cream font-sans text-coffee-dark min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-coffee-dark text-coffee-cream p-4 flex items-center justify-between sticky top-0 z-50 shadow-md">
        <div class="flex items-center gap-4">
            <button id="menu-toggle" class="focus:outline-none p-2 rounded hover:bg-coffee-light transition-colors" aria-label="Menüyü Aç">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <h1 class="text-2xl font-serif font-bold tracking-wider">KAHVE DÜKKANI</h1>
        </div>
    </header>

    <!-- Sidebar & Overlay Container -->
    <div id="sidebar-container" class="fixed inset-0 z-40 hidden pointer-events-none">
        <!-- Overlay -->
        <div id="overlay" class="absolute inset-0 bg-black bg-opacity-50 opacity-0 transition-opacity duration-300 pointer-events-auto" onclick="closeSidebar()"></div>

        <!-- Sidebar -->
        <nav id="sidebar" class="absolute left-0 top-0 bottom-0 w-64 bg-coffee-dark text-coffee-cream transform -translate-x-full transition-transform duration-300 pointer-events-auto flex flex-col shadow-2xl pt-20">
            <div class="px-6 pb-6">
                <h2 class="text-xl font-serif font-bold border-b border-coffee-light pb-2 mb-4">Menü</h2>
                <ul class="space-y-4 text-lg">
                    <li><a href="#about" class="block hover:text-white hover:pl-2 transition-all" onclick="closeSidebar()">Hakkında</a></li>
                    <li><a href="#support" class="block hover:text-white hover:pl-2 transition-all" onclick="closeSidebar()">Destek</a></li>
                    <li><a href="#contact" class="block hover:text-white hover:pl-2 transition-all" onclick="closeSidebar()">İletişim</a></li>
                    <li><a href="#locations" class="block hover:text-white hover:pl-2 transition-all" onclick="closeSidebar()">Şube Konumları</a></li>
                    <li><a href="#menu" class="block hover:text-white hover:pl-2 transition-all" onclick="closeSidebar()">Menü İçerikleri</a></li>
                    <li><a href="#prices" class="block hover:text-white hover:pl-2 transition-all" onclick="closeSidebar()">Fiyatlar</a></li>
                </ul>
            </div>
            <div class="mt-auto p-6 text-sm text-coffee-light text-center">
                &copy; 2023 Kahve Dükkanı
            </div>
        </nav>
    </div>

    <!-- Main Content -->
    <main id="app" class="flex-grow container mx-auto p-4 md:p-8">
        <!-- Dynamic content will be injected here -->
    </main>

    <script src="app.js"></script>
</body>
</html>
