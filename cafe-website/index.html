<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Web Sitesi</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            100: '#D7CCC8',
                            500: '#795548',
                            900: '#3E2723', // Dark brown
                        },
                        cream: '#FFFDD0', // Cream
                    },
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cream text-brown-900 font-sans min-h-screen">
    <!-- Navbar -->
    <header class="bg-brown-900 text-cream p-4 flex items-center justify-between shadow-md relative z-20">
        <button id="menu-btn" class="text-cream focus:outline-none flex flex-col justify-between w-6 h-5" aria-label="Menüyü Aç">
            <span class="bg-cream h-0.5 w-full block rounded-sm"></span>
            <span class="bg-cream h-0.5 w-full block rounded-sm"></span>
            <span class="bg-cream h-0.5 w-full block rounded-sm"></span>
        </button>
        <h1 class="font-serif text-2xl font-bold mx-auto">Kafe Moka</h1>
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black/50 z-30 hidden transition-opacity"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-cream text-brown-900 shadow-2xl z-40 transform -translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-6 bg-brown-900 text-cream flex justify-between items-center">
            <h2 class="font-serif text-xl font-bold">Menü</h2>
            <button id="close-btn" class="text-cream focus:outline-none text-3xl leading-none">&times;</button>
        </div>
        <ul class="flex flex-col p-4 space-y-4">
            <li><a href="#/" class="block text-lg font-medium hover:text-brown-500 transition-colors">Ana Sayfa</a></li>
            <li><a href="#/hakkinda" class="block text-lg font-medium hover:text-brown-500 transition-colors">Hakkında</a></li>
            <li><a href="#/destek" class="block text-lg font-medium hover:text-brown-500 transition-colors">Destek</a></li>
            <li><a href="#/iletisim" class="block text-lg font-medium hover:text-brown-500 transition-colors">İletişim</a></li>
            <li><a href="#/subeler" class="block text-lg font-medium hover:text-brown-500 transition-colors">Şube Konumları</a></li>
            <li><a href="#/icerikler" class="block text-lg font-medium hover:text-brown-500 transition-colors">Menü İçerikleri</a></li>
            <li><a href="#/fiyatlar" class="block text-lg font-medium hover:text-brown-500 transition-colors">Fiyatlar</a></li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main id="app" class="p-6">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Hidden Div for Dynamic Classes (JIT) -->
    <div class="hidden text-[#3E2723] bg-[#FFFDD0] bg-brown-900 bg-cream"></div>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
