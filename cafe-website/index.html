<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>

    <!-- Google Fonts: Playfair Display for headings, Lato for text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: '#3E2723',
                        cream: '#FFFDD0',
                    },
                    fontFamily: {
                        heading: ['"Playfair Display"', 'serif'],
                        body: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Tailwind CSS styles directly using @apply -->
    <style type="text/tailwindcss">
        body {
            @apply font-body bg-cream text-coffee m-0 p-0;
        }
        h1, h2, h3, h4, h5, h6 {
            @apply font-heading text-coffee font-bold;
        }
        .btn-primary {
            @apply bg-coffee text-cream px-4 py-2 rounded shadow hover:bg-opacity-90 transition;
        }
        .menu-link {
            @apply block py-3 px-4 hover:bg-[#5C4033] hover:text-white transition rounded mx-2 my-1 text-lg border-b border-white/10 last:border-0;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-coffee text-cream p-4 sticky top-0 z-40 shadow-md flex items-center justify-between">
        <div class="flex items-center gap-4">
            <button id="menu-btn" class="p-2 focus:outline-none focus:ring-2 focus:ring-cream rounded" aria-label="Menüyü aç">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <h1 class="text-2xl font-heading tracking-wide">Kahve Dükkanı</h1>
        </div>
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity" aria-hidden="true"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 w-72 h-full bg-coffee text-cream z-50 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-xl overflow-y-auto flex flex-col">
        <div class="p-4 border-b border-cream/20 flex justify-between items-center bg-[#2e1d1a]">
            <h2 class="text-xl font-heading">Menü</h2>
            <button id="close-btn" class="p-2 focus:outline-none focus:ring-2 focus:ring-cream rounded hover:bg-white/10 transition" aria-label="Menüyü kapat">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <div class="py-4 flex-1">
            <a href="#hakkinda" class="menu-link">Hakkında</a>
            <a href="#destek" class="menu-link">Destek</a>
            <a href="#iletisim" class="menu-link">İletişim</a>
            <a href="#sube-konumlari" class="menu-link">Şube Konumları</a>
            <a href="#menu-icerikleri" class="menu-link">Menü İçerikleri</a>
            <a href="#fiyatlar" class="menu-link">Fiyatlar</a>
        </div>
        <div class="p-4 text-sm text-center border-t border-cream/20 text-cream/70">
            &copy; 2023 Kahve Dükkanı
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app-content" class="flex-1 p-6 md:p-12 w-full max-w-5xl mx-auto">
        <!-- Dynamic content will be loaded here -->
    </main>

    <!-- Footer -->
    <footer class="bg-coffee text-cream text-center p-4 mt-auto">
        <p class="text-sm">&copy; 2023 Kahve Dükkanı. Tüm hakları saklıdır.</p>
    </footer>

    <!-- Dummy div to ensure Tailwind generates classes we might need dynamically -->
    <div class="hidden text-center text-4xl mb-4 bg-white rounded-lg shadow p-6 border border-coffee/20 text-gray-700 bg-gray-50 flex-col gap-2 max-w-md mx-auto mt-8 grid-cols-1 md:grid-cols-2 lg:grid-cols-3 hover:shadow-md transition-shadow"></div>

    <script src="app.js"></script>
</body>
</html>
