<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Web Sitesi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            100: '#D7CCC8',
                            500: '#795548',
                            900: '#3E2723',
                        },
                        cream: '#FFFDD0',
                    },
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .font-heading {
                font-family: 'Playfair Display', serif;
            }
            .font-body {
                font-family: 'Lato', sans-serif;
            }
        }
    </style>
</head>
<body class="bg-cream text-brown-900 font-body m-0 p-0 overflow-x-hidden min-h-screen">

    <!-- Hidden div to ensure dynamically added classes are compiled by Tailwind -->
    <div class="hidden text-brown-900 bg-brown-900 bg-cream text-cream text-brown-500 bg-brown-100 hover:bg-brown-100 p-6 shadow-md rounded-lg mb-8 max-w-4xl mx-auto flex flex-col md:flex-row items-center text-center md:text-left text-4xl font-heading mb-4 text-2xl font-bold grid grid-cols-1 md:grid-cols-2 gap-4 justify-between border-b border-brown-100 pb-2 text-xl font-semibold mb-6 flex-grow flex-shrink"></div>

    <!-- Header / Navbar -->
    <header class="bg-brown-900 text-cream p-4 sticky top-0 z-40 shadow-md">
        <div class="container mx-auto flex items-center">
            <button id="menu-btn" class="text-cream focus:outline-none focus:ring-2 focus:ring-cream rounded p-1" aria-label="Menüyü aç">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <h1 class="text-2xl ml-4 font-heading font-bold cursor-pointer" onclick="window.location.hash='#/'">Bizim Kafe</h1>
        </div>
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <div id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-cream text-brown-900 shadow-xl z-50 transform -translate-x-full transition-transform duration-300 overflow-y-auto">
        <div class="p-4 bg-brown-900 text-cream flex justify-between items-center sticky top-0">
            <span class="text-xl font-heading font-bold">Menü</span>
            <button id="close-btn" class="text-cream focus:outline-none focus:ring-2 focus:ring-cream rounded p-1" aria-label="Menüyü kapat">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <nav class="flex flex-col p-4 space-y-2">
            <a href="#/" class="p-3 rounded hover:bg-brown-100 font-bold transition-colors">Ana Sayfa</a>
            <a href="#/hakkinda" class="p-3 rounded hover:bg-brown-100 font-bold transition-colors">Hakkında</a>
            <a href="#/destek" class="p-3 rounded hover:bg-brown-100 font-bold transition-colors">Destek</a>
            <a href="#/iletisim" class="p-3 rounded hover:bg-brown-100 font-bold transition-colors">İletişim</a>
            <a href="#/subeler" class="p-3 rounded hover:bg-brown-100 font-bold transition-colors">Şube Konumları</a>
            <a href="#/icerikler" class="p-3 rounded hover:bg-brown-100 font-bold transition-colors">Menü İçerikleri</a>
            <a href="#/fiyatlar" class="p-3 rounded hover:bg-brown-100 font-bold transition-colors">Fiyatlar</a>
        </nav>
    </div>

    <!-- Main Content Container -->
    <main id="app" class="container mx-auto p-4 md:p-8 flex-grow">
        <!-- Content will be dynamically injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-brown-900 text-cream p-6 text-center mt-auto">
        <p>&copy; 2024 Bizim Kafe. Tüm hakları saklıdır.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
