<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Keyfi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            light: '#D7CCC8',
                            DEFAULT: '#8B4513',
                            dark: '#3E2723',
                        },
                        cream: '#FFFDD0',
                    }
                }
            }
        }
    </script>
    <style>
        .sidebar-transition {
            transition: transform 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-cream text-coffee-dark font-sans min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-coffee-dark text-cream p-4 fixed w-full z-20 top-0 shadow-md">
        <div class="container mx-auto flex items-center justify-between">
            <div class="flex items-center">
                <button id="menu-btn" class="text-2xl mr-4 focus:outline-none hover:text-white" aria-label="Menüyü Aç">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <a href="#home" class="text-xl font-bold tracking-wider hover:text-white transition">KAFE KEYFİ</a>
            </div>
        </div>
    </nav>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden transition-opacity" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-white shadow-2xl z-40 transform -translate-x-full sidebar-transition flex flex-col">
        <div class="p-6 bg-coffee text-cream flex justify-between items-center">
            <h2 class="text-xl font-bold">Menü</h2>
            <button onclick="toggleSidebar()" class="text-cream hover:text-white" aria-label="Menüyü Kapat">
                <i class="fa-solid fa-times text-xl"></i>
            </button>
        </div>
        <nav class="flex-1 overflow-y-auto py-4">
            <a href="#home" onclick="toggleSidebar()" class="block px-6 py-3 hover:bg-cream hover:text-coffee-dark transition border-b border-gray-100">Ana Sayfa</a>
            <a href="#about" onclick="toggleSidebar()" class="block px-6 py-3 hover:bg-cream hover:text-coffee-dark transition border-b border-gray-100">Hakkında</a>
            <a href="#support" onclick="toggleSidebar()" class="block px-6 py-3 hover:bg-cream hover:text-coffee-dark transition border-b border-gray-100">Destek</a>
            <a href="#contact" onclick="toggleSidebar()" class="block px-6 py-3 hover:bg-cream hover:text-coffee-dark transition border-b border-gray-100">İletişim</a>
            <a href="#locations" onclick="toggleSidebar()" class="block px-6 py-3 hover:bg-cream hover:text-coffee-dark transition border-b border-gray-100">Şube Konumları</a>
            <a href="#menu" onclick="toggleSidebar()" class="block px-6 py-3 hover:bg-cream hover:text-coffee-dark transition border-b border-gray-100">Menü İçerikleri</a>
            <a href="#prices" onclick="toggleSidebar()" class="block px-6 py-3 hover:bg-cream hover:text-coffee-dark transition border-b border-gray-100">Fiyatlar</a>
        </nav>
        <div class="p-4 border-t border-gray-200 text-center text-sm text-gray-500">
            &copy; 2024 Kafe Keyfi
        </div>
    </aside>

    <!-- Main Content -->
    <main id="app" class="flex-grow container mx-auto pt-24 pb-8 px-4">
        <!-- Content injected by JS -->
    </main>

    <script src="app.js"></script>
</body>
</html>
