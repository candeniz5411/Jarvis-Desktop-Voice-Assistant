<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            dark: '#3E2723',
                            cream: '#FFFDD0',
                            light: '#D7CCC8',
                        }
                    },
                    fontFamily: {
                        heading: ['Playfair Display', 'serif'],
                        body: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-coffee-cream font-body text-coffee-dark flex flex-col min-h-screen relative overflow-x-hidden">

    <!-- Header -->
    <header class="bg-coffee-dark text-coffee-cream py-4 px-6 flex items-center justify-between shadow-md fixed w-full top-0 z-50 h-16">
        <button id="hamburger-menu" class="focus:outline-none" aria-label="Menüyü Aç">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <h1 class="text-2xl font-heading font-bold absolute left-1/2 transform -translate-x-1/2">Kahve Dükkanı</h1>
        <div class="w-8"></div> <!-- Spacer for centering -->
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-coffee-dark text-coffee-cream transform -translate-x-full transition-transform duration-300 ease-in-out z-50 shadow-2xl pt-20">
        <button id="close-menu" class="absolute top-4 right-4 focus:outline-none" aria-label="Menüyü Kapat">
             <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
        <ul class="flex flex-col space-y-4 px-6 text-lg">
            <li><a href="#home" class="block hover:text-coffee-light transition-colors py-2 border-b border-coffee-light/20">Ana Sayfa</a></li>
            <li><a href="#hakkinda" class="block hover:text-coffee-light transition-colors py-2 border-b border-coffee-light/20">Hakkında</a></li>
            <li><a href="#destek" class="block hover:text-coffee-light transition-colors py-2 border-b border-coffee-light/20">Destek</a></li>
            <li><a href="#iletisim" class="block hover:text-coffee-light transition-colors py-2 border-b border-coffee-light/20">İletişim</a></li>
            <li><a href="#sube-konumlari" class="block hover:text-coffee-light transition-colors py-2 border-b border-coffee-light/20">Şube Konumları</a></li>
            <li><a href="#menu-icerikleri" class="block hover:text-coffee-light transition-colors py-2 border-b border-coffee-light/20">Menü İçerikleri</a></li>
            <li><a href="#fiyatlar" class="block hover:text-coffee-light transition-colors py-2 border-b border-coffee-light/20">Fiyatlar</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main id="app" class="flex-grow pt-20 px-4 pb-8 container mx-auto max-w-4xl transition-all duration-300">
        <!-- Dynamic content will be injected here -->
    </main>

    <!-- Footer -->
    <footer class="bg-coffee-dark text-coffee-cream py-6 text-center mt-auto">
        <p>&copy; 2023 Kahve Dükkanı. Tüm hakları saklıdır.</p>
    </footer>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
