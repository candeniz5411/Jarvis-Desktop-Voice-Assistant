<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            500: '#3E2723',
                            100: '#D7CCC8'
                        },
                        cream: '#FFFDD0',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Lato', sans-serif;
            background-color: #FFFDD0;
            color: #3E2723;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="bg-cream text-brown-500 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-brown-500 text-white p-4 shadow-md sticky top-0 z-50 flex items-center justify-between">
        <button id="menu-btn" class="p-2 focus:outline-none">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <div class="text-2xl font-bold flex-1 text-center font-['Playfair_Display']">
            Kahve Dükkanı
        </div>
        <div class="w-12"></div> <!-- Spacer for centering -->
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-white shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-4 bg-brown-500 text-white flex justify-between items-center">
            <span class="text-xl font-bold font-['Playfair_Display']">Menü</span>
            <button id="close-btn" class="p-2 focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <nav class="flex-1 overflow-y-auto py-4">
            <ul class="space-y-2">
                <li><a href="#/" class="nav-link block px-6 py-3 hover:bg-brown-100 transition-colors text-lg">Ana Sayfa</a></li>
                <li><a href="#/hakkinda" class="nav-link block px-6 py-3 hover:bg-brown-100 transition-colors text-lg">Hakkında</a></li>
                <li><a href="#/destek" class="nav-link block px-6 py-3 hover:bg-brown-100 transition-colors text-lg">Destek</a></li>
                <li><a href="#/iletisim" class="nav-link block px-6 py-3 hover:bg-brown-100 transition-colors text-lg">İletişim</a></li>
                <li><a href="#/subeler" class="nav-link block px-6 py-3 hover:bg-brown-100 transition-colors text-lg">Şube Konumları</a></li>
                <li><a href="#/icerikler" class="nav-link block px-6 py-3 hover:bg-brown-100 transition-colors text-lg">Menü İçerikleri</a></li>
                <li><a href="#/fiyatlar" class="nav-link block px-6 py-3 hover:bg-brown-100 transition-colors text-lg">Fiyatlar</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main id="app" class="flex-1 p-6 max-w-4xl mx-auto w-full">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-brown-500 text-white text-center p-4 mt-auto">
        <p>&copy; 2023 Kahve Dükkanı. Tüm hakları saklıdır.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
