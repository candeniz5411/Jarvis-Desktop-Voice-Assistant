<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Portalı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cafe-brown': '#3E2723',
                        'cafe-cream': '#FFFDD0',
                    },
                    fontFamily: {
                        'heading': ['"Playfair Display"', 'serif'],
                        'body': ['"Lato"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .nav-link {
                @apply block px-4 py-3 text-cafe-cream hover:bg-white hover:text-cafe-brown transition-colors duration-200;
            }
            .content-section {
                @apply max-w-4xl mx-auto p-6 bg-white shadow-lg rounded-lg mt-8;
            }
            .page-title {
                @apply text-3xl font-heading font-bold text-cafe-brown mb-6 border-b-2 border-cafe-brown pb-2;
            }
        }
    </style>
</head>
<body class="bg-cafe-cream font-body text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-cafe-brown text-cafe-cream p-4 shadow-md sticky top-0 z-40 flex items-center">
        <button id="menu-toggle" class="text-cafe-cream hover:text-white focus:outline-none p-2" aria-label="Menüyü aç">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <div class="ml-4 flex items-center">
            <!-- Simplified Logo (Icon + Text) -->
            <svg class="w-8 h-8 mr-2" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M20,3H4A2,2 0 0,0 2,5V15A2,2 0 0,0 4,17H6V19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V17H20A2,2 0 0,0 22,15V5A2,2 0 0,0 20,3M20,15H18V13H20V15M20,11H18V5H20V11M4,15V5H16V15H4M8,19V17H16V19H8Z"></path>
            </svg>
            <h1 class="text-2xl font-heading font-bold cursor-pointer" onclick="window.location.hash=''">Bean & Brew</h1>
        </div>
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sliding Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-cafe-brown shadow-xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-4 flex justify-between items-center border-b border-gray-600">
            <span class="text-xl font-heading font-bold text-cafe-cream">Menü</span>
            <button id="menu-close" class="text-cafe-cream hover:text-white focus:outline-none p-2" aria-label="Menüyü kapat">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <nav class="flex-1 overflow-y-auto py-4">
            <ul class="space-y-1">
                <li><a href="#hakkinda" class="nav-link">Hakkında</a></li>
                <li><a href="#destek" class="nav-link">Destek</a></li>
                <li><a href="#iletisim" class="nav-link">İletişim</a></li>
                <li><a href="#subeler" class="nav-link">Şube Konumları</a></li>
                <li><a href="#menu" class="nav-link">Menü İçerikleri</a></li>
                <li><a href="#fiyatlar" class="nav-link">Fiyatlar</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main id="main-content" class="flex-grow p-4 md:p-8">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-cafe-brown text-cafe-cream text-center py-4 mt-auto">
        <p>&copy; 2023 Bean & Brew Cafe. Tüm hakları saklıdır.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
