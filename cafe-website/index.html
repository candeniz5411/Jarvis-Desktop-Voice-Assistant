<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            light: '#D7CCC8',
                            DEFAULT: '#795548',
                            dark: '#3E2723',
                        },
                        cream: '#FFFDD0',
                    },
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-cream text-coffee-dark font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-coffee-dark text-cream p-4 flex items-center justify-between shadow-md fixed w-full top-0 z-50">
        <div class="flex items-center">
            <button id="menu-btn" class="mr-4 focus:outline-none" aria-label="Menüyü Aç">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <h1 class="text-2xl font-serif font-bold tracking-wider">Kahve Dükkanı</h1>
        </div>
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-white shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out pt-20">
        <nav class="flex flex-col p-4 space-y-4">
            <a href="#hakkinda" class="text-lg font-bold hover:text-coffee transition-colors py-2 border-b border-gray-100">Hakkında</a>
            <a href="#destek" class="text-lg font-bold hover:text-coffee transition-colors py-2 border-b border-gray-100">Destek</a>
            <a href="#iletisim" class="text-lg font-bold hover:text-coffee transition-colors py-2 border-b border-gray-100">İletişim</a>
            <a href="#subeler" class="text-lg font-bold hover:text-coffee transition-colors py-2 border-b border-gray-100">Şube Konumları</a>
            <a href="#menu" class="text-lg font-bold hover:text-coffee transition-colors py-2 border-b border-gray-100">Menü İçerikleri</a>
            <a href="#fiyatlar" class="text-lg font-bold hover:text-coffee transition-colors py-2 border-b border-gray-100">Fiyatlar</a>
        </nav>
        <button id="close-sidebar" class="absolute top-4 right-4 text-coffee-dark focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </aside>

    <!-- Main Content -->
    <main id="app" class="flex-grow pt-20 px-4 pb-8 max-w-4xl mx-auto w-full">
        <!-- Dynamic Content will be injected here -->
    </main>

    <!-- Footer -->
    <footer class="bg-coffee-dark text-cream text-center p-4 mt-auto">
        <p>&copy; 2023 Kahve Dükkanı. Tüm hakları saklıdır.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
