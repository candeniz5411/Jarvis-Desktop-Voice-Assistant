<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Web Sitesi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            50: '#fdf8f6',
                            100: '#f2e8e5',
                            200: '#eaddd7',
                            300: '#e0cec7',
                            400: '#d2bab0',
                            500: '#a18072',
                            600: '#977669',
                            700: '#846358',
                            800: '#654b44',
                            900: '#3E2723',
                        },
                        cream: {
                            100: '#FFFDD0',
                            200: '#fcf6b1',
                        }
                    },
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .font-heading {
                @apply font-serif font-bold;
            }
            .font-body {
                @apply font-sans;
            }
        }
    </style>
</head>
<body class="bg-cream-100 text-brown-900 font-body m-0 p-0 overflow-x-hidden">

    <!-- Header -->
    <header class="fixed top-0 left-0 w-full bg-cream-100/90 backdrop-blur-md shadow-sm z-40 flex items-center p-4">
        <button id="menu-btn" class="p-2 focus:outline-none focus:ring-2 focus:ring-brown-500 rounded-md">
            <svg class="w-8 h-8 text-brown-900" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <h1 class="ml-4 font-heading text-xl text-brown-900 tracking-wider">KAFE KÖŞESİ</h1>
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-brown-900 text-cream-100 z-50 transform -translate-x-full transition-transform duration-300 shadow-2xl overflow-y-auto">
        <div class="p-6">
            <div class="flex justify-between items-center mb-8 border-b border-brown-700 pb-4">
                <span class="font-heading text-2xl tracking-widest">MENÜ</span>
                <button id="close-btn" class="text-cream-100 hover:text-white focus:outline-none p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <nav class="flex flex-col space-y-4">
                <a href="#/" class="nav-link block py-2 text-lg hover:text-white hover:translate-x-2 transition-transform font-medium">Ana Sayfa</a>
                <a href="#/hakkinda" class="nav-link block py-2 text-lg hover:text-white hover:translate-x-2 transition-transform font-medium">Hakkında</a>
                <a href="#/destek" class="nav-link block py-2 text-lg hover:text-white hover:translate-x-2 transition-transform font-medium">Destek</a>
                <a href="#/iletisim" class="nav-link block py-2 text-lg hover:text-white hover:translate-x-2 transition-transform font-medium">İletişim</a>
                <a href="#/subeler" class="nav-link block py-2 text-lg hover:text-white hover:translate-x-2 transition-transform font-medium">Şube Konumları</a>
                <a href="#/menu" class="nav-link block py-2 text-lg hover:text-white hover:translate-x-2 transition-transform font-medium">Menü İçerikleri</a>
                <a href="#/fiyatlar" class="nav-link block py-2 text-lg hover:text-white hover:translate-x-2 transition-transform font-medium">Fiyatlar</a>
            </nav>
        </div>
    </aside>

    <!-- Main Content -->
    <main id="app-root" class="pt-20 pb-10 min-h-screen">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Pre-declare dynamic tailwind classes -->
    <div class="hidden text-3xl font-heading text-center text-brown-900 mt-10 mb-6 bg-white shadow-lg rounded-xl p-8 max-w-4xl mx-auto w-full md:w-1/2 flex-col items-center justify-center space-y-4 text-gray-600 grid grid-cols-1 md:grid-cols-2 gap-6 border-b border-brown-200 pb-2 flex justify-between items-center text-lg font-medium object-cover h-64 w-full rounded-lg shadow-md mb-8"></div>

    <script src="app.js"></script>
</body>
</html>
