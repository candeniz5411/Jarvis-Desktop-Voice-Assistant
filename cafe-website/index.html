<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            light: '#D7CCC8',
                            DEFAULT: '#795548',
                            dark: '#3E2723',
                        },
                        cream: '#FFFDD0',
                    },
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            .font-serif {
                font-family: 'Playfair Display', serif;
            }
            .font-sans {
                font-family: 'Lato', sans-serif;
            }
        }
    </style>
</head>
<body class="bg-cream font-sans text-coffee-dark antialiased">

    <!-- Pre-declare dynamic Tailwind classes to ensure they are generated by JIT -->
    <div class="hidden">
        <div class="text-[#3E2723] bg-[#FFFDD0]"></div>
    </div>

    <!-- Header -->
    <header class="bg-white shadow-sm fixed w-full z-40 top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center">
                <!-- Hamburger Menu Button -->
                <button id="menu-btn" class="text-coffee-dark hover:text-coffee focus:outline-none focus:ring-2 focus:ring-coffee-light rounded-md p-2 -ml-2" aria-label="Toggle Menu">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>

            <!-- Logo -->
            <div class="flex-1 flex justify-center sm:justify-start sm:ml-6">
                <a href="#home" class="flex items-center space-x-2">
                    <svg class="h-8 w-8 text-coffee-dark" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m-4 4h8m-6 3h4m-5 4h6m-7 4h8a2 2 0 002-2V9a2 2 0 00-2-2h-8a2 2 0 00-2 2v9a2 2 0 002 2z" />
                    </svg>
                    <span class="font-serif font-bold text-xl tracking-wide">Kahve Dükkanı</span>
                </a>
            </div>

            <div class="w-10"></div> <!-- Placeholder to balance header -->
        </div>
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sidebar Navigation -->
    <nav id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white shadow-xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="h-16 flex items-center justify-between px-4 border-b border-gray-100">
            <span class="font-serif font-bold text-lg">Menü</span>
            <button id="close-btn" class="text-gray-500 hover:text-gray-800 focus:outline-none p-2" aria-label="Close Menu">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <ul class="flex-1 py-4 overflow-y-auto space-y-1">
            <li><a href="#hakkinda" class="block px-6 py-3 text-gray-700 hover:bg-coffee-light hover:text-coffee-dark transition-colors">Hakkında</a></li>
            <li><a href="#destek" class="block px-6 py-3 text-gray-700 hover:bg-coffee-light hover:text-coffee-dark transition-colors">Destek</a></li>
            <li><a href="#iletisim" class="block px-6 py-3 text-gray-700 hover:bg-coffee-light hover:text-coffee-dark transition-colors">İletişim</a></li>
            <li><a href="#sube-konumlari" class="block px-6 py-3 text-gray-700 hover:bg-coffee-light hover:text-coffee-dark transition-colors">Şube Konumları</a></li>
            <li><a href="#menu-icerikleri" class="block px-6 py-3 text-gray-700 hover:bg-coffee-light hover:text-coffee-dark transition-colors">Menü İçerikleri</a></li>
            <li><a href="#fiyatlar" class="block px-6 py-3 text-gray-700 hover:bg-coffee-light hover:text-coffee-dark transition-colors">Fiyatlar</a></li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main id="app-content" class="pt-16 min-h-screen pb-12">
        <!-- Content will be injected here by app.js -->
    </main>

    <footer class="bg-coffee-dark text-white text-center py-6">
        <p class="text-sm font-light opacity-80">&copy; 2026 Kahve Dükkanı. Tüm hakları saklıdır.</p>
    </footer>

    <!-- Application Logic -->
    <script src="app.js"></script>
</body>
</html>
