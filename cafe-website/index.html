<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        @layer utilities {
            .font-playfair { font-family: 'Playfair Display', serif; }
            .font-lato { font-family: 'Lato', sans-serif; }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            light: '#D7CCC8',
                            DEFAULT: '#795548',
                            dark: '#3E2723'
                        },
                        cream: '#FFFDD0'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#FFFDD0] font-lato text-[#3E2723]">
    <!-- Navbar -->
    <header class="bg-white shadow-md p-4 flex items-center justify-between sticky top-0 z-40">
        <div class="flex items-center">
            <!-- Hamburger Menu -->
            <button id="menu-btn" class="text-[#3E2723] focus:outline-none focus:ring-2 focus:ring-[#3E2723] rounded p-1 mr-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <a href="#home" class="font-playfair text-2xl font-bold text-[#3E2723] flex items-center gap-2">
                <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M18,6.9V5c0-1.1-0.9-2-2-2H4C2.9,3,2,3.9,2,5v11c0,1.1,0.9,2,2,2h12c1.1,0,2-0.9,2-2v-1.1c1.5,0.4,2.8-0.3,3.5-1.4 c0.8-1.2,0.6-2.9-0.5-4.2C20.1,8.1,19.1,7.2,18,6.9z M18,14v-2.1c0.7-0.1,1.4-0.6,1.8-1.2c0.4-0.5,0.4-1.2,0.1-1.7 c-0.5-0.7-1.3-1-2-1V14z M4,5h12v11H4V5z M6,12h8v2H6V12z"/></svg>
                Kahve Dükkanı
            </a>
        </div>
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-white shadow-xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out">
        <div class="p-6 border-b border-gray-200 flex justify-between items-center">
            <h2 class="font-playfair text-xl font-bold text-[#3E2723]">Menü</h2>
            <button id="close-btn" class="text-[#3E2723] focus:outline-none focus:ring-2 focus:ring-[#3E2723] rounded">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <nav class="p-4 flex flex-col gap-2">
            <a href="#hakkinda" class="block py-2 px-4 rounded hover:bg-gray-100 transition">Hakkında</a>
            <a href="#destek" class="block py-2 px-4 rounded hover:bg-gray-100 transition">Destek</a>
            <a href="#iletisim" class="block py-2 px-4 rounded hover:bg-gray-100 transition">İletişim</a>
            <a href="#subeler" class="block py-2 px-4 rounded hover:bg-gray-100 transition">Şube Konumları</a>
            <a href="#menu" class="block py-2 px-4 rounded hover:bg-gray-100 transition">Menü İçerikleri</a>
            <a href="#fiyatlar" class="block py-2 px-4 rounded hover:bg-gray-100 transition">Fiyatlar</a>
        </nav>
    </aside>

    <!-- Main Content Container -->
    <main id="app" class="p-4 md:p-8 max-w-5xl mx-auto min-h-[calc(100vh-80px)] bg-[#FFFDD0]">
        <!-- Content injected by app.js -->
    </main>

    <!-- Hidden div for dynamic Tailwind classes used in app.js -->
    <div class="hidden text-[#3E2723] bg-[#FFFDD0] bg-white rounded-lg shadow-md p-6 mb-8 text-center text-left grid grid-cols-1 md:grid-cols-2 gap-6 border-b border-gray-200 text-lg font-bold font-playfair font-lato w-full max-w-md mx-auto aspect-video object-cover"></div>

    <script src="app.js"></script>
</body>
</html>
