<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Web Sitesi</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cafe-brown': '#3E2723',
                        'cafe-cream': '#FFFDD0',
                    },
                    fontFamily: {
                        'heading': ['"Playfair Display"', 'serif'],
                        'body': ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cafe-cream text-cafe-brown font-body m-0 p-0 overflow-x-hidden min-h-screen flex flex-col">

    <!-- Header -->
    <header class="fixed top-0 left-0 w-full p-4 flex items-center bg-cafe-cream shadow-md z-40 h-[72px]">
        <!-- Hamburger Menu Button -->
        <button id="menu-btn" class="p-2 focus:outline-none z-50">
            <svg class="w-8 h-8 text-cafe-brown" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <!-- Logo Text -->
        <h1 class="ml-4 text-2xl font-heading font-bold">Kahve Keyfi</h1>
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-cafe-brown text-cafe-cream z-50 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-2xl pt-[72px]">
        <ul class="flex flex-col mt-4 space-y-2">
            <li><a href="#hakkinda" class="block py-3 px-6 hover:bg-opacity-80 hover:bg-white/10 transition-colors text-lg font-heading sidebar-link">Hakkında</a></li>
            <li><a href="#destek" class="block py-3 px-6 hover:bg-opacity-80 hover:bg-white/10 transition-colors text-lg font-heading sidebar-link">Destek</a></li>
            <li><a href="#iletisim" class="block py-3 px-6 hover:bg-opacity-80 hover:bg-white/10 transition-colors text-lg font-heading sidebar-link">İletişim</a></li>
            <li><a href="#subeler" class="block py-3 px-6 hover:bg-opacity-80 hover:bg-white/10 transition-colors text-lg font-heading sidebar-link">Şube Konumları</a></li>
            <li><a href="#menu" class="block py-3 px-6 hover:bg-opacity-80 hover:bg-white/10 transition-colors text-lg font-heading sidebar-link">Menü İçerikleri</a></li>
            <li><a href="#fiyatlar" class="block py-3 px-6 hover:bg-opacity-80 hover:bg-white/10 transition-colors text-lg font-heading sidebar-link">Fiyatlar</a></li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main id="app" class="flex-grow pt-[72px]">
        <!-- Content will be dynamically injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-cafe-brown text-cafe-cream text-center p-4 mt-auto">
        <p class="font-body text-sm">&copy; 2024 Kahve Keyfi. Tüm Hakları Saklıdır.</p>
    </footer>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
