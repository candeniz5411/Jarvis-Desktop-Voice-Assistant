<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Web Sitesi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            100: '#D7CCC8',
                            200: '#BCAAA4',
                            300: '#A1887F',
                            400: '#8D6E63',
                            500: '#795548',
                            600: '#6D4C41',
                            700: '#5D4037',
                            800: '#4E342E',
                            900: '#3E2723',
                        },
                        cream: '#FFFDD0',
                    },
                    fontFamily: {
                        playfair: ['"Playfair Display"', 'serif'],
                        lato: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        @layer utilities {
            .text-brown-900 {
                color: #3E2723;
            }
            .bg-cream {
                background-color: #FFFDD0;
            }
            .bg-brown-900 {
                background-color: #3E2723;
            }
        }
    </style>
</head>
<body class="bg-cream text-brown-900 font-lato min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-brown-900 text-cream p-4 flex items-center fixed w-full z-20 shadow-md">
        <!-- Hamburger Menu Button -->
        <button id="menu-btn" class="focus:outline-none mr-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
            </svg>
        </button>
        <h1 class="text-2xl font-playfair font-bold">Kafe Keyfi</h1>
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden transition-opacity"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-brown-800 text-cream transform -translate-x-full transition-transform duration-300 ease-in-out z-40 shadow-xl overflow-y-auto pt-16">
        <nav class="flex flex-col mt-4">
            <a href="#/" class="px-6 py-3 hover:bg-brown-700 transition-colors border-b border-brown-700">Ana Sayfa</a>
            <a href="#/hakkinda" class="px-6 py-3 hover:bg-brown-700 transition-colors border-b border-brown-700">Hakkında</a>
            <a href="#/destek" class="px-6 py-3 hover:bg-brown-700 transition-colors border-b border-brown-700">Destek</a>
            <a href="#/iletisim" class="px-6 py-3 hover:bg-brown-700 transition-colors border-b border-brown-700">İletişim</a>
            <a href="#/sube-konumlari" class="px-6 py-3 hover:bg-brown-700 transition-colors border-b border-brown-700">Şube Konumları</a>
            <a href="#/menu-icerikleri" class="px-6 py-3 hover:bg-brown-700 transition-colors border-b border-brown-700">Menü İçerikleri</a>
            <a href="#/fiyatlar" class="px-6 py-3 hover:bg-brown-700 transition-colors">Fiyatlar</a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-grow pt-20 pb-8 px-4 sm:px-6 lg:px-8">
        <div id="app" class="max-w-4xl mx-auto">
            <!-- Content will be injected here by app.js -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-brown-900 text-cream text-center p-4 mt-auto">
        <p>&copy; 2023 Kafe Keyfi. Tüm hakları saklıdır.</p>
    </footer>

    <!-- Force tailwind classes for JS injected content -->
    <div class="hidden grid-cols-1 md:grid-cols-2 gap-6 rounded-lg shadow-lg overflow-hidden bg-white p-6 font-playfair font-bold text-xl mb-4 text-gray-600 mb-8 border-b border-gray-200 py-3 flex justify-between items-center text-brown-900 text-3xl font-playfair mb-6 font-bold flex flex-col md:flex-row bg-white rounded-lg shadow-lg overflow-hidden h-64 object-cover md:w-1/2 p-6 md:w-1/2 text-2xl font-playfair mb-4 text-gray-700 leading-relaxed mb-6 space-y-4"></div>

    <script src="app.js"></script>
</body>
</html>
