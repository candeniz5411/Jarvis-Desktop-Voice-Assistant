<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            900: '#3E2723',
                            800: '#4E342E',
                            700: '#5D4037',
                        },
                        cream: {
                            100: '#FFFDD0',
                            200: '#FFF5E1',
                        }
                    },
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FFFDD0; /* Cream background */
            color: #3E2723; /* Dark brown text */
            font-family: 'Lato', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1, h2, h3, h4, h5, h6, .brand-font {
            font-family: 'Playfair Display', serif;
        }

        /* Sidebar transitions */
        #sidebar {
            transition: transform 0.3s ease-in-out;
            z-index: 50; /* Above header */
        }

        /* Hamburger menu svg styling */
        .hamburger-icon {
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Responsive container for views */
        #app-content {
            flex-grow: 1;
            padding-top: 64px; /* To avoid overlap with fixed header */
        }
    </style>
</head>
<body class="bg-cream-100 text-brown-900">

    <!-- Hidden div for Tailwind JIT to pick up dynamic classes injected via JS -->
    <div class="hidden text-brown-900 bg-cream-100 bg-white shadow-md rounded-lg p-6 mb-6 text-center text-xl font-bold border-b border-brown-200 py-4 pb-2 border-b-2 border-brown-900 mx-auto max-w-4xl max-w-2xl text-2xl mb-4 font-serif text-lg mb-8 mt-12 mb-2 grid grid-cols-1 md:grid-cols-2 gap-4 flex justify-between items-center w-full min-h-[50vh]"></div>

    <!-- Header -->
    <header class="fixed top-0 left-0 w-full bg-white shadow-md z-40 h-16 flex items-center px-4">
        <!-- Hamburger Menu Button -->
        <button id="menu-btn" class="p-2 mr-4 text-brown-900 hover:text-brown-700 focus:outline-none" aria-label="Toggle Menu">
            <svg class="w-8 h-8 hamburger-icon" viewBox="0 0 24 24">
                <path d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>

        <!-- Logo / Brand Name -->
        <div class="flex items-center space-x-2 cursor-pointer" onclick="window.location.hash=''">
            <svg class="w-8 h-8 text-brown-900" fill="currentColor" viewBox="0 0 24 24">
                <path d="M20,3H4A1,1,0,0,0,3,4V10a5.006,5.006,0,0,0,5,5h4a5.006,5.006,0,0,0,5-5V9h3a2,2,0,0,0,2-2V5A2,2,0,0,0,20,3ZM17,10a3,3,0,0,1-3,3H8a3,3,0,0,1-3-3V5H17ZM20,7H19V5h1ZM18,17H6a1,1,0,0,0-1,1v2a1,1,0,0,0,1,1H18a1,1,0,0,0,1-1V18A1,1,0,0,0,18,17Z"></path>
            </svg>
            <h1 class="brand-font text-2xl font-bold">Kahve Dükkanı</h1>
        </div>
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-brown-900 text-white shadow-lg transform -translate-x-full overflow-y-auto">
        <div class="p-6 flex justify-between items-center border-b border-brown-700">
            <h2 class="brand-font text-xl font-bold">Menü</h2>
            <button id="close-menu-btn" class="text-white hover:text-cream-200 focus:outline-none" aria-label="Close Menu">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <nav class="p-4">
            <ul class="space-y-2">
                <li><a href="#hakkinda" class="block py-2 px-4 rounded hover:bg-brown-700 transition duration-200">Hakkında</a></li>
                <li><a href="#destek" class="block py-2 px-4 rounded hover:bg-brown-700 transition duration-200">Destek</a></li>
                <li><a href="#iletisim" class="block py-2 px-4 rounded hover:bg-brown-700 transition duration-200">İletişim</a></li>
                <li><a href="#sube-konumlari" class="block py-2 px-4 rounded hover:bg-brown-700 transition duration-200">Şube Konumları</a></li>
                <li><a href="#menu-icerikleri" class="block py-2 px-4 rounded hover:bg-brown-700 transition duration-200">Menü İçerikleri</a></li>
                <li><a href="#fiyatlar" class="block py-2 px-4 rounded hover:bg-brown-700 transition duration-200">Fiyatlar</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content Area for SPA Views -->
    <main id="app-content" class="w-full flex-grow flex flex-col items-center">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-brown-900 text-cream-100 text-center py-4 mt-auto">
        <p>&copy; <span id="year"></span> Kahve Dükkanı. Tüm hakları saklıdır.</p>
    </footer>

    <!-- Application Logic -->
    <script src="app.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
