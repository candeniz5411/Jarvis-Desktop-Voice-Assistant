<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            light: '#6d4c41', // Brown 600
                            DEFAULT: '#3e2723', // Brown 900
                            dark: '#1b0000',
                        },
                        cream: {
                            DEFAULT: '#fffdd0',
                            light: '#fff8e1', // Amber 50
                        }
                    },
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-cream-light text-coffee font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="fixed top-0 left-0 w-full bg-coffee text-cream z-50 shadow-md h-16 flex items-center px-4 justify-between">
        <div class="flex items-center">
            <!-- Hamburger Menu Button -->
            <button id="menu-btn" class="text-cream focus:outline-none p-2 mr-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>

            <!-- Logo / Title -->
            <h1 class="text-2xl font-serif font-bold tracking-wider">
                <a href="#home" class="hover:text-cream-DEFAULT transition-colors">KAHVE DÜKKANI</a>
            </h1>
        </div>
    </header>

    <!-- Sidebar Navigation -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity duration-300"></div>

    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-coffee-dark text-cream z-50 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-2xl pt-20">
        <nav class="flex flex-col space-y-2 p-4">
            <a href="#about" class="block py-3 px-4 hover:bg-coffee rounded transition-colors text-lg">Hakkında</a>
            <a href="#support" class="block py-3 px-4 hover:bg-coffee rounded transition-colors text-lg">Destek</a>
            <a href="#contact" class="block py-3 px-4 hover:bg-coffee rounded transition-colors text-lg">İletişim</a>
            <a href="#locations" class="block py-3 px-4 hover:bg-coffee rounded transition-colors text-lg">Şube Konumları</a>
            <a href="#menu" class="block py-3 px-4 hover:bg-coffee rounded transition-colors text-lg">Menü İçerikleri</a>
            <a href="#prices" class="block py-3 px-4 hover:bg-coffee rounded transition-colors text-lg">Fiyatlar</a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main id="main-content" class="flex-grow pt-20 px-4 pb-8 container mx-auto max-w-4xl">
        <!-- Content will be injected here via JavaScript -->
        <div class="text-center py-10">
            <div class="animate-pulse bg-coffee-light h-64 w-full rounded-lg mb-4"></div>
            <h2 class="text-2xl font-serif">Yükleniyor...</h2>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-coffee text-cream text-center py-4 mt-auto">
        <p>&copy; 2023 Kahve Dükkanı. Tüm hakları saklıdır.</p>
    </footer>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
