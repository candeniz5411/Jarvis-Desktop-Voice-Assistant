<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Web Sitesi</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            100: '#D7CCC8',
                            300: '#A1887F',
                            500: '#795548',
                            700: '#5D4037',
                            900: '#3E2723',
                        },
                        cream: '#FFFDD0',
                    },
                    fontFamily: {
                        heading: ['"Playfair Display"', 'serif'],
                        body: ['"Lato"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .heading-text {
                @apply font-heading text-brown-900;
            }
            .body-text {
                @apply font-body text-brown-700;
            }
            .sidebar-link {
                @apply block px-4 py-3 text-lg font-heading text-cream hover:bg-brown-700 hover:text-white transition-colors border-b border-brown-700;
            }
        }

        body {
            @apply bg-cream;
        }

        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="font-body text-brown-700 bg-cream m-0 p-0 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-brown-900 text-cream p-4 sticky top-0 z-40 flex items-center shadow-md">
        <!-- Hamburger Menu Button -->
        <button id="menu-btn" class="p-2 mr-4 focus:outline-none hover:bg-brown-700 rounded transition-colors" aria-label="Menüyü aç">
            <svg class="w-8 h-8 fill-current" viewBox="0 0 24 24">
                <path fill-rule="evenodd" d="M3 5h18v2H3V5zm0 6h18v2H3v-2zm0 6h18v2H3v-2z"/>
            </svg>
        </button>
        <!-- Logo / Title -->
        <h1 class="text-2xl font-heading font-bold tracking-wide cursor-pointer" onclick="window.location.hash='#'">Kafe Rustique</h1>
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>

    <!-- Sliding Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-brown-900 shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col h-full overflow-y-auto">
        <div class="p-4 bg-brown-900 border-b border-brown-700 flex justify-between items-center sticky top-0">
            <span class="text-xl font-heading font-bold text-cream">Menü</span>
            <button id="close-btn" class="text-cream hover:text-white focus:outline-none p-1">
                <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                    <path fill-rule="evenodd" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/>
                </svg>
            </button>
        </div>
        <nav class="flex-grow">
            <!-- Navigation Links -->
            <a href="#" class="sidebar-link" data-route="home">Ana Sayfa</a>
            <a href="#hakkinda" class="sidebar-link" data-route="hakkinda">Hakkında</a>
            <a href="#destek" class="sidebar-link" data-route="destek">Destek</a>
            <a href="#iletisim" class="sidebar-link" data-route="iletisim">İletişim</a>
            <a href="#subeler" class="sidebar-link" data-route="subeler">Şube Konumları</a>
            <a href="#menu-icerikleri" class="sidebar-link" data-route="menu-icerikleri">Menü İçerikleri</a>
            <a href="#fiyatlar" class="sidebar-link" data-route="fiyatlar">Fiyatlar</a>
        </nav>
        <div class="p-4 mt-auto">
            <p class="text-sm text-brown-300 text-center font-body">&copy; 2023 Kafe Rustique</p>
        </div>
    </aside>

    <!-- Main Content Container -->
    <main id="content" class="flex-grow p-4 md:p-8 w-full max-w-5xl mx-auto">
        <!-- Content will be injected here via app.js -->
    </main>

    <!-- Hidden div for dynamically used Tailwind classes (safelist workaround for CDN) -->
    <div class="hidden text-brown-900 text-brown-700 text-brown-500 bg-brown-100 bg-brown-900 border-brown-300 shadow-md rounded-lg grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-8 flex-col items-center justify-center text-center max-w-2xl mx-auto p-6 mb-8 text-3xl font-heading font-bold font-body text-xl text-lg mt-4 mb-4 list-disc pl-5"></div>

    <script src="app.js"></script>
</body>
</html>
