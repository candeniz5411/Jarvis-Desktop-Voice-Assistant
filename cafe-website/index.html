<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            dark: '#3E2723',
                            light: '#4E342E',
                            cream: '#FFFDD0',
                        }
                    },
                    fontFamily: {
                        heading: ['"Playfair Display"', 'serif'],
                        body: ['"Lato"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-coffee-cream font-body text-coffee-dark min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-coffee-dark text-coffee-cream p-4 flex items-center justify-between shadow-md fixed w-full top-0 z-50">
        <div class="flex items-center">
            <button id="menu-btn" class="text-2xl mr-4 focus:outline-none">
                <i class="fas fa-bars"></i>
            </button>
            <h1 class="text-2xl font-heading font-bold">Kahve Dükkanı <i class="fas fa-mug-hot ml-2"></i></h1>
        </div>
    </header>

    <!-- Sidebar Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-coffee-light text-coffee-cream transform -translate-x-full transition-transform duration-300 z-50 pt-20 shadow-lg">
        <nav class="flex flex-col p-4 space-y-4">
            <a href="#about" class="sidebar-link hover:text-white text-lg font-bold border-b border-coffee-dark pb-2">Hakkında</a>
            <a href="#support" class="sidebar-link hover:text-white text-lg font-bold border-b border-coffee-dark pb-2">Destek</a>
            <a href="#contact" class="sidebar-link hover:text-white text-lg font-bold border-b border-coffee-dark pb-2">İletişim</a>
            <a href="#locations" class="sidebar-link hover:text-white text-lg font-bold border-b border-coffee-dark pb-2">Şube Konumları</a>
            <a href="#menu" class="sidebar-link hover:text-white text-lg font-bold border-b border-coffee-dark pb-2">Menü İçerikleri</a>
            <a href="#prices" class="sidebar-link hover:text-white text-lg font-bold border-b border-coffee-dark pb-2">Fiyatlar</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main id="app" class="flex-grow pt-20 p-6 container mx-auto">
        <!-- Dynamic Content will be injected here -->
    </main>

    <!-- Footer -->
    <footer class="bg-coffee-dark text-coffee-cream p-4 text-center mt-auto">
        <p>&copy; 2023 Kahve Dükkanı. Tüm hakları saklıdır.</p>
    </footer>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
