<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#3E2723',  // Dark brown
                            light: '#FFFDD0', // Cream
                            accent: '#8D6E63', // Lighter brown for hovers
                            white: '#FFFFFF'
                        }
                    },
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-light text-brand-dark font-sans flex flex-col min-h-screen">

    <!-- Hidden div to pre-declare dynamic utility classes -->
    <div class="hidden text-[#3E2723]"></div>

    <!-- Header -->
    <header class="bg-brand-dark text-brand-light p-4 shadow-md sticky top-0 z-40 flex items-center justify-between">
        <div class="flex items-center">
            <!-- Hamburger Menu Button -->
            <button id="menu-btn" class="p-2 mr-4 hover:text-brand-accent transition-colors focus:outline-none" aria-label="Menüyü aç">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-8 h-8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                </svg>
            </button>

            <!-- Logo / Brand Name -->
            <a href="#anasayfa" class="text-2xl font-serif font-bold tracking-wider hover:text-brand-accent transition-colors flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
                </svg>
                Kahve Dükkanı
            </a>
        </div>
    </header>

    <!-- Overlay (hidden by default) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity duration-300"></div>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-brand-light shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-6 bg-brand-dark text-brand-light flex justify-between items-center">
            <h2 class="text-xl font-serif font-bold">Menü</h2>
            <button id="close-menu-btn" class="p-1 hover:text-brand-accent transition-colors focus:outline-none" aria-label="Menüyü kapat">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <nav class="flex-1 overflow-y-auto py-4">
            <ul class="space-y-1">
                <li><a href="#anasayfa" class="block px-6 py-3 hover:bg-brand-dark/10 hover:text-brand-accent transition-colors font-medium text-lg">Ana Sayfa</a></li>
                <li><a href="#hakkinda" class="block px-6 py-3 hover:bg-brand-dark/10 hover:text-brand-accent transition-colors font-medium text-lg">Hakkında</a></li>
                <li><a href="#destek" class="block px-6 py-3 hover:bg-brand-dark/10 hover:text-brand-accent transition-colors font-medium text-lg">Destek</a></li>
                <li><a href="#iletisim" class="block px-6 py-3 hover:bg-brand-dark/10 hover:text-brand-accent transition-colors font-medium text-lg">İletişim</a></li>
                <li><a href="#sube-konumlari" class="block px-6 py-3 hover:bg-brand-dark/10 hover:text-brand-accent transition-colors font-medium text-lg">Şube Konumları</a></li>
                <li><a href="#menu-icerikleri" class="block px-6 py-3 hover:bg-brand-dark/10 hover:text-brand-accent transition-colors font-medium text-lg">Menü İçerikleri</a></li>
                <li><a href="#fiyatlar" class="block px-6 py-3 hover:bg-brand-dark/10 hover:text-brand-accent transition-colors font-medium text-lg">Fiyatlar</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content Container (SPA Router View) -->
    <main id="app" class="flex-1 w-full max-w-6xl mx-auto p-4 md:p-8">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-brand-dark text-brand-light/80 p-6 text-center mt-auto">
        <p class="text-sm">&copy; <span id="year"></span> Kahve Dükkanı. Tüm hakları saklıdır.</p>
    </footer>

    <!-- Scripts -->
    <script src="app.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
