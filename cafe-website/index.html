<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            900: '#3E2723',
                            800: '#4E342E',
                            700: '#5D4037',
                            600: '#6D4C41',
                            500: '#795548',
                            400: '#8D6E63',
                        },
                        cream: '#FFFDD0',
                    },
                    fontFamily: {
                        heading: ['"Playfair Display"', 'serif'],
                        body: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .font-heading {
                font-family: "Playfair Display", serif;
            }
            .font-body {
                font-family: Lato, sans-serif;
            }
        }
    </style>
</head>
<body class="bg-cream font-body text-brown-900 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-brown-900 text-cream p-4 flex items-center justify-between shadow-md relative z-20">
        <button id="menu-btn" class="p-2 focus:outline-none focus:ring-2 focus:ring-cream rounded z-30" aria-label="Menü">
            <!-- Hamburger Icon -->
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <div class="text-xl font-heading font-bold absolute left-1/2 transform -translate-x-1/2">
            <a href="#home" class="flex items-center gap-2">
                 <svg class="w-6 h-6 text-cream" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 15.546c-.523 0-1.046.151-1.5.454a2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.701 2.701 0 00-1.5-.454M9 6v2m3-2v2m3-2v2M9 3h.01M12 3h.01M15 3h.01M6.75 21A3.75 3.75 0 013 17.25V14.5a.75.75 0 01.75-.75h16.5a.75.75 0 01.75.75v2.75A3.75 3.75 0 0117.25 21H6.75z"></path></svg>
                 Kahve Dükkanı
            </a>
        </div>
        <div class="w-10"></div> <!-- Placeholder to balance flex-between -->
    </header>

    <!-- Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-10 hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-brown-800 text-cream transform -translate-x-full transition-transform duration-300 ease-in-out z-20 shadow-lg pt-20 flex flex-col">
        <nav class="flex-1 px-4 space-y-2">
            <a href="#hakkinda" class="block py-2 px-4 rounded hover:bg-brown-700 transition-colors font-heading text-lg">1. Hakkında</a>
            <a href="#destek" class="block py-2 px-4 rounded hover:bg-brown-700 transition-colors font-heading text-lg">2. Destek</a>
            <a href="#iletisim" class="block py-2 px-4 rounded hover:bg-brown-700 transition-colors font-heading text-lg">3. İletişim</a>
            <a href="#subeler" class="block py-2 px-4 rounded hover:bg-brown-700 transition-colors font-heading text-lg">4. Şube Konumları</a>
            <a href="#menu" class="block py-2 px-4 rounded hover:bg-brown-700 transition-colors font-heading text-lg">5. Menü İçerikleri</a>
            <a href="#fiyatlar" class="block py-2 px-4 rounded hover:bg-brown-700 transition-colors font-heading text-lg">6. Fiyatlar</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main id="main-content" class="flex-1 p-4 md:p-8 max-w-4xl mx-auto w-full relative z-0">
        <!-- Content injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-brown-900 text-cream text-center p-4 mt-auto">
        <p class="text-sm font-body">&copy; 2024 Kahve Dükkanı. Tüm hakları saklıdır.</p>
    </footer>

    <!-- Safelist for dynamic classes (optional if we don't use arbitrary values in js, but adding to be safe based on memory) -->
    <div class="hidden">
        <div class="text-[#3E2723] text-brown-900 bg-cream font-heading font-body bg-brown-100 rounded-lg shadow-md p-6 border-l-4 border-brown-600 mb-4 flex justify-between items-center text-xl font-bold grid gap-6 md:grid-cols-2 text-center text-brown-800 space-y-4"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
