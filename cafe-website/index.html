<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahve Dükkanı</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: '#3E2723',
                        cream: '#FFFDD0'
                    },
                    fontFamily: {
                        heading: ['"Playfair Display"', 'serif'],
                        body: ['"Lato"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .nav-link {
                @apply block px-4 py-3 text-lg font-body text-coffee hover:bg-cream/50 transition-colors rounded-lg mb-2;
            }
        }
        body {
            font-family: 'Lato', sans-serif;
            background-color: #FFFDD0; /* cream */
        }
        h1, h2, h3, h4, h5, h6, .font-heading {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="bg-cream text-coffee min-h-screen flex flex-col antialiased">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <!-- Hamburger Menu Button -->
            <button id="menu-btn" class="p-2 -ml-2 text-coffee hover:bg-cream/50 rounded-lg focus:outline-none focus:ring-2 focus:ring-coffee/50" aria-label="Menüyü aç">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>

            <!-- Logo -->
            <div class="flex-1 text-center font-heading text-2xl font-bold text-coffee">
                <a href="#/" class="inline-block">Kahve Dükkanı</a>
            </div>

            <!-- Placeholder for right side to keep logo centered -->
            <div class="w-10"></div>
        </div>
    </header>

    <!-- Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-white shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-4 border-b border-cream/50 flex justify-between items-center bg-coffee text-white">
            <span class="font-heading text-xl font-bold">Menü</span>
            <button id="close-btn" class="p-2 text-cream hover:text-white focus:outline-none" aria-label="Menüyü kapat">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <nav class="p-4 flex-1 overflow-y-auto">
            <a href="#/hakkinda" class="nav-link">Hakkında</a>
            <a href="#/destek" class="nav-link">Destek</a>
            <a href="#/iletisim" class="nav-link">İletişim</a>
            <a href="#/subeler" class="nav-link">Şube Konumları</a>
            <a href="#/menu-icerikleri" class="nav-link">Menü İçerikleri</a>
            <a href="#/fiyatlar" class="nav-link">Fiyatlar</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main id="app-content" class="flex-1 max-w-7xl mx-auto px-4 py-8 w-full">
        <!-- Content will be injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-coffee text-cream/80 py-6 text-center text-sm">
        <p>&copy; 2024 Kahve Dükkanı. Tüm hakları saklıdır.</p>
    </footer>

    <!-- Hidden Div for Dynamic Tailwind Classes -->
    <div class="hidden">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 gap-8"></div>
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-cream/50 hover:shadow-md transition-shadow"></div>
        <div class="text-3xl md:text-4xl lg:text-5xl font-heading font-bold text-coffee mb-6 text-center mb-8"></div>
        <div class="prose prose-lg mx-auto text-coffee/80 max-w-3xl"></div>
        <div class="text-xl font-bold text-coffee mb-2"></div>
        <div class="text-2xl font-bold text-coffee mb-4 mt-8"></div>
        <div class="flex justify-between items-center border-b border-cream/50 py-3 last:border-0"></div>
        <div class="font-bold text-lg"></div>
        <div class="text-coffee/70"></div>
        <div class="w-full h-64 md:h-96 object-cover rounded-2xl shadow-lg mb-8"></div>
        <div class="space-y-4"></div>
        <div class="max-w-md mx-auto"></div>
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-cream/50"></div>
        <div class="mb-4"></div>
        <label class="block text-sm font-bold mb-2"></label>
        <input class="w-full px-3 py-2 border border-cream/50 rounded-lg focus:outline-none focus:ring-2 focus:ring-coffee/50 bg-cream/20">
        <textarea class="w-full px-3 py-2 border border-cream/50 rounded-lg focus:outline-none focus:ring-2 focus:ring-coffee/50 bg-cream/20" rows="4"></textarea>
        <button class="w-full bg-coffee text-white font-bold py-3 px-4 rounded-lg hover:bg-coffee/90 transition-colors"></button>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
